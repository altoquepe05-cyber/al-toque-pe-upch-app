              webchat.style.visibility = 'hidden';
              webchat.style.pointerEvents = 'none';
            }
            setBotpressIsOpen(false);
            return;
          }
          document.getElementById('fab-root')?.setAttribute('data-altoque-chat-active', 'true');
          if (botpress.state !== 'opened') botpress.open?.();
          setBotpressIsOpen(botpress.state === 'opened');
        };

        const observeWidget = () => {
          if (cancelled) return;
          const root = document.getElementById('fab-root')?.shadowRoot;
          const webchat = root?.querySelector('.bpWebchat');
          if (!root || !webchat) {
            retryTimer = window.setTimeout(attachBotpress, 250);
            return;
          }
          if (webchat !== observedWidget) {
            widgetStyleObserver?.disconnect();
            observedWidget = webchat;
            widgetStyleObserver = new MutationObserver(schedulePositionBotpress);
            widgetStyleObserver.observe(webchat, { attributes: true, attributeFilter: ['style'] });
          }
          schedulePositionBotpress();
          syncBotpressOpenState();
        };

        const attachBotpress = () => {
          if (cancelled) return;
          const root = document.getElementById('fab-root')?.shadowRoot;
          if (root && !rootObserver) {
            root.host.setAttribute('data-altoque-chat-active', 'true');
            rootObserver = new MutationObserver(observeWidget);
            rootObserver.observe(root, { childList: true, subtree: true });
          }
          observeWidget();
        };

        window.addEventListener('resize', schedulePositionBotpress);
        window.addEventListener('scroll', schedulePositionBotpress, true);
        window.visualViewport?.addEventListener('resize', schedulePositionBotpress);
        window.visualViewport?.addEventListener('scroll', schedulePositionBotpress);
        resizeObserver = new ResizeObserver(schedulePositionBotpress);
        if (botpressPanelRef.current) resizeObserver.observe(botpressPanelRef.current);
        attachBotpress();
        stateTimer = window.setInterval(syncBotpressOpenState, 250);
        return () => {
          cancelled = true;
          if (positionFrame) window.cancelAnimationFrame(positionFrame);
          window.clearTimeout(retryTimer);
          window.clearInterval(stateTimer);
          window.removeEventListener('resize', schedulePositionBotpress);
          window.removeEventListener('scroll', schedulePositionBotpress, true);
          window.visualViewport?.removeEventListener('resize', schedulePositionBotpress);
          window.visualViewport?.removeEventListener('scroll', schedulePositionBotpress);
          resizeObserver.disconnect();
          rootObserver?.disconnect();
          widgetStyleObserver?.disconnect();
          const root = document.getElementById('fab-root')?.shadowRoot;
          root?.host.setAttribute('data-altoque-chat-active', 'false');
          const webchat = root?.querySelector('.bpWebchat');
          if (webchat) {
            webchat.style.visibility = 'hidden';
            webchat.style.pointerEvents = 'none';
          }
          window.botpress?.close?.();
        };
      }, [provider]);

      useEffect(() => {
        const timer = setInterval(() => {
          setBrandSloganIndex((index) => (index + 1) % AI_BRAND_SLOGANS.length);
          setClockStyleIndex((index) => (index + 1) % 4);
          setPromoMessageIndex((previousIndex) => {
            const choices = AI_PROMO_MESSAGES.map((_, index) => index).filter((index) => index !== previousIndex);
            return choices[Math.floor(Math.random() * choices.length)];
          });
        }, 5000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (provider !== 'Botpress') return undefined;
        let rootObserver;
        let retryTimer;
        let cancelled = false;
        let shadowRoot;

        const normalizeMenuText = (value) => value
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLocaleLowerCase('es')
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();

        const decorateProductRecommendations = () => {
          if (!shadowRoot) return;
          shadowRoot.querySelectorAll('.bpMessageContainer[data-direction="incoming"]').forEach((message) => {
            const responseText = [...message.querySelectorAll('.bpMessageBlocksBubble[data-direction="incoming"]')]

              .join(' ');
            const normalizedResponse = ` ${normalizeMenuText(responseText)} `;
            const recommendedDishes = INITIAL_MENU
              .map((dish) => ({
                dish,
                mentionIndex: normalizedResponse.indexOf(` ${normalizeMenuText(dish.name)} `)
              }))
              .filter(({ mentionIndex }) => mentionIndex >= 0)
              .sort((first, second) => first.mentionIndex - second.mentionIndex)
              .slice(0, 3)
              .map(({ dish }) => dish);
            const signature = recommendedDishes.map((dish) => dish.id).join(',');
            let actions = message.querySelector('.altoqueBotpressProductActions');
            const messageContent = message.querySelector('.bpMessageWithFeedback');
            if (!signature) {
              actions?.remove();
              return;
            }
            if (!messageContent) return;
            if (actions?.dataset.productIds === signature) {
              const feedback = messageContent.querySelector('.bpMessageFeedbackContainer');
              if (actions.parentElement !== messageContent) {
                messageContent.insertBefore(actions, feedback);
              }
              return;

            actions?.remove();

            actions.className = 'altoqueBotpressProductActions';

              actions.appendChild(button);
            });
            messageContent.insertBefore(actions, messageContent.querySelector('.bpMessageFeedbackContainer'));
          });
        };

        const handleProductAction = (event) => {
          if (!(event.target instanceof Element)) return;
          const button = event.target.closest('[data-altoque-dish-id]');
          if (!button || !shadowRoot?.contains(button)) return;
          const dish = INITIAL_MENU.find((item) => item.id === button.dataset.altoqueDishId);
          if (dish) onOpenCustomize(dish);
        };

        const attachBotpressActions = () => {
          if (cancelled) return;
          shadowRoot = document.getElementById('fab-root')?.shadowRoot;
          if (!shadowRoot) {
            retryTimer = window.setTimeout(attachBotpressActions, 250);
            return;
          }
          if (!rootObserver) {
            rootObserver = new MutationObserver(decorateProductRecommendations);
            rootObserver.observe(shadowRoot, { childList: true, characterData: true, subtree: true });
            shadowRoot.addEventListener('click', handleProductAction);
          }
          decorateProductRecommendations();
        };

        attachBotpressActions();
        return () => {
          cancelled = true;
          window.clearTimeout(retryTimer);
          rootObserver?.disconnect();
          shadowRoot?.removeEventListener('click', handleProductAction);
        };
      }, [provider, onOpenCustomize]);

      useEffect(() => {
        const timer = setInterval(() => {
          setPromoFontIndex((previousIndex) => {
            const choices = AI_PROMO_FONTS.map((_, index) => index).filter((index) => index !== previousIndex);
            return choices[Math.floor(Math.random() * choices.length)];
          });
        }, 10000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (storageError) return;
        try {
          window.localStorage.setItem(getCustomerStorageKey(CHAT_STORAGE_KEY, customerProfileId), JSON.stringify({ conversations, activeByProvider: activeConversationByProvider }));
          window.localStorage.removeItem('altoque-ai-memory-enabled-v1');
        } catch (error) {
          setStorageError(`No se pudo guardar el historial en este navegador: ${error.message}`);
        }
      }, [conversations, activeConversationByProvider, customerProfileId, storageError]);

      useEffect(() => {
        if (provider !== 'Botpress') return undefined;
        let rootObserver;
        let retryTimer;
        let cancelled = false;

        const syncBotpressHistory = () => {
          if (cancelled) return;
          const botpress = window.botpress;
          const root = document.getElementById('fab-root')?.shadowRoot;
          if (!botpress?.initialized || !botpress.conversationId || !root) {
            retryTimer = window.setTimeout(syncBotpressHistory, 300);
            return;
          }

          const remoteConversationId = botpress.conversationId;
          if (!rootObserver) {
            rootObserver = new MutationObserver(syncBotpressHistory);
            rootObserver.observe(root, { childList: true, characterData: true, subtree: true });
          }
          const active = conversations.find((conversation) => conversation.id === activeConversationId);
          setBotpressLiveConversationId(remoteConversationId);
          if (active?.botpressConversationId && active.botpressConversationId !== remoteConversationId) {
            const liveConversation = conversations.find((conversation) => (
              conversation.provider === 'Botpress'
              && conversation.botpressConversationId === remoteConversationId
            ));
            if (botpressArchiveSelectionRef.current) return;
            if (liveConversation) {
              setActiveConversationByProvider((previous) => ({ ...previous, Botpress: liveConversation.id }));
              return;
            }
            if (botpressRestartInProgressRef.current) return;

            const conversation = createConversation('Botpress', remoteConversationId);
            botpressTranscriptSignatureRef.current = '';
            setConversations((previous) => [conversation, ...previous]);
            setActiveConversationByProvider((previous) => ({ ...previous, Botpress: conversation.id }));
            return;
          }

          const target = conversations.find((conversation) => (
            conversation.provider === 'Botpress'
            && conversation.botpressConversationId === remoteConversationId
          )) || active || createConversation('Botpress', remoteConversationId);
          const renderedMessages = [...root.querySelectorAll('.bpMessageContainer[data-direction="outgoing"], .bpMessageContainer[data-direction="incoming"]')]
            .map((message) => {
              const sender = message.dataset.direction === 'outgoing' ? 'user' : 'ai';
              const text = [...message.querySelectorAll(`.bpMessageBlocksBubble[data-direction="${message.dataset.direction}"]`)]
                .map((bubble) => bubble.innerText.trim())
                .filter(Boolean)
                .join('\n')
                .trim();
              return text ? { sender, text } : null;
            })
            .filter(Boolean);
          const signature = `${target.id}:${remoteConversationId}:${JSON.stringify(renderedMessages)}`;
          if (botpressTranscriptSignatureRef.current === signature) return;
          botpressTranscriptSignatureRef.current = signature;

          if (target.id !== activeConversationId && !active?.botpressConversationId) {
            setActiveConversationByProvider((previous) => ({ ...previous, Botpress: target.id }));
          }
          setConversations((previous) => {
            const exists = previous.some((conversation) => conversation.id === target.id);
            const current = previous.find((conversation) => conversation.id === target.id) || target;
            const nextMessages = renderedMessages.length > 0 ? renderedMessages : current.messages;
            const firstUserMessage = nextMessages.find((message) => message.sender === 'user');
            const title = current.title === 'Nueva conversación' && firstUserMessage
              ? firstUserMessage.text.trim().slice(0, 42) || current.title
              : current.title;
            const unchanged = current.botpressConversationId === remoteConversationId
              && current.title === title
              && JSON.stringify(current.messages) === JSON.stringify(nextMessages);
            if (exists && unchanged) return previous;

            const updated = {
              ...current,
              botpressConversationId: remoteConversationId,
              title,
              updatedAt: renderedMessages.length > 0 ? Date.now() : current.updatedAt,
              messages: nextMessages
            };
            return exists
              ? previous.map((conversation) => conversation.id === target.id ? updated : conversation)
              : [updated, ...previous];
          });
        };

        syncBotpressHistory();
        return () => {
          cancelled = true;
          window.clearTimeout(retryTimer);
          rootObserver?.disconnect();
        };
      }, [provider, activeConversationId, conversations]);

      useEffect(() => {
        const container = chatMessagesRef.current;
        if (container) container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
      }, [messages, isTyping, activeConversationId]);

      const updateConversationMessages = (conversationId, nextMessage) => {
        setConversations((previous) => previous.map((conversation) => {
          if (conversation.id !== conversationId) return conversation;
          const messagesBefore = conversation.messages || [];
          const title = conversation.title === 'Nueva conversación' && nextMessage.sender === 'user'
            ? nextMessage.text.trim().slice(0, 42) || 'Nueva conversación'
            : conversation.title;
          return {
            ...conversation,
            title,
            updatedAt: Date.now(),
            messages: [...messagesBefore, nextMessage]
          };
        }));
      };

      const startNewConversation = async () => {
        if (provider === 'Botpress') {
          botpressArchiveSelectionRef.current = false;
          setBotpressHistoryError('');
          setIsRestartingBotpress(true);
          botpressRestartInProgressRef.current = true;
          try {
            const remoteId = await restartBotpressConversation();
            const conversation = createConversation(provider, remoteId);
            botpressTranscriptSignatureRef.current = '';
            setBotpressLiveConversationId(remoteId);
            setConversations((previous) => [conversation, ...previous]);
            setActiveConversationByProvider((previous) => ({ ...previous, [provider]: conversation.id }));
            setHistoryOpen(false);
            return;
          } catch (error) {
            console.error('No se pudo iniciar una conversación nueva de Botpress:', error);
            setBotpressHistoryError(`No se pudo iniciar una conversación nueva: ${error.message}`);
            return;
          } finally {
            window.setTimeout(() => { botpressRestartInProgressRef.current = false; }, 300);
            setIsRestartingBotpress(false);
          }
        }

        const conversation = createConversation(provider);
        setConversations((previous) => [conversation, ...previous]);
        setActiveConversationByProvider((previous) => ({ ...previous, [provider]: conversation.id }));
        setHistoryOpen(false);
      };

      const deleteConversation = async (conversationId) => {
        botpressArchiveSelectionRef.current = false;
        const conversationToDelete = conversations.find((conversation) => conversation.id === conversationId);
        const deletingCurrentBotpressChat = provider === 'Botpress'
          && conversationId === activeConversationId
          && (!conversationToDelete?.botpressConversationId
            || conversationToDelete.botpressConversationId === botpressLiveConversationId);
        let replacement = null;
        if (deletingCurrentBotpressChat) {
          setIsRestartingBotpress(true);
          botpressRestartInProgressRef.current = true;
          try {
            const remoteId = await restartBotpressConversation();
            replacement = createConversation('Botpress', remoteId);
            setBotpressLiveConversationId(remoteId);
            botpressTranscriptSignatureRef.current = '';
            setBotpressHistoryError('');
          } catch (error) {
            console.error('No se pudo borrar la conversación activa de Botpress:', error);
            setBotpressHistoryError(`No se pudo borrar la conversación activa: ${error.message}`);
            return;
          } finally {
            window.setTimeout(() => { botpressRestartInProgressRef.current = false; }, 300);
            setIsRestartingBotpress(false);
          }
        }

        const remaining = conversations.filter((conversation) => conversation.id !== conversationId);
        if (replacement) {
          remaining.unshift(replacement);
          setActiveConversationByProvider((previous) => ({ ...previous, Botpress: replacement.id }));
        } else if (conversationId === activeConversationId) {
          const remainingForProvider = remaining
            .filter((conversation) => conversation.provider === provider)
            .sort((a, b) => b.updatedAt - a.updatedAt);
          if (remainingForProvider.length > 0) {
            setActiveConversationByProvider((previous) => ({ ...previous, [provider]: remainingForProvider[0].id }));
          } else {
            const conversation = createConversation(provider);
            remaining.unshift(conversation);
            setActiveConversationByProvider((previous) => ({ ...previous, [provider]: conversation.id }));
          }
        }
        setConversations(remaining);
      };

      const getLearnedPreferences = () => conversations
        .filter((conversation) => conversation.provider === provider && conversation.id !== activeConversationId)
        .sort((a, b) => a.updatedAt - b.updatedAt)
        .flatMap((conversation) => (conversation.messages || [])
          .filter((message) => message.sender === 'user')
          .slice(-3)
          .map((message) => message.text.trim())
          .filter(Boolean))
        .slice(-20)
        .map((text) => `- ${text}`)
        .join('\n')
        .slice(-3500);

      const restartBotpressConversation = async () => {
        const botpress = window.botpress;
        if (!botpress?.initialized) {
          throw new Error('Botpress todavía no está listo.');
        }

        botpress.open?.();
        const rootDeadline = Date.now() + 10000;
        let root = null;
        while (Date.now() < rootDeadline) {
          root = document.getElementById('fab-root')?.shadowRoot;
          if (root?.querySelector('.bpWebchat')) break;
          await new Promise((resolve) => window.setTimeout(resolve, 100));
        }
        if (!root?.querySelector('.bpWebchat')) {
          throw new Error('El chat de Botpress no terminó de cargar.');
        }
        const previousRemoteId = botpress.conversationId;
        let header = null;
        let previousDisplay = '';
        let previousDisplayPriority = '';
        try {
          let newConversationButton = root.querySelector('.bpConversationHistoryNewConversationButton');
          if (!newConversationButton) {
            const headerDeadline = Date.now() + 10000;
            let historyButton = null;
            while (Date.now() < headerDeadline) {
              historyButton = root.querySelector('[aria-label="Show Recent Conversations Button"]');
              if (historyButton) break;
              await new Promise((resolve) => window.setTimeout(resolve, 100));
            }
            if (!historyButton) {
              throw new Error('Botpress no mostró el control para abrir sus conversaciones.');
            }

            header = historyButton.closest('.bpHeaderContainer');
            if (header) {
              previousDisplay = header.style.getPropertyValue('display');
              previousDisplayPriority = header.style.getPropertyPriority('display');
              header.style.setProperty('display', 'flex', 'important');
            }
            historyButton.dispatchEvent(new MouseEvent('click', {
              bubbles: true,
              cancelable: true,
              composed: true,
              view: window
            }));

            const historyDeadline = Date.now() + 10000;
            while (Date.now() < historyDeadline) {
              newConversationButton = root.querySelector('.bpConversationHistoryNewConversationButton');
              if (newConversationButton) break;
              await new Promise((resolve) => window.setTimeout(resolve, 100));
            }
            if (!newConversationButton) {
              throw new Error('Botpress no pudo abrir el historial de conversaciones.');
            }
          }

          newConversationButton.click();
          const conversationDeadline = Date.now() + 15000;
          let remoteId = '';
          while (Date.now() < conversationDeadline) {
            if (remoteId && remoteId !== previousRemoteId) {
              break;
            }
            remoteId = botpress.conversationId;
            await new Promise((resolve) => window.setTimeout(resolve, 100));
          }
          if (!remoteId || remoteId === previousRemoteId) {
            throw new Error('Botpress no inició una conversación nueva.');
          }

          const composerDeadline = Date.now() + 10000;
          while (Date.now() < composerDeadline) {
            if (root.querySelector('.bpComposerInput')) return remoteId;
            await new Promise((resolve) => window.setTimeout(resolve, 100));
          }
          throw new Error('La conversación nueva de Botpress no terminó de cargar.');
        } finally {
          if (header) {
            if (previousDisplay) {
              header.style.setProperty('display', previousDisplay, previousDisplayPriority);
            } else {
              header.style.removeProperty('display');
            }
          }
        }
      };

      const selectProvider = (nextProvider) => {
        if (nextProvider === 'Botpress') {
          botpressArchiveSelectionRef.current = false;
          const remoteConversationId = window.botpress?.conversationId;
          if (remoteConversationId) {
            const liveConversation = conversations.find((conversation) => (
              conversation.provider === 'Botpress'
              && conversation.botpressConversationId === remoteConversationId
            )) || createConversation('Botpress', remoteConversationId);
            if (!conversations.some((conversation) => conversation.id === liveConversation.id)) {
              setConversations((previous) => [liveConversation, ...previous]);
            }
            setActiveConversationByProvider((previous) => ({ ...previous, Botpress: liveConversation.id }));
          }
          setProvider('Botpress');
          setHistoryOpen(false);
          return;
        }
        if (nextProvider === provider) return;
        const selectedId = activeConversationByProvider[nextProvider];
        const existing = conversations.find((conversation) => (
          conversation.id === selectedId && conversation.provider === nextProvider
        )) || conversations
          .filter((conversation) => conversation.provider === nextProvider)
          .sort((a, b) => b.updatedAt - a.updatedAt)[0];
        const conversation = existing || createConversation(nextProvider);
        if (!existing) setConversations((previous) => [conversation, ...previous]);
        setActiveConversationByProvider((previous) => ({ ...previous, [nextProvider]: conversation.id }));
        setProvider(nextProvider);
        setInput('');
        setHistoryOpen(false);
      };
      const [currentEncouragement, setCurrentEncouragement] = useState(
        () => ENCOURAGEMENT_CARDS[Math.floor(Math.random() * 8)]
      );
      const [encouragementTone, setEncouragementTone] = useState(() => Math.floor(Math.random() * 5));
      const [outgoingEncouragement, setOutgoingEncouragement] = useState(null);
      const currentEncouragementRef = useRef(currentEncouragement);
      const previousStickerRef = useRef(currentEncouragement.sticker);
      const previousEncouragementToneRef = useRef(encouragementTone);
      const usedEncouragementsRef = useRef({ general: [], food: [] });
      const outgoingTimerRef = useRef(null);

      const advanceEncouragement = (mode = foodMode) => {
        const modeKey = mode ? 'food' : 'general';
        const pool = ENCOURAGEMENT_CARDS.filter((card) => card.foodMode === mode);
        let available = pool.filter((card) => !usedEncouragementsRef.current[modeKey].includes(card.id));

        if (available.length === 0) {
          usedEncouragementsRef.current[modeKey] = [];
          available = pool;
        }

        const differentCard = available.filter((card) => card.id !== currentEncouragementRef.current.id);
        if (differentCard.length > 0) available = differentCard;

        const differentSticker = available.filter((card) => card.sticker !== previousStickerRef.current);
        if (differentSticker.length > 0) available = differentSticker;

        const nextCard = available[Math.floor(Math.random() * available.length)];
        const availableTones = [0, 1, 2, 3, 4].filter((tone) => tone !== previousEncouragementToneRef.current);
        const nextTone = availableTones[Math.floor(Math.random() * availableTones.length)];
        usedEncouragementsRef.current[modeKey].push(nextCard.id);
        setOutgoingEncouragement({
          card: currentEncouragementRef.current,
          tone: previousEncouragementToneRef.current
        });
        if (outgoingTimerRef.current) window.clearTimeout(outgoingTimerRef.current);
        outgoingTimerRef.current = window.setTimeout(() => {
          setOutgoingEncouragement(null);
          outgoingTimerRef.current = null;
        }, 900);
        currentEncouragementRef.current = nextCard;
        previousStickerRef.current = nextCard.sticker;
        previousEncouragementToneRef.current = nextTone;
        setEncouragementTone(nextTone);
        setCurrentEncouragement(nextCard);
      };

      useEffect(() => () => {
        if (outgoingTimerRef.current) window.clearTimeout(outgoingTimerRef.current);
      }, []);

      const buildLocalFallback = (textToSend) => {
        const normalizedText = textToSend.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        const isGreeting = /^(hola|buenas|buenos dias|buenas tardes|buenas noches|gracias|muchas gracias|ok|okay|listo)[!.? ]*$/.test(normalizedText.trim());
        if (isGreeting) {
          return {
            text: '¡Hola! Estoy aquí para ayudarte. Cuéntame qué se te antoja y buscamos una buena opción.',
            dish: null
          };
        }

        const excludesDrink = /\b(?:no\s+(?:quiero\s+)?(?:una?\s+)?|sin\s+|evita(?:r)?\s+)(?:bebida|tomar|beber|jugo|chicha|agua|refresco|maracuya)\b/.test(normalizedText);
        const excludesFood = /\b(?:no\s+(?:quiero\s+)?(?:un\s+)?|sin\s+|evita(?:r)?\s+)(?:plato|comida|almuerzo|menu|lomo|quinua|ceviche|combo)\b/.test(normalizedText);
        const excludedCategory = excludesFood && excludesDrink
          ? null
          : excludesFood
            ? 'bebidas'
            : excludesDrink
              ? 'comida'
              : null;
        const namedDish = !excludedCategory && INITIAL_MENU.find((item) => normalizedText.includes(
          item.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
        ));
        if (namedDish) {
          return {
            text: `${namedDish.name}: S/${namedDish.price.toFixed(2)}, listo en ${namedDish.time}. ${namedDish.description}.`,
            dish: namedDish
          };
        }

        const asksForDrink = /\b(bebida|bebidas|tomar|beber|sed|jugo|chicha|agua|refresco|refrescante|maracuya)\b/.test(normalizedText);
        const asksForFood = /\b(plato|comida|comer|almorzar|cenar|menu|lomo|quinua|ceviche|combo|hambre|ensalada|pota)\b/.test(normalizedText);
        const asksForMenu = /\b(recomiend|recomend|antojo|pedido|pedir|pide|menu|carta|comedor|presupuesto|precio|cuesta|opcion|ligero|fresco|rapido)\b/.test(normalizedText);
        if (asksForDrink || asksForFood || asksForMenu) {
          const category = excludedCategory || (asksForDrink && !asksForFood ? 'bebidas' : asksForFood ? 'comida' : null);
          const budgetMatch = normalizedText.match(/s\/?\s*(\d+(?:[.,]\d+)?)/);
          const budget = budgetMatch ? Number(budgetMatch[1].replace(',', '.')) : null;
          let options = INITIAL_MENU.filter((item) => (
            category === 'bebidas'
              ? item.category === 'bebidas'
              : category === 'comida'
                ? item.category !== 'bebidas'
                : true
          ));
          if (budget !== null) {
            const withinBudget = options.filter((item) => item.price <= budget);
            if (withinBudget.length > 0) options = withinBudget;
          }
          const historicalFavorites = orderHistoryForAI
            .map((purchasedItem) => ({
              count: purchasedItem.quantity,
              item: options.find((menuItem) => menuItem.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
                === purchasedItem.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase())
            }))
            .filter(({ item }) => item)
            .sort((first, second) => second.count - first.count);
          const recommendedDish = historicalFavorites[0]?.item || options.find((item) => item.isPopular) || options[0];
          if (recommendedDish) {
            const lead = recommendedDish.category === 'bebidas' ? 'Para tomar' : 'Para comer';
            return {
              text: `${lead}, te recomiendo ${recommendedDish.name} por S/${recommendedDish.price.toFixed(2)}. Está listo en ${recommendedDish.time}: ${recommendedDish.description}.`,
              dish: recommendedDish
            };
          }
        }

        return {
          text: 'Puedo ayudarte a elegir entre las opciones del menú. Cuéntame si buscas comida o bebida, cuánto tiempo tienes y tu presupuesto.',
          dish: null
        };
      };

      useEffect(() => {
        const timer = setInterval(() => advanceEncouragement(foodMode), 5000);
        return () => clearInterval(timer);
      }, [foodMode]);

      const handleSend = async (textToSend) => {
        const text = textToSend || input;
        if (!text.trim() || isTyping) return;

        const conversationId = activeConversationId;
        const userMessage = { sender: 'user', text };
        const conversationHistory = [...messages, userMessage];
        updateConversationMessages(conversationId, userMessage);
        setInput('');
        setIsTyping(true);

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider,
              text,
              history: conversationHistory.slice(-6).map(({ sender, text: messageText }) => ({ sender, text: messageText.slice(-500) })),
              memory: getLearnedPreferences().slice(-1600),
              orderHistory: orderHistoryForAI
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `${provider} no pudo responder. Inténtalo otra vez.`);

          const recommendedDish = INITIAL_MENU.find((item) => item.id === result.dishId);
          const dishMatchesIntent = result.intent === 'ninguna'
            ? !recommendedDish
            : result.intent === 'bebidas'
              ? recommendedDish?.category === 'bebidas'
              : result.intent === 'comida'
                ? recommendedDish && recommendedDish.category !== 'bebidas'
                : Boolean(recommendedDish);
          if (!dishMatchesIntent || typeof result.reply !== 'string') {
            throw new Error('La respuesta no incluyó una recomendación válida del tipo solicitado. Inténtalo de nuevo.');
          }

          const sources = Array.isArray(result.sources)
            ? result.sources.filter((source) => {
              try {
                return ['http:', 'https:'].includes(new URL(source.url).protocol);
              } catch {
                return false;
              }
            })
            : [];
          updateConversationMessages(conversationId, {
            sender: 'ai',
            text: result.reply,
            dish: recommendedDish,
            local: result.local === true,
            webSearchUsed: result.webSearchUsed === true,
            engine: result.engine,
            persona: provider,
            sources
          });
        } catch (error) {
          const localFallback = buildLocalFallback(text);
          updateConversationMessages(conversationId, {
            sender: 'ai',
            text: localFallback.text,
            dish: localFallback.dish,
            local: true,
            webSearchUsed: false,
            persona: provider,
            engine: 'Al Toque'
          });
        } finally {
          setIsTyping(false);
        }
      };

      return (
        <div className="space-y-4 pt-2">
          <div className="flex items-center justify-between gap-2">
            <div className="flex items-center space-x-2">
              <div className="ai-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="presentation">
                  <defs>
                    <linearGradient id="aiSparkleGradient" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stopColor="#ffbd32" />
                      <stop offset="28%" stopColor="#ff668e" />
                      <stop offset="55%" stopColor="#9c69ff" />
                      <stop offset="78%" stopColor="#37bdec" />
                      <stop offset="100%" stopColor="#40c98a" />
                    </linearGradient>
                  </defs>
                  <path className="ai-brand-sparkle" d="M13.9 2.6c.7 5.8 3.1 8.2 8.9 8.9-5.8.7-8.2 3.1-8.9 8.9-.7-5.8-3.1-8.2-8.9-8.9 5.8-.7 8.2-3.1 8.9-8.9Z" />
                  <path className="ai-brand-sparkle" d="M24.4 18.2c.4 3.1 1.7 4.4 4.8 4.8-3.1.4-4.4 1.7-4.8 4.8-.4-3.1-1.7-4.4-4.8-4.8 3.1-.4 4.4-1.7 4.8-4.8Z" />
                  <circle cx="5" cy="24" r="1.2" fill="#f3b946" />
                </svg>

    const DELIVERY_DURATION_MS = 300000;
    const DELIVERY_ROUTE_START = [-12.1348222, -77.0260012];
    const DELIVERY_ROUTE_END = [-12.1341675, -77.0260721];
    // Google Maps is cross-origin, so these points trace the visible route in the fixed map viewport.
    const WALKING_ROUTE_POINTS = [
      { x: 58, y: 72 },
      { x: 54, y: 68 },
      { x: 50, y: 64 },
      { x: 46, y: 60 },
      { x: 43, y: 56 },
      { x: 40, y: 52 },
      { x: 38, y: 56 },
      { x: 40, y: 51 },
      { x: 42, y: 47 },
      { x: 44, y: 42 },
      { x: 47, y: 37 },
      { x: 49, y: 32 },
      { x: 52, y: 28 },
      { x: 51, y: 23 },
      { x: 50, y: 19 },
      { x: 48, y: 15 },
      { x: 46, y: 11 },
      { x: 45, y: 7 },
      { x: 44, y: 3 }
    ];
    const RIDER_WALKING_ROUTE_POINTS = [
      { x: 59, y: 77 },
      { x: 56, y: 73 },
      { x: 52, y: 68 },
      { x: 48, y: 64 },
      { x: 44, y: 59 },
      { x: 41, y: 55 },
      { x: 39, y: 51 },
      { x: 36, y: 47 },
      { x: 33, y: 43 },
      { x: 30, y: 39 },
      { x: 27, y: 35 },
      { x: 24, y: 31 },
      { x: 21, y: 27 },
      { x: 17, y: 23 },
      { x: 10, y: 20 }
    ];

    function getWalkingRoutePosition(progress, routePoints = WALKING_ROUTE_POINTS) {
      const safeProgress = Math.max(0, Math.min(1, progress));
      const segmentLengths = routePoints.slice(1).map((point, index) => {
        const previousPoint = routePoints[index];
        return Math.hypot((point.x - previousPoint.x) * (4 / 3), point.y - previousPoint.y);
      });
      const totalLength = segmentLengths.reduce((sum, length) => sum + length, 0);
      let remainingLength = totalLength * safeProgress;

      for (let index = 0; index < segmentLengths.length; index += 1) {
        const segmentLength = segmentLengths[index];
        const start = routePoints[index];
        const end = routePoints[index + 1];
        if (remainingLength <= segmentLength || index === segmentLengths.length - 1) {
          const ratio = segmentLength === 0 ? 0 : Math.min(1, remainingLength / segmentLength);
          return {
            x: start.x + (end.x - start.x) * ratio,
            y: start.y + (end.y - start.y) * ratio
          };
        }
        remainingLength -= segmentLength;
      }

      return routePoints[routePoints.length - 1];
    }

    function getWalkingGpsPosition(location, routeOrigin, routeDestination, mapWidth, mapHeight) {
      if (!location
        || !Number.isFinite(location.latitude)
        || !Number.isFinite(location.longitude)
        || !Number.isFinite(mapWidth)
        || !Number.isFinite(mapHeight)
        || mapWidth <= 0
        || mapHeight <= 0) return null;

      const worldSize = 256 * (2 ** 18);
      const toWorldPoint = ([latitude, longitude]) => {
        const clampedLatitude = Math.max(-85.05112878, Math.min(85.05112878, latitude));
        const latitudeRadians = (clampedLatitude * Math.PI) / 180;
        return {
          x: ((longitude + 180) / 360) * worldSize,
          y: ((1 - Math.asinh(Math.tan(latitudeRadians)) / Math.PI) / 2) * worldSize
        };
      };
      const origin = toWorldPoint(routeOrigin);
      const destination = toWorldPoint(routeDestination);
      const rider = toWorldPoint([location.latitude, location.longitude]);
      const centerX = (origin.x + destination.x) / 2;
      const centerY = (origin.y + destination.y) / 2;
      let horizontalOffset = rider.x - centerX;
      if (horizontalOffset > worldSize / 2) horizontalOffset -= worldSize;
      if (horizontalOffset < -worldSize / 2) horizontalOffset += worldSize;

      return {
        x: 50 + (horizontalOffset / mapWidth) * 100,
        y: 50 + ((rider.y - centerY) / mapHeight) * 100
      };
    }

    }

        return () => {
