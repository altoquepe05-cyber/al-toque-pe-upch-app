        if (network.id === 'discord') return <svg {...svgProps} fill="currentColor"><path d="M19.7 5.4a17 17 0 0 0-4.2-1.3l-.5 1a15.5 15.5 0 0 0-6 0l-.5-1a17 17 0 0 0-4.2 1.3C1.7 9.1 1 12.7 1.4 16.3a17 17 0 0 0 5.2 2.6l1.1-1.8-1.7-.8.4-.3a12 12 0 0 0 11.2 0l.4.3-1.7.8 1.1 1.8a17 17 0 0 0 5.2-2.6c.5-4.2-.8-7.8-2.9-10.9ZM8.8 14.1c-1 0-1.7-.9-1.7-1.9s.8-1.9 1.7-1.9 1.7.9 1.7 1.9-.8 1.9-1.7 1.9Zm6.4 0c-1 0-1.7-.9-1.7-1.9s.8-1.9 1.7-1.9 1.7.9 1.7 1.9-.8 1.9-1.7 1.9Z"></path></svg>;
        if (network.id === 'telegram') return <svg {...svgProps} fill="currentColor"><path d="m21.4 4.2-3.2 15.1c-.2 1.1-.8 1.4-1.7.9l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.8-8c.4-.3-.1-.5-.6-.2L6.1 12.9 1.5 11.5c-1-.3-1-1 .2-1.5L20 2.9c.9-.3 1.7.2 1.4 1.3Z"></path></svg>;
        if (network.id === 'threads') return <svg {...svgProps} fill="currentColor"><path d="M12.186 24h-.007c-3.581-.024-6.334-1.205-8.184-3.509C2.35 18.44 1.5 15.586 1.472 12.01v-.017c.03-3.579.879-6.43 2.525-8.482C5.845 1.205 8.6.024 12.18 0h.014c2.746.02 5.043.725 6.826 2.098 1.677 1.29 2.858 3.13 3.509 5.467l-2.04.569c-1.104-3.96-3.898-5.984-8.304-6.015-2.91.022-5.11.936-6.54 2.717C4.307 6.504 3.616 8.914 3.589 12c.027 3.086.718 5.496 2.057 7.164 1.43 1.783 3.631 2.698 6.54 2.717 2.623-.02 4.358-.631 5.8-2.045 1.647-1.613 1.618-3.593 1.09-4.798-.31-.71-.873-1.3-1.634-1.75-.192 1.352-.622 2.446-1.284 3.272-.886 1.102-2.14 1.704-3.73 1.79-1.202.065-2.361-.218-3.259-.801-1.063-.689-1.685-1.74-1.752-2.964-.065-1.19.408-2.285 1.33-3.082.88-.76 2.119-1.207 3.583-1.291a13.853 13.853 0 0 1 3.02.142c-.126-.742-.375-1.332-.75-1.757-.513-.586-1.308-.883-2.359-.89h-.029c-.844 0-1.992.232-2.721 1.32L7.734 7.847c.98-1.454 2.568-2.256 4.478-2.256h.044c3.194.02 5.097 1.975 5.287 5.388.108.046.216.094.321.142 1.49.7 2.58 1.761 3.154 3.07.797 1.82.871 4.79-1.548 7.158-1.85 1.81-4.094 2.628-7.277 2.65Zm1.003-11.69c-.242 0-.487.007-.739.021-1.836.103-2.98.946-2.916 2.143.067 1.256 1.452 1.839 2.784 1.767 1.224-.065 2.818-.543 3.086-3.71a10.5 10.5 0 0 0-2.215-.221z"/></svg>;
        if (network.id === 'messenger') return <svg {...svgProps} fill="currentColor"><path d="M12 2.2c-5.7 0-10 4.1-10 9.6 0 2.9 1.3 5.4 3.4 7.1.2.2.4.5.4.8l.1 2.2 2.2-1.2c.3-.2.7-.2 1-.1.9.3 1.9.5 2.9.5 5.7 0 10-4.1 10-9.6s-4.3-9.3-10-9.3Zm1 12.9-2.6-2.8-5.1 2.8 5.6-6 2.6 2.8 5.1-2.8-5.6 6Z"></path></svg>;
        if (network.id === 'sms') return <svg {...svgProps} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-2 2v-9.5A7.5 7.5 0 0 1 10.5 4H12"></path><path d="m16 2 1.3 2.7L20 6l-2.7 1.3L16 10l-1.3-2.7L12 6l2.7-1.3L16 2Z"></path></svg>;
        return <i data-lucide={network.icon} className="h-5 w-5"></i>;
      };

      const launchShareNetwork = (network, post) => {
        try {
          window.open(network.destination(post), '_blank', 'noopener,noreferrer');
          setShareStatus(`Se abrió ${network.label}. Si quieres publicar el video con la marca de Al Toque Pe, descárgalo y selecciónalo en esa aplicación.`);
        } catch (openError) {
          console.error(`No se pudo abrir ${network.label}:`, openError);
          setShareStatus(`No se pudo abrir ${network.label}. Revisa si tu navegador bloqueó la ventana emergente.`);
        }
      };

      const toggleReelNotifications = async () => {
        if (reelNotificationsEnabled) {
          setReelNotificationsEnabled(false);
          try {
            localStorage.setItem('altoque_reels_notifications', 'false');
          } catch (storageError) {
            console.error('No se pudo guardar la preferencia de notificaciones de Reels:', storageError);
            setNotice('No se pudo guardar la preferencia de notificaciones.');
          }
          return;
        }
        if (!('Notification' in window)) {
          setNotice('Este navegador no admite notificaciones. Puedes seguir revisando los Reels desde la aplicación.');
          return;
        }
        let permission;
        try {
          permission = Notification.permission;
          if (permission === 'default') permission = await Notification.requestPermission();
        } catch (permissionError) {
          console.error('No se pudo solicitar permiso para las notificaciones de Reels:', permissionError);
          setNotice('No se pudo solicitar permiso para las notificaciones en este navegador.');
          return;
        }
        if (permission !== 'granted') {
          setNotice(permission === 'denied'
            ? 'Las notificaciones están bloqueadas en el navegador. Habilítalas en la configuración del sitio.'
            : 'No se concedió permiso para enviar notificaciones.');
          return;
        }
        setReelNotificationsEnabled(true);
        try {
          localStorage.setItem('altoque_reels_notifications', 'true');
          setNotice('Te avisaremos cuando haya un Reel nuevo mientras la aplicación esté abierta.');
        } catch (storageError) {
          console.error('No se pudo guardar la preferencia de notificaciones de Reels:', storageError);
          setNotice('No se pudo guardar la preferencia de notificaciones.');
        }
      };

      const createWatermarkedReelFile = async (post) => {
        const response = await fetch(post.videoUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`No se pudo descargar el Reel (${response.status}).`);
        const sourceBlob = await response.blob();
        const sourceUrl = URL.createObjectURL(sourceBlob);
        const video = document.createElement('video');
        video.playsInline = true;
        video.preload = 'auto';
        video.muted = true;
        video.style.cssText = 'position:fixed;left:-10000px;top:0;width:2px;height:2px;opacity:0;pointer-events:none;';
        document.body.appendChild(video);
        let activeStreams = [];
        let animationFrame = 0;
        let exportTimeout = 0;

        try {
          video.src = sourceUrl;
          await new Promise((resolve, reject) => {
            video.onloadedmetadata = resolve;
            video.onerror = () => reject(new Error('No se pudo abrir el video para añadir la marca de agua.'));
          });
          const sourceWidth = video.videoWidth;
          const sourceHeight = video.videoHeight;
          if (!sourceWidth || !sourceHeight) throw new Error('El video no tiene dimensiones válidas.');
          const scale = Math.min(1, 1080 / sourceWidth);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(2, Math.round(sourceWidth * scale));
          canvas.height = Math.max(2, Math.round(sourceHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('Este navegador no permite procesar el video.');
          const watermarkLogo = new Image();
          watermarkLogo.src = './al-toque-reel-watermark.png';
          await watermarkLogo.decode();

          const captureStream = canvas.captureStream?.bind(canvas);
          const captureVideo = video.captureStream || video.mozCaptureStream;
          if (!captureStream || !captureVideo || !window.MediaRecorder) {
            throw new Error('Este navegador no admite exportar videos con marca de agua. Prueba desde Chrome o Edge actualizado.');
          }

          const canvasStream = captureStream(30);
          const sourceStream = captureVideo.call(video);
          activeStreams = [canvasStream, sourceStream];
          const outputStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...sourceStream.getAudioTracks()
          ]);
          const mimeType = [
            'video/mp4',
            'video/webm;codecs=vp9,opus',
            'video/webm;codecs=vp8,opus',
            'video/webm'
          ].find((candidate) => MediaRecorder.isTypeSupported(candidate));
          if (!mimeType) throw new Error('Este navegador no tiene un formato compatible para exportar el video.');

          const recorder = new MediaRecorder(outputStream, { mimeType });
          const chunks = [];
          const watermarkSource = { x: 160, y: 199, width: 708, height: 346 };
          const watermarkWidth = Math.min(Math.round(canvas.width * 0.24), 280);
          const watermarkHeight = Math.round(watermarkWidth * watermarkSource.height / watermarkSource.width);
          const watermarkPadding = Math.max(12, Math.round(canvas.width * 0.025));

          const drawFrame = () => {
            if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
              context.drawImage(video, 0, 0, canvas.width, canvas.height);
              const left = canvas.width - watermarkWidth - watermarkPadding;
              const top = canvas.height - watermarkHeight - watermarkPadding;
              const cornerRadius = watermarkHeight / 2;
              context.save();
              context.beginPath();
              context.moveTo(left + cornerRadius, top);
              context.arcTo(left + watermarkWidth, top, left + watermarkWidth, top + watermarkHeight, cornerRadius);
              context.arcTo(left + watermarkWidth, top + watermarkHeight, left, top + watermarkHeight, cornerRadius);
              context.arcTo(left, top + watermarkHeight, left, top, cornerRadius);
              context.arcTo(left, top, left + watermarkWidth, top, cornerRadius);
              context.closePath();
              context.clip();
              context.globalAlpha = 0.78;
              context.drawImage(
                watermarkLogo,
                watermarkSource.x, watermarkSource.y, watermarkSource.width, watermarkSource.height,
                left, top, watermarkWidth, watermarkHeight
              );
              context.restore();
            }
            animationFrame = requestAnimationFrame(drawFrame);
          };

          const recordedBlob = new Promise((resolve, reject) => {
            recorder.ondataavailable = (event) => {
              if (event.data.size) chunks.push(event.data);
            };
            recorder.onerror = () => {
              window.clearTimeout(exportTimeout);
              reject(new Error('Ocurrió un error al procesar el video con la marca de agua.'));
            };
            recorder.onstop = () => {
              window.clearTimeout(exportTimeout);
              resolve(new Blob(chunks, { type: recorder.mimeType || mimeType }));
            };
            const stopRecording = () => {
              cancelAnimationFrame(animationFrame);
              if (recorder.state !== 'inactive') recorder.stop();
            };
            video.onended = stopRecording;
            video.ontimeupdate = () => {
              if (Number.isFinite(video.duration) && video.currentTime >= video.duration) stopRecording();
            };
            video.onerror = () => reject(new Error('El video dejó de estar disponible durante la exportación.'));
            exportTimeout = window.setTimeout(() => {
              stopRecording();
              reject(new Error('La exportación tardó demasiado y se detuvo. Intenta descargarlo de nuevo.'));
            }, (video.duration * 1000) + 15_000);
          });

          drawFrame();
          recorder.start(250);
          try {
            await video.play();
          } catch {
            if (recorder.state !== 'inactive') recorder.stop();
            throw new Error('No se pudo procesar el video. Vuelve a intentarlo desde el navegador.');
          }
          const blob = await recordedBlob;
          if (!blob.size) throw new Error('No se generó el archivo de video.');
          const extension = (recorder.mimeType || mimeType).includes('mp4') ? 'mp4' : 'webm';
          return new File([blob], `al-toque-reel-${post.id}.${extension}`, { type: blob.type });
        } finally {
          window.clearTimeout(exportTimeout);
          cancelAnimationFrame(animationFrame);
          activeStreams.forEach((stream) => stream.getTracks().forEach((track) => track.stop()));
          video.pause();
          video.remove();
          URL.revokeObjectURL(sourceUrl);
        }
      };

      const prepareShareFile = async (post, target) => {
        setShareTarget(target);
        setShareFile(null);
        setShareBusy(true);
        setShareStatus('Añadiendo la marca de agua. El video se procesa en tiempo real; no cierres esta ventana.');
        try {
          const file = await createWatermarkedReelFile(post);
          setShareFile(file);
          setShareStatus('Video listo con el logo de Al Toque Pe en una esquina.');
        } catch (shareError) {
          setShareTarget(null);
          setShareStatus(shareError.message || 'No se pudo preparar el video para compartir.');
        } finally {
          setShareBusy(false);
        }
      };

      const downloadWatermarkedReel = (file) => {
        const fileUrl = URL.createObjectURL(file);
        const link = document.createElement('a');
        link.href = fileUrl;
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(fileUrl), 60_000);
      };

      const finishShare = async () => {
        if (!shareFile || !shareTarget) return;
        if (shareTarget === 'native') {
          try {
            if (!navigator.share || !navigator.canShare?.({ files: [shareFile] })) {
              setShareStatus('No está disponible el envío directo de videos en este dispositivo. Descárgalo y súbelo desde la red social.');
              return;
            }
            await navigator.share({
              files: [shareFile],
              title: `Reel de ${sharePostSelection?.profileName || 'Al Toque'}`,
              text: sharePostSelection?.caption || 'Mira este Reel de Al Toque Pe'
            });
            setShareStatus('Video compartido.');
          } catch (shareError) {
            if (shareError.name !== 'AbortError') setShareStatus('No se pudo abrir la opción de compartir de este dispositivo.');
          }
          return;
        }

        downloadWatermarkedReel(shareFile);
        if (shareTarget === 'download') {
          setShareStatus('Se descargó el video con marca de agua. Ya puedes subirlo a la red social que prefieras.');
          return;
        }
        const destination = shareNetworks.find((network) => network.id === shareTarget);
        if (!destination || !sharePostSelection) return;
        window.open(destination.destination(sharePostSelection), '_blank', 'noopener,noreferrer');
        setShareStatus(`Video descargado con marca de agua. Selecciónalo en ${destination.label} para publicarlo; Al Toque no lo sube automáticamente.`);
      };

      return (
        <section className="absolute inset-0 z-[70] h-full w-full overflow-hidden bg-black text-white" aria-labelledby="reels-title">
          <header className="pointer-events-none absolute inset-x-0 top-0 z-20 flex items-center justify-between bg-gradient-to-b from-black/75 to-transparent px-4 pb-8 pt-[max(1rem,env(safe-area-inset-top))]">
            <div className="pointer-events-auto flex items-center gap-3">
              <button type="button" onClick={() => onNavigate('home')} aria-label="Salir de Reels" className="flex h-10 w-10 items-center justify-center rounded-full bg-black/35 text-white backdrop-blur-sm">
                <i data-lucide="arrow-left" className="h-5 w-5"></i>
              </button>
              <h2 id="reels-title" className="font-title text-lg font-bold">Reels</h2>
            </div>
            <div className="pointer-events-auto flex items-center gap-2">
              <button
                type="button"
                onClick={toggleReelNotifications}
                aria-label={reelNotificationsEnabled ? 'Desactivar avisos de nuevos Reels' : 'Activar avisos de nuevos Reels'}
                aria-pressed={reelNotificationsEnabled}
                title={reelNotificationsEnabled ? 'Avisos activados' : 'Avisarme cuando publiquen un Reel'}
                className={`flex h-10 w-10 items-center justify-center rounded-full text-white backdrop-blur-sm ${reelNotificationsEnabled ? 'bg-[#a90000]' : 'bg-black/35'}`}
              >
                <i data-lucide={reelNotificationsEnabled ? 'bell-ring' : 'bell'} className="h-5 w-5"></i>
              </button>
              <button type="button" onClick={() => { setNotice(''); setProfileName(profile?.name || ''); setProfilePhoto(profile?.photo || ''); setShowProfileEditor(true); }} className="flex h-10 items-center gap-2 rounded-full bg-black/35 px-3 text-xs font-bold text-white backdrop-blur-sm" aria-label={profile?.name ? 'Editar perfil de Reels' : 'Crear perfil de Reels'}>
                {profile?.photo ? <img src={profile.photo} alt="" className="h-6 w-6 rounded-full object-cover" /> : <i data-lucide="user-round" className="h-4 w-4"></i>}
                <span>{profile?.name ? 'Mi perfil' : 'Perfil'}</span>
              </button>
              <button type="button" onClick={() => { setNotice(''); setShowComposer(true); }} className="flex h-10 w-10 items-center justify-center rounded-full bg-[#a90000] text-white shadow-sm" aria-label="Crear un Reel">
                <i data-lucide="plus" className="h-5 w-5"></i>
              </button>
            </div>
          </header>

          {(notice || error) && (
            <div className="absolute left-3 right-3 top-20 z-30 flex items-start justify-between gap-2 rounded-xl bg-black/75 px-3 py-2 text-xs text-white backdrop-blur-sm" role={error ? 'alert' : 'status'}>
              <span>{error || notice}</span>
              {error
                ? <button type="button" onClick={() => feedRefreshRef.current?.()} className="shrink-0 font-bold underline">Reintentar</button>
                : <button type="button" onClick={() => setNotice('')} aria-label="Cerrar aviso">×</button>}
            </div>
          )}

          {deletePasswordPost && (
            <div
              className="absolute inset-0 z-[110] flex items-center justify-center bg-black/65 p-5 backdrop-blur-sm"
              onClick={closeDeletePasswordDialog}
            >
              <section
                role="dialog"
                aria-modal="true"
                aria-labelledby="reel-delete-password-title"
                className="w-full max-w-sm rounded-3xl bg-white p-5 text-[#2b1718] shadow-2xl"
                onClick={(event) => event.stopPropagation()}
              >
                <div className="mb-4 flex items-start justify-between gap-3">
                  <div>
                    <h3 id="reel-delete-password-title" className="text-lg font-extrabold">Confirmar eliminación</h3>
                    <p className="mt-1 text-xs text-gray-500">Ingresa la contraseña para eliminar este Reel.</p>
                  </div>
                  <button
                    type="button"
                    onClick={closeDeletePasswordDialog}
                    disabled={Boolean(pendingDeletes[deletePasswordPost.id])}
                    aria-label="Cerrar ventana de contraseña"
                    className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-600 disabled:opacity-40"
                  >
                    <i data-lucide="x" className="h-4 w-4"></i>
                  </button>
                </div>
                <form onSubmit={deletePost} className="space-y-3">
                  <label htmlFor="reel-delete-password" className="block text-xs font-bold text-gray-700">Contraseña</label>
                  <input
                    id="reel-delete-password"
                    type="password"
                    value={deletePassword}
                    onChange={(event) => {
                      setDeletePassword(event.target.value);
                      setDeletePasswordError('');
                    }}
                    autoComplete="current-password"
                    autoFocus
                    required
                    disabled={Boolean(pendingDeletes[deletePasswordPost.id])}
                    aria-invalid={Boolean(deletePasswordError)}
                    aria-describedby={deletePasswordError ? 'reel-delete-password-error' : undefined}
                    placeholder="Escribe la contraseña"
                    className="w-full rounded-xl border border-gray-200 px-3 py-3 text-sm outline-none transition focus:border-[#a90000] focus:ring-2 focus:ring-[#a90000]/15 disabled:bg-gray-100"
                  />
                  {deletePasswordError && (
                    <p id="reel-delete-password-error" className="text-xs font-semibold text-red-700" role="alert">{deletePasswordError}</p>
                  )}
                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={closeDeletePasswordDialog}
                      disabled={Boolean(pendingDeletes[deletePasswordPost.id])}
                      className="flex-1 rounded-xl bg-gray-100 px-4 py-3 text-xs font-bold text-gray-700 disabled:opacity-50"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      disabled={Boolean(pendingDeletes[deletePasswordPost.id]) || !deletePassword.trim()}
                      className="flex-1 rounded-xl bg-[#a90000] px-4 py-3 text-xs font-bold text-white disabled:opacity-50"
                    >
                      {pendingDeletes[deletePasswordPost.id] ? 'Eliminando…' : 'Eliminar Reel'}
                    </button>
                  </div>
                </form>
              </section>
            </div>
          )}

          {sharePostSelection && (
            <div className="absolute inset-0 z-[100] flex items-end justify-center bg-black/35 px-3 pb-[max(1rem,env(safe-area-inset-bottom))] pt-4 backdrop-blur-[2px] sm:items-center" onClick={() => { if (!shareBusy) setSharePostSelection(null); }}>
              <section
                role="dialog"
                aria-modal="true"
                aria-labelledby="reel-share-title"
                className="max-h-[86dvh] w-full max-w-md overflow-y-auto rounded-[28px] bg-[#fffdfb]/90 p-4 text-[#2b1718] shadow-2xl backdrop-blur-md"
                onClick={(event) => event.stopPropagation()}
              >
                <div className="mb-3 flex items-center justify-between">
                  <div>
                    <h3 id="reel-share-title" className="text-lg font-extrabold">Compartir Reel</h3>
                    <p className="mt-1 text-[11px] text-gray-500">Elige dónde quieres compartir el video.</p>
                  </div>
                  <button type="button" disabled={shareBusy} onClick={() => setSharePostSelection(null)} aria-label="Cerrar ventana de compartir" className="flex h-9 w-9 items-center justify-center rounded-full bg-gray-100 text-gray-600 disabled:opacity-40">
                    <i data-lucide="x" className="h-4 w-4"></i>
                  </button>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <button type="button" onClick={async () => {
                    const url = `${window.location.origin}${window.location.pathname}#reel-${encodeURIComponent(sharePostSelection.id)}`;
                    try {
                      await navigator.clipboard.writeText(url);
                      setShareStatus('Enlace del Reel copiado.');
                    } catch (copyError) {
                      console.error('No se pudo copiar el enlace del Reel:', copyError);
                      setShareStatus('No se pudo copiar el enlace. Revisa los permisos del navegador.');
                    }
                  }} className="reel-share-action flex flex-col items-center gap-2 rounded-2xl p-2 text-center text-[10px] font-semibold">
                    <span className="reel-share-action-icon flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-[#6657ee] to-[#8d63d9] text-white"><i data-lucide="link-2" className="reel-share-action-svg h-5 w-5"></i></span>
                    Copiar enlace
                  </button>
                  <button type="button" disabled={shareBusy} onClick={() => prepareShareFile(sharePostSelection, 'native')} className="reel-share-action flex flex-col items-center gap-2 rounded-2xl p-2 text-center text-[10px] font-semibold disabled:opacity-50">
                    <span className="reel-share-action-icon flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-[#ed654e] to-[#c33274] text-white"><i data-lucide="send" className="reel-share-action-svg h-5 w-5"></i></span>
                    Compartir video
                  </button>
                  <button type="button" disabled={shareBusy} onClick={() => prepareShareFile(sharePostSelection, 'download')} className="reel-share-action flex flex-col items-center gap-2 rounded-2xl p-2 text-center text-[10px] font-semibold disabled:opacity-50">
                    <span className="reel-share-action-icon flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-[#b90000] to-[#8c111d] text-white"><i data-lucide="download" className="reel-share-action-svg h-5 w-5"></i></span>
                    Descargar con marca
                  </button>
                </div>

                <div className="my-3 border-t border-gray-200"></div>
                <div className="mb-2 flex items-center justify-between gap-2">
                  <p className="text-xs font-bold text-gray-700">Preparar para una red social</p>
                  <span className="shrink-0 text-[9px] text-gray-500">Desliza para ver más →</span>
                </div>
                <div className="no-scrollbar flex snap-x snap-mandatory gap-2 overflow-x-auto overscroll-x-contain py-1 touch-pan-x" role="group" aria-label="Redes sociales; desliza horizontalmente para verlas">
                  {shareNetworks.map((network) => (
                    <button key={network.id} type="button" onClick={() => launchShareNetwork(network, sharePostSelection)} aria-label={`Abrir ${network.label}`} className="reel-social-button flex w-[68px] shrink-0 snap-start flex-col items-center gap-1 rounded-xl p-1.5 text-center text-[9px] font-semibold text-gray-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#a90000]">
                      <span className={`reel-social-logo flex h-11 w-11 items-center justify-center rounded-full text-white ${network.color} ${network.iconColor || ''}`}>
                        {renderShareNetworkLogo(network)}
                      </span>
                      {network.label}
                    </button>
                  ))}
                </div>

                {(shareBusy || shareStatus) && (
                  <p role="status" className="mt-3 rounded-xl bg-[#f8f3fb] px-3 py-2 text-[11px] leading-relaxed text-[#684a7e]">
                    {shareBusy && <i data-lucide="loader-circle" className="mr-1 inline-block h-3.5 w-3.5 animate-spin align-[-2px]"></i>}
                    {shareStatus}
                  </p>
                )}
                {shareFile && !shareBusy && shareTarget && (
                  <button type="button" onClick={finishShare} className="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-[#a90000] px-4 py-3 text-xs font-bold text-white shadow-sm">
                    <i data-lucide={shareTarget === 'native' ? 'send' : shareTarget === 'download' ? 'download' : 'external-link'} className="h-4 w-4"></i>
                    {shareTarget === 'native'
                      ? 'Elegir aplicación para compartir'
                      : shareTarget === 'download'
                        ? 'Descargar video con marca de agua'
                        : `Descargar y abrir ${shareTarget === 'instagram' ? 'Instagram' : shareTarget === 'tiktok' ? 'TikTok' : shareTarget === 'facebook' ? 'Facebook' : 'WhatsApp'}`}
                  </button>
                )}
                <p className="mt-3 text-center text-[9px] leading-relaxed text-gray-500">
                  Los logos abren la aplicación o su página oficial. Para subir el video con marca de agua, descárgalo primero y selecciónalo allí.
                </p>
              </section>
            </div>
          )}

          {loading && posts.length === 0 && <div className="absolute inset-0 flex flex-col items-center justify-center text-center"><i data-lucide="loader-circle" className="h-8 w-8 animate-spin text-white"></i><p className="mt-3 text-xs text-white/80">Cargando Reels…</p></div>}
          {!loading && !error && posts.length === 0 && (
            <div className="absolute inset-0 flex flex-col items-center justify-center px-6 text-center">
              <span className="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/10 text-white" aria-hidden="true"><i data-lucide="clapperboard" className="h-8 w-8"></i></span>
              <h3 className="mt-5 font-title text-lg font-bold">El primer Reel puede ser tuyo</h3>
              <p className="mt-2 max-w-[260px] text-xs leading-relaxed text-white/75">Crea tu perfil y comparte videos con la comunidad del campus.</p>
              <button type="button" onClick={() => profile?.name ? setShowComposer(true) : setShowProfileEditor(true)} className="mt-5 rounded-xl bg-[#a90000] px-4 py-2.5 text-xs font-bold text-white">{profile?.name ? 'Publicar un Reel' : 'Crear mi perfil'}</button>
            </div>
          )}

          <div ref={feedRef} className="absolute inset-0 snap-y snap-mandatory overflow-y-auto overscroll-contain no-scrollbar">
            {posts.map((post) => (
              <article key={post.id} id={`reel-${post.id}`} className="relative h-full min-h-full w-full snap-start snap-always overflow-hidden bg-black">
                <video
                  ref={(video) => {
                    if (video) videoElementsRef.current.set(post.id, video);
                    else videoElementsRef.current.delete(post.id);
                  }}
                  src={post.videoUrl}
                  autoPlay
                  loop
                  muted={videosMuted}
                  playsInline
                  preload="metadata"
                  onPlay={() => setPlayingPostId(post.id)}
                  onPause={() => setPlayingPostId((current) => current === post.id ? null : current)}
                  onClick={() => toggleVideoPlayback(post.id)}
                  onLoadedMetadata={(event) => {
                    const video = event.currentTarget;
                    const currentTime = video.currentTime;
                    const duration = Number.isFinite(video.duration) ? video.duration : 0;
                    setVideoProgress((current) => ({ ...current, [post.id]: { currentTime, duration } }));
                  }}
                  onTimeUpdate={(event) => {
                    const video = event.currentTarget;
                    const currentTime = video.currentTime;
                    const duration = Number.isFinite(video.duration) ? video.duration : 0;
                    setVideoProgress((current) => ({ ...current, [post.id]: { currentTime, duration } }));
                  }}
                  className="absolute inset-0 h-full w-full bg-black object-cover"
                  aria-label={`Video de ${post.profileName || 'Reels'}`}
                />
                {playingPostId !== post.id && (
                  <button type="button" onClick={() => toggleVideoPlayback(post.id)} aria-label="Reproducir video" className="absolute left-1/2 top-1/2 z-10 flex h-16 w-16 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-black/45 text-white backdrop-blur-sm">
                    <i data-lucide="play" className="ml-1 h-8 w-8 fill-current"></i>
                  </button>
                )}
                <div className="pointer-events-none absolute inset-0 bg-gradient-to-b from-black/35 via-transparent to-black/75"></div>
                <div className="absolute inset-x-0 bottom-0 z-10 flex items-end justify-between gap-4 px-4 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-24">
                  <div className="min-w-0 flex-1 text-white">
                    <div className="mb-2 flex items-center gap-2">
                      {post.profilePhoto ? <img src={post.profilePhoto} alt="" className="h-9 w-9 rounded-full border border-white/70 object-cover" /> : <span className="flex h-9 w-9 items-center justify-center rounded-full bg-white/20"><i data-lucide="user-round" className="h-4 w-4"></i></span>}
                      <div className="min-w-0"><p className="truncate text-sm font-extrabold">{post.profileName || 'Perfil de Reels'}</p><p className="text-[10px] text-white/75">{post.createdAt && Number.isFinite(new Date(post.createdAt).getTime()) ? new Date(post.createdAt).toLocaleString('es-PE', { dateStyle: 'medium', timeStyle: 'short' }) : 'Reel'}</p></div>
                      {post.profileId === profileId && <button type="button" onClick={() => { setProfileName(profile?.name || post.profileName || ''); setProfilePhoto(profile?.photo || post.profilePhoto || ''); setShowProfileEditor(true); }} className="rounded-full border border-white/70 px-3 py-1 text-[10px] font-bold">Editar</button>}
                    </div>
                    {post.caption && <p className="whitespace-pre-wrap break-words text-sm leading-relaxed">{post.caption}</p>}
                    <p className="mt-2 text-[10px] text-white/65">Fue generado por IA.</p>
                  </div>
                  <div className="flex shrink-0 flex-col items-center gap-4 pb-1">
                    <button type="button" onClick={() => toggleVideoSound(post.id)} aria-label={videosMuted ? 'Activar sonido' : 'Silenciar video'} aria-pressed={!videosMuted} className="mb-1 flex h-9 w-9 items-center justify-center rounded-full bg-black/35 text-white backdrop-blur-sm">
                      <i data-lucide={videosMuted ? 'volume-x' : 'volume-2'} className="h-5 w-5"></i>
                    </button>
                    <button type="button" onClick={() => toggleLike(post)} disabled={Boolean(pendingLikes[post.id])} aria-label={post.likedByViewer ? 'Quitar corazón' : 'Dar corazón'} aria-pressed={Boolean(post.likedByViewer)} className={`flex flex-col items-center gap-1 text-xs font-bold text-white ${post.likedByViewer ? 'text-rose-400' : ''}`}>
                      <i data-lucide="heart" className={`h-7 w-7 drop-shadow ${post.likedByViewer ? 'fill-current' : ''}`}></i><span>{post.likeCount || 0}</span>
                    </button>
                    <button type="button" onClick={() => setOpenComments((current) => ({ ...current, [post.id]: !current[post.id] }))} aria-expanded={Boolean(openComments[post.id])} className="flex flex-col items-center gap-1 text-xs font-bold text-white"><i data-lucide="message-circle" className="h-7 w-7 drop-shadow"></i><span>{Array.isArray(post.comments) ? post.comments.length : 0}</span></button>
                    <button type="button" onClick={() => sharePost(post)} aria-label="Compartir Reel" className="flex flex-col items-center gap-1 text-[10px] font-bold text-white"><i data-lucide="send" className="h-6 w-6 drop-shadow"></i><span>Compartir</span></button>
                    {post.profileId === profileId && (
                      <div className="flex flex-col items-center gap-2">
                        <button type="button" onClick={() => setVisibleDeleteOptions((current) => ({ ...current, [post.id]: !current[post.id] }))} aria-label={visibleDeleteOptions[post.id] ? 'Ocultar opción para eliminar Reel' : 'Mostrar opción para eliminar Reel'} aria-expanded={Boolean(visibleDeleteOptions[post.id])} className="flex h-9 w-9 items-center justify-center rounded-full bg-black/35 text-white backdrop-blur-sm">
                          <i data-lucide={visibleDeleteOptions[post.id] ? 'eye-off' : 'eye'} className="h-5 w-5"></i>
                        </button>
                        {visibleDeleteOptions[post.id] && (
                          <button type="button" onClick={() => openDeletePasswordDialog(post)} disabled={Boolean(pendingDeletes[post.id])} className="flex flex-col items-center gap-1 text-[10px] font-bold text-white disabled:opacity-50">
                            <i data-lucide="trash-2" className="h-6 w-6 drop-shadow"></i><span>{pendingDeletes[post.id] ? 'Borrando…' : 'Eliminar'}</span>
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                </div>
                <input
                  type="range"
                  min="0"
                  max={videoProgress[post.id]?.duration || 1}
                  step="0.1"
                  value={Math.min(videoProgress[post.id]?.currentTime || 0, videoProgress[post.id]?.duration || 0)}
                  disabled={!videoProgress[post.id]?.duration}
                  onChange={(event) => {
                    const video = videoElementsRef.current.get(post.id);
                    const nextTime = Number(event.currentTarget.value);
                    if (!video || !Number.isFinite(nextTime)) return;
                    video.currentTime = nextTime;
                    setVideoProgress((current) => ({
                      ...current,
                      [post.id]: { currentTime: nextTime, duration: Number.isFinite(video.duration) ? video.duration : 0 }
                    }));
                  }}
                  onPointerDown={(event) => event.stopPropagation()}
                  onClick={(event) => event.stopPropagation()}
                  style={{ '--reel-progress': `${videoProgress[post.id]?.duration ? Math.min(100, ((videoProgress[post.id]?.currentTime || 0) / videoProgress[post.id].duration) * 100) : 0}%` }}
                  className="reel-seekbar absolute inset-x-0 bottom-0 z-30 h-5 w-full cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-white disabled:cursor-default"
                  aria-label={`Avance del video de ${post.profileName || 'Reels'}`}
                  aria-valuetext={`${Math.floor(videoProgress[post.id]?.currentTime || 0)} de ${Math.floor(videoProgress[post.id]?.duration || 0)} segundos`}
                />
                {openComments[post.id] && (
                  <div className="absolute inset-x-0 bottom-0 z-20 flex max-h-[60%] flex-col rounded-t-3xl border-t border-white/35 bg-[#d1d5db]/40 px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-4 text-white shadow-[0_-8px_30px_rgba(0,0,0,0.18)] backdrop-blur-xl">
                    <div className="mb-3 flex items-center justify-between"><h3 className="text-sm font-bold">Comentarios</h3><button type="button" onClick={() => setOpenComments((current) => ({ ...current, [post.id]: false }))} aria-label="Cerrar comentarios" className="text-xl">×</button></div>
                    <div className="min-h-0 flex-1 space-y-3 overflow-y-auto">
                      {(post.comments || []).map((comment) => <div key={comment.id} className="flex items-start gap-2 text-xs"><span className="flex h-7 w-7 shrink-0 items-center justify-center overflow-hidden rounded-full bg-white/15">{comment.profilePhoto ? <img src={comment.profilePhoto} alt="" className="h-full w-full object-cover" /> : <i data-lucide="user-round" className="h-3 w-3"></i>}</span><p className="min-w-0 flex-1 break-words leading-relaxed"><strong>{comment.profileName || 'Perfil'} </strong>{comment.text}</p></div>)}
                      {(post.comments || []).length === 0 && <p className="py-4 text-center text-xs text-white/70">Aún no hay comentarios.</p>}
                    </div>
                    <form onSubmit={(event) => addComment(event, post)} className="mt-3 flex items-center gap-2">
                      <input value={commentDrafts[post.id] || ''} onChange={(event) => setCommentDrafts((current) => ({ ...current, [post.id]: event.target.value.slice(0, 300) }))} maxLength={300} placeholder={profile?.name ? 'Escribe un comentario…' : 'Crea tu perfil para comentar'} aria-label="Escribe un comentario" className="min-w-0 flex-1 rounded-full border border-white/20 bg-white/10 px-4 py-2.5 text-xs text-white outline-none placeholder:text-white/50 focus:border-white" />
                      <button type="submit" disabled={!(commentDrafts[post.id] || '').trim()} className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#a90000] text-white disabled:opacity-40" aria-label="Enviar comentario"><i data-lucide="arrow-up" className="h-4 w-4"></i></button>
                    </form>
                  </div>
                )}
              </article>
            ))}
          </div>

          {showProfileEditor && (
            <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/45 p-3 sm:items-center" onClick={(event) => { if (event.target === event.currentTarget) setShowProfileEditor(false); }}>
              <form onSubmit={saveProfile} className="w-full max-w-sm rounded-[26px] bg-white p-5 shadow-2xl">
                <div className="flex items-start justify-between"><div><p className="text-[9px] font-bold uppercase tracking-[0.18em] text-[#a90000]">Tu perfil público</p><h3 className="mt-1 font-title text-xl font-extrabold text-[#211716]">{profile?.name ? 'Editar perfil' : 'Crea tu perfil de Reels'}</h3></div><button type="button" onClick={() => setShowProfileEditor(false)} className="flex h-8 w-8 items-center justify-center rounded-full bg-[#f6f1e9] text-lg" aria-label="Cerrar">×</button></div>
                <div className="mt-5 flex items-center gap-3">
                  <button type="button" onClick={() => photoInputRef.current?.click()} className="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-full border-2 border-dashed border-[#d8c9ae] bg-[#fffaf1] text-[#a90000]" aria-label="Elegir foto de perfil">
                    {profilePhoto ? <img src={profilePhoto} alt="Vista previa de la foto de perfil" className="h-full w-full object-cover" /> : <i data-lucide="camera" className="h-6 w-6"></i>}
                  </button>
                  <div><p className="text-xs font-bold text-[#211716]">Tu foto</p><p className="mt-1 text-[10px] leading-relaxed text-[#756b67]">JPG, PNG o WebP. Se verá públicamente.</p><input ref={photoInputRef} type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={async (event) => { try { setProfilePhoto(await readSmallPhoto(event.target.files?.[0])); setNotice(''); } catch (photoError) { setNotice(photoError.message); event.target.value = ''; } }} /></div>
                </div>
                <label className="mt-4 block text-xs font-bold text-[#392f2c]">Nombre visible<input autoFocus value={profileName} onChange={(event) => setProfileName(event.target.value.slice(0, 30))} minLength={2} maxLength={30} required placeholder="¿Cómo te llamas?" className="mt-1.5 w-full rounded-xl border border-[#eadfc8] bg-[#fffaf1] px-3 py-2.5 text-sm font-normal outline-none focus:border-[#a90000]" /></label>
                {notice && <p role="alert" className="mt-3 text-xs text-red-700">{notice}</p>}
                <p className="mt-3 text-[10px] leading-relaxed text-[#8b817a]">No hay inicio de sesión: cualquiera puede crear o modificar un perfil público desde este dispositivo.</p>
                <button type="submit" disabled={profileSaving} className="mt-5 w-full rounded-xl bg-[#a90000] py-3 text-xs font-extrabold text-white disabled:opacity-60">{profileSaving ? 'Guardando…' : 'Guardar perfil'}</button>
              </form>
            </div>
          )}

          {showComposer && !showImageRightsAgreement && (
            <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/45 p-3 sm:items-center" onClick={(event) => { if (event.target === event.currentTarget && !publishing) closeComposer(); }}>
              <form onSubmit={publishVideo} className="w-full max-w-sm rounded-[26px] bg-white p-5 shadow-2xl">
                <div className="flex items-start justify-between"><div><p className="text-[9px] font-bold uppercase tracking-[0.18em] text-[#a90000]">Comparte con el campus</p><h3 className="mt-1 font-title text-xl font-extrabold text-[#211716]">Nuevo Reel</h3></div><button type="button" disabled={publishing} onClick={closeComposer} className="flex h-9 w-9 items-center justify-center rounded-full border border-[#a90000] bg-[#a90000] text-2xl font-bold leading-none text-white shadow-sm transition hover:border-[#7f0000] hover:bg-[#7f0000] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#a90000] disabled:opacity-50" aria-label="Cerrar">×</button></div>
                {profile?.name ? <p className="mt-3 text-xs text-[#756b67]">Publicando como <strong className="text-[#211716]">{profile.name}</strong></p> : <p className="mt-3 rounded-xl bg-[#fff8e8] p-2 text-[10px] text-[#6d5541]">Primero crea tu perfil público de Reels.</p>}
                <input ref={videoInputRef} type="file" accept="video/mp4,video/webm" required className="mt-4 block w-full text-xs text-[#5e514c] file:mr-3 file:rounded-xl file:border-0 file:bg-[#fff2d7] file:px-3 file:py-2 file:text-[11px] file:font-bold file:text-[#6d3d28]" />
                <p className="mt-1 text-[10px] text-[#8b817a]">MP4 o WebM · máximo 100 MB</p>
                <label className="mt-4 flex items-start gap-2 rounded-xl bg-[#f0f2f4] p-3 text-xs leading-relaxed text-[#211716]">
                  <input type="checkbox" checked={videoShowsPeople} onChange={(event) => { setVideoShowsPeople(event.target.checked); setAcceptedImageRights(false); setNotice(''); }} className="mt-0.5 h-4 w-4 shrink-0 accent-[#a90000]" />
                  <span>El video muestra a una o más personas.</span>
                </label>
                {videoShowsPeople && (
                  <label className="mt-2 flex items-start gap-2 rounded-xl bg-[#f0f2f4] p-3 text-xs leading-relaxed text-[#211716]">
                    <input type="checkbox" checked={acceptedImageRights} onChange={(event) => { setAcceptedImageRights(event.target.checked); setNotice(''); }} required className="mt-0.5 h-4 w-4 shrink-0 accent-[#a90000]" />
                    <span>
                      Acepto el{' '}
                      <a href="#acuerdo-cesion-derechos-imagen" onClick={(event) => { event.preventDefault(); setShowImageRightsAgreement(true); }} className="text-blue-700 underline">
                        Acuerdo de Cesión de Derechos de Imagen
                      </a>{' '}
                      y los Términos y Condiciones de Al Toque Pe.
                    </span>
                  </label>
                )}
                <label className="mt-4 block text-xs font-bold text-[#392f2c]">Descripción (opcional)<textarea value={caption} onChange={(event) => setCaption(event.target.value.slice(0, 500))} maxLength={500} rows={3} placeholder="Cuéntale algo a la comunidad…" className="mt-1.5 w-full resize-none rounded-xl border border-[#eadfc8] bg-[#fffaf1] px-3 py-2.5 text-xs font-normal outline-none focus:border-[#a90000]" /></label>
                <p className="text-right text-[9px] text-[#8b817a]">{caption.length}/500</p>
                <p className="mt-2 text-[10px] leading-relaxed text-[#8b817a]">Publicarás un video visible para todos. No subas contenido privado ni de otras personas sin permiso.</p>
                {notice && <p role="alert" className="mt-3 text-xs text-red-700">{notice}</p>}
                <button type="submit" disabled={publishing} className="mt-4 w-full rounded-xl bg-[#a90000] py-3 text-xs font-extrabold text-white disabled:opacity-60">{publishing ? 'Subiendo y publicando…' : 'Publicar Reel'}</button>
              </form>
            </div>
          )}
          {showImageRightsAgreement && (
            <div className="fixed inset-0 z-[90] flex flex-col bg-white text-[#211716]" role="dialog" aria-modal="true" aria-labelledby="image-rights-agreement-title">
              <header className="flex shrink-0 items-center gap-3 border-b border-[#eee7dc] px-4 py-3">
                <button type="button" onClick={() => setShowImageRightsAgreement(false)} aria-label="Volver al formulario de publicación" className="flex h-9 w-9 items-center justify-center rounded-full bg-[#f6f1e9]">
                  <i data-lucide="arrow-left" className="h-5 w-5"></i>
                </button>
                <h2 id="image-rights-agreement-title" className="font-title text-base font-bold">Acuerdo de cesión de derechos</h2>
              </header>
              <div className="min-h-0 flex-1 space-y-4 overflow-y-auto px-5 py-4 text-sm leading-relaxed">
                <h3 className="font-title text-lg font-extrabold">ACUERDO DE CESIÓN DE DERECHOS DE IMAGEN Y PROPIEDAD INTELECTUAL</h3>
                <p className="font-bold">APLICACIÓN MÓVIL "AL TOQUE PE"</p>
                <p>El presente Acuerdo de Cesión de Derechos de Imagen (en adelante, el "Acuerdo") regula los términos bajo los cuales los usuarios (en adelante, el "Cedente" o el "Usuario") otorgan su consentimiento y ceden los derechos sobre su imagen a la empresa propietaria y operadora de la aplicación móvil "Al Toque Pe" (en adelante, el "Cesionario"). Al aceptar de forma electrónica este documento, ya sea mediante la marcación de una casilla de verificación (checkbox), la creación de una cuenta o la carga de contenido en la plataforma, el Usuario manifiesta su conformidad absoluta con las siguientes cláusulas:</p>
                {imageRightsAgreementSections.map((section) => (
                  <section key={section.title} className="space-y-2">

                    {section.paragraphs.map((paragraph) => <p key={paragraph}>{paragraph}</p>)}

                      <ul className="list-disc space-y-1 pl-5">

                      </ul>
                    )}
                  </section>
                ))}
              </div>
            </div>
          )}
        </section>
      );

    function HomeScreen({ onNavigate, onOpenCustomize, mood, setMood, isMusicPlayerOpen, onToggleMusicPlayer }) {
      const [timeString, setTimeString] = useState('');
      const [partyKubNotice, setPartyKubNotice] = useState('');
      const [dayPart, setDayPart] = useState(() => getDayPart(new Date().getHours()));
      const [serviceStatus, setServiceStatus] = useState(() => getCampusServiceStatus());
      const [isServiceCardExpanded, setIsServiceCardExpanded] = useState(false);
      const [homeCarousel, setHomeCarousel] = useState({ active: 0, exiting: null });
      const [headline, setHeadline] = useState('');
      const [homeCardStickerId, setHomeCardStickerId] = useState(9);
      const [cardMessageIndex, setCardMessageIndex] = useState(() => Math.floor(Math.random() * HOME_AI_CARD_MESSAGES.length));
      const seenMessagesRef = useRef(HOME_SEEN_MESSAGES_BY_MOOD);
      const partyKubNoticeTimerRef = useRef(null);

      useEffect(() => () => clearTimeout(partyKubNoticeTimerRef.current), []);

      useEffect(() => {
        const updateTime = () => {
          const now = new Date();
          const days = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
          const dayName = days[now.getDay()];
          let hours = now.getHours();
          const minutes = now.getMinutes().toString().padStart(2, '0');
          const ampm = hours >= 12 ? 'P. M.' : 'A. M.';
          hours = hours % 12;
          hours = hours ? hours : 12;
          setTimeString(`${dayName}, ${hours}:${minutes} ${ampm}`);
          setDayPart(getDayPart(now.getHours()));
          setServiceStatus(getCampusServiceStatus(now));
        };

        updateTime();
        const timer = setInterval(updateTime, 10000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        let transitionTimer;
        const timer = setInterval(() => {
          setHomeCarousel((carousel) => ({
            active: (carousel.active + 1) % 3,
            exiting: carousel.active
          }));
          clearTimeout(transitionTimer);
          transitionTimer = setTimeout(() => {
            setHomeCarousel((carousel) => ({ ...carousel, exiting: null }));
          }, 700);
        }, 30000);
        return () => {
          clearInterval(timer);
          clearTimeout(transitionTimer);
        };
      }, []);

      useEffect(() => {
        const timer = setInterval(() => {
          setMood((currentMood) => {
            const currentIndex = HOME_MOODS.findIndex((option) => option.id === currentMood);
            return HOME_MOODS[(currentIndex + 1) % HOME_MOODS.length].id;
          });
          setCardMessageIndex((currentIndex) => {
            const offset = 1 + Math.floor(Math.random() * (HOME_AI_CARD_MESSAGES.length - 1));
            return (currentIndex + offset) % HOME_AI_CARD_MESSAGES.length;
          });
        }, 5000);
        return () => clearInterval(timer);
      }, [setMood]);

      useEffect(() => {
        const timer = setInterval(() => {
          setHomeCardStickerId((previousStickerId) => {
            const currentIndex = HOME_CARD_VICUNA_STICKER_IDS.indexOf(previousStickerId);
            return HOME_CARD_VICUNA_STICKER_IDS[(currentIndex + 1) % HOME_CARD_VICUNA_STICKER_IDS.length];
          });
        }, 5000);
        return () => clearInterval(timer);
      }, []);

      const rotateHeadline = (selectedMood = mood, selectedDayPart = dayPart) => {
        const key = `${selectedDayPart}-${selectedMood}`;
        const phrases = HOME_MESSAGES[selectedDayPart][selectedMood];
        const seen = seenMessagesRef.current[key] || [];
        let available = phrases.filter((phrase) => !seen.includes(phrase) && !HOME_RECENT_MESSAGES.includes(phrase));
        if (available.length === 0) {
          seenMessagesRef.current[key] = [];
          available = phrases.filter((phrase) => !HOME_RECENT_MESSAGES.includes(phrase));
        }
        if (available.length === 0) available = phrases.filter((phrase) => phrase !== headline);
        const nextHeadline = available[Math.floor(Math.random() * available.length)] || phrases[0];
        seenMessagesRef.current[key] = [...(seenMessagesRef.current[key] || []), nextHeadline];
        HOME_RECENT_MESSAGES.push(nextHeadline);
        if (HOME_RECENT_MESSAGES.length > 12) HOME_RECENT_MESSAGES.shift();
        setHeadline(nextHeadline);
      };

      useEffect(() => {
        rotateHeadline(mood, dayPart);
      }, [mood, dayPart]);

      useEffect(() => {
        const timer = setInterval(() => rotateHeadline(mood, dayPart), 8000);
        return () => clearInterval(timer);

          </div>

          {partyKubNotice && (

              {partyKubNotice}

          <p className="text-[11px] font-bold text-brand tracking-wider uppercase mb-1">{timeString || 'LUNES, 12:38 P. M.'}</p>

          <section className="home-feature-carousel" aria-label="Información del campus" aria-roledescription="carrusel">
            <div
              className={`home-feature-slide ${homeCarousel.active === 0 ? 'home-feature-slide--active' : ''} ${homeCarousel.exiting === 0 ? 'home-feature-slide--exit-left' : ''}`}
              aria-hidden={homeCarousel.active !== 0}
            >
              <section
                  className={`campus-service-card ${serviceStatus.state === 'online' ? 'campus-service-card--online' : 'campus-service-card--offline'} ${isServiceCardExpanded ? 'campus-service-card--expanded' : ''}`}
                  aria-label={`Servicio de delivery: ${serviceStatus.label}`}
                >
                  <div className="relative z-10">
                    <p className="campus-service-description">

                      />
                    </p>
                    <div className="mt-2 flex items-center justify-end gap-2">

                        <span className="campus-service-status-dot" aria-hidden="true"></span>

                      <button

                  </div>
                  <div id="campus-service-details" className="campus-service-details" aria-hidden={!isServiceCardExpanded}>

                        </button>
                      </div>
                    </div>
                  </div>
              </section>
            </div>
            <div

              aria-hidden={homeCarousel.active !== 1}
            >

                  <div className="flex flex-wrap gap-1.5" role="group" aria-label="Selecciona cómo te sientes hoy">
                    {HOME_MOODS.map((option) => (

                      >
                        <span aria-hidden="true">{option.icon}</span> {option.label}

                    ))}

              aria-hidden={homeCarousel.active !== 2}
            >
              <section

                <span className="home-card-sparkle" style={{ top: '17px', right: '23%', animationDelay: '0ms' }} aria-hidden="true"></span>
                <span className="home-card-sparkle" style={{ top: '52px', right: '12px', animationDelay: '720ms' }} aria-hidden="true"></span>
                <span className="home-card-sparkle" style={{ bottom: '16px', right: '31%', animationDelay: '1440ms' }} aria-hidden="true"></span>
                <span className="home-card-sparkle" style={{ bottom: '33px', left: '12px', animationDelay: '2100ms' }} aria-hidden="true"></span>
                <div className="flex items-center gap-2.5">
                  <div className="min-w-0 flex-1">
                    <p className="home-luxury-card-kicker">Al Toque IA · para ti hoy</p>
                    <div key={cardMessageIndex} className="home-card-page" aria-live="polite">
                      <h3 className="home-card-prompt-title">{HOME_AI_CARD_MESSAGES[cardMessageIndex].title}</h3>
                      <p className="home-card-note">{HOME_AI_CARD_MESSAGES[cardMessageIndex].description}</p>
                    </div>
                    <p className="home-card-encouragement" aria-live="polite">
                      {headline || HOME_MOOD_NOTES[mood]}
                    </p>
                    <div className="relative z-10 mt-2 flex items-center justify-end">
                      <button
                        type="button"
                        onClick={() => onNavigate('menu')}

                    <button onClick={() => onOpenCustomize(dish)} aria-label={`Añadir ${dish.name}`} className="menu-add-button w-7 h-7 rounded-lg flex items-center justify-center transition active:scale-95">
                      <i data-lucide="plus" className="w-4 h-4"></i>

          <div>
            <div className="mb-2">
              <h3 className="font-title font-bold text-base">Combos que rinden</h3>
              <p className="text-[11px] text-gray-500">Para tu día a día en campus</p>

            <div className="flex space-x-3 overflow-x-auto no-scrollbar py-6 -mx-4 px-8">
              {INITIAL_MENU.filter((m) => m.category === 'combos').map((dish) => (
                <div key={dish.id} className="home-menu-card combo-card min-w-[220px] bg-white border border-gray-100 rounded-3xl p-2.5 shadow-sm flex flex-col justify-between">

                      <img src={dish.image} alt={dish.name} className="home-menu-card-image combo-card-image w-full h-full object-cover" />

    function MenuScreen({ onOpenCustomize, onAddBembos, onAddStarbucks, isPromoDay }) {
      const [filter, setFilter] = useState('todos');
      const [starbucksSection, setStarbucksSection] = useState('bebidas');
      const [searchQuery, setSearchQuery] = useState('');
      const [showSearch, setShowSearch] = useState(false);
      const [showStarbucksCampaign, setShowStarbucksCampaign] = useState(false);
      const [campaignClock, setCampaignClock] = useState(() => Date.now());

      useEffect(() => {
        if (!showStarbucksCampaign) return undefined;
        const countdownInterval = window.setInterval(() => setCampaignClock(Date.now()), 1000);
        return () => window.clearInterval(countdownInterval);
      }, [showStarbucksCampaign]);

      useEffect(() => {
        if (!showStarbucksCampaign) return undefined;
        const handleEscape = (event) => {
          if (event.key === 'Escape') setShowStarbucksCampaign(false);
        };
        window.addEventListener('keydown', handleEscape);
        return () => window.removeEventListener('keydown', handleEscape);
      }, [showStarbucksCampaign]);

      const filteredItems = INITIAL_MENU.filter((item) => {
        const matchesCategory = filter === 'todos' || item.category === filter;
        const matchesSearch =
          item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });
      const filterChips = [
        { id: 'todos', label: 'Todos', count: INITIAL_MENU.length },
        { id: 'desayunos', label: 'Desayunos', count: INITIAL_MENU.filter((item) => item.category === 'desayunos').length },
        { id: 'menús', label: 'Menús', count: INITIAL_MENU.filter((item) => item.category === 'menús').length },
        { id: 'combos', label: 'Combos', count: INITIAL_MENU.filter((item) => item.category === 'combos').length },
        { id: 'bebidas', label: 'Bebidas', count: INITIAL_MENU.filter((item) => item.category === 'bebidas').length }
      ];
      const matchingUpcomingPromotions = STARBUCKS_UPCOMING_PROMOTIONS.filter((product) => {
        const query = searchQuery.trim().toLocaleLowerCase('es');
        return !query || `${product.name} ${product.description || ''}`.toLocaleLowerCase('es').includes(query);
      });
      const campaignRemainingMs = Math.max(0, STARBUCKS_CAMPAIGN_END_TIME - campaignClock);
      const campaignHasStarted = campaignRemainingMs === 0;

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-start pt-2">
            <div>
              <p className="text-[11px] font-bold text-brand tracking-wider uppercase">HOY EN CAMPUS</p>
              <h2 className="font-title text-2xl font-bold">Elige tu momento.</h2>
            </div>
            <button onClick={() => setShowSearch(!showSearch)} aria-label="Buscar en el menú" className="w-10 h-10 bg-cream rounded-2xl flex items-center justify-center text-dark hover:opacity-80 transition">
              <i data-lucide="search" className="w-5 h-5"></i>
            </button>
          </div>

          {showSearch && (
            <input
              type="text"
              placeholder="Buscar plato, combo o bebida..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full bg-cream/60 border border-gray-200 rounded-2xl px-4 py-2 text-xs focus:outline-none focus:border-brand"
            />
          )}

          <div className="flex gap-2 overflow-x-auto no-scrollbar">
            <button
              type="button"
              onClick={() => setFilter('bembos')}
              aria-label={`Promos Bembos: ${BEMBOS_PROMOTIONS.length} elementos`}
              aria-pressed={filter === 'bembos'}
              className={`px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
                filter === 'bembos' ? 'bg-dark text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
              }`}
            >
              Promos Bembos
              <span className={`ml-1.5 text-[10px] font-medium ${filter === 'bembos' ? 'text-white/60' : 'text-gray-500'}`}>
                {BEMBOS_PROMOTIONS.length}
              </span>
            </button>
            <button
              type="button"
              onClick={() => {
                setFilter('starbucks');
                setStarbucksSection('bebidas');
                setCampaignClock(Date.now());
                setShowStarbucksCampaign(true);
              }}
              aria-label={`Promos Starbucks: ${STARBUCKS_PRODUCTS.length + STARBUCKS_FOOD_PRODUCTS.length + STARBUCKS_MERCH_PRODUCTS.length + STARBUCKS_PACK_PRODUCTS.length + STARBUCKS_UPCOMING_PROMOTIONS.length} elementos`}
              aria-pressed={filter === 'starbucks'}
              className={`px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
                filter === 'starbucks' ? 'bg-[#006241] text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
              }`}
            >
              Promos Starbucks
              <span className={`ml-1.5 text-[10px] font-medium ${filter === 'starbucks' ? 'text-white/70' : 'text-gray-500'}`}>
                {STARBUCKS_PRODUCTS.length + STARBUCKS_FOOD_PRODUCTS.length + STARBUCKS_MERCH_PRODUCTS.length + STARBUCKS_PACK_PRODUCTS.length + STARBUCKS_UPCOMING_PROMOTIONS.length}
              </span>
            </button>
          </div>

          <div className="flex space-x-2 overflow-x-auto no-scrollbar py-1">
            {filterChips.map((chip) => (
              <button
                key={chip.id}

    function AIScreen({ onOpenCustomize, profile, orderHistory, customerProfileId }) {

      const orderHistoryForAI = useMemo(() => {
        const products = new Map();
        orderHistory
          .slice()
          .sort((first, second) => second.createdAt - first.createdAt)
          .slice(0, 10)
          .forEach((order) => {
            order.items.forEach((item) => {
              const previous = products.get(item.name) || 0;
              products.set(item.name, Math.min(1_000_000, previous + item.quantity));
            });
          });
        return [...products.entries()]
          .map(([name, quantity]) => ({ name, quantity }))
          .sort((first, second) => second.quantity - first.quantity || first.name.localeCompare(second.name, 'es'));
      }, [orderHistory]);
      const [storedChats] = useState(() => {
        try {
          const saved = window.localStorage.getItem(getCustomerStorageKey(CHAT_STORAGE_KEY, customerProfileId));
          if (!saved) {
            const firstConversation = createConversation('ChatGPT');
            return { conversations: [firstConversation], activeByProvider: { ChatGPT: firstConversation.id }, error: '' };
          }
          const parsed = JSON.parse(saved);
          if (!parsed || !Array.isArray(parsed.conversations)) throw new Error('El formato guardado no es válido.');
          const validConversations = parsed.conversations.filter((conversation) => (
            conversation && typeof conversation.id === 'string'
            && typeof conversation.title === 'string'
            && Array.isArray(conversation.messages)
            && conversation.messages.every((message) => (
              message && ['user', 'ai'].includes(message.sender) && typeof message.text === 'string'
            ))
          ));
          if (validConversations.length !== parsed.conversations.length) throw new Error('Algunas conversaciones guardadas están dañadas.');
          const conversations = validConversations.map((conversation) => ({
            ...conversation,
            provider: AI_PROVIDERS.includes(conversation.provider) ? conversation.provider : 'ChatGPT'
          }));
          if (conversations.length === 0) throw new Error('No se encontraron conversaciones válidas.');
          const activeByProvider = AI_PROVIDERS.reduce((active, name) => {
            const savedId = parsed.activeByProvider?.[name]
              || (name === 'ChatGPT' ? parsed.activeId : null);
            if (conversations.some((conversation) => conversation.id === savedId && conversation.provider === name)) {
              active[name] = savedId;
            }
            return active;
          }, {});
          AI_PROVIDERS.forEach((name) => {
            if (!activeByProvider[name]) {
              const mostRecent = [...conversations]
                .filter((conversation) => conversation.provider === name)
                .sort((a, b) => b.updatedAt - a.updatedAt)[0];
              if (mostRecent) activeByProvider[name] = mostRecent.id;
            }
          });
          return { conversations, activeByProvider, error: '' };
        } catch (error) {
          const firstConversation = createConversation('ChatGPT');
          return {
            conversations: [firstConversation],
            activeByProvider: { ChatGPT: firstConversation.id },
            error: `No se pudo leer el historial guardado: ${error.message}`
          };
        }
      });
      const [conversations, setConversations] = useState(storedChats.conversations);
      const [activeConversationByProvider, setActiveConversationByProvider] = useState(storedChats.activeByProvider);
      const [storageError, setStorageError] = useState(storedChats.error);
      const [historyOpen, setHistoryOpen] = useState(false);
      const [input, setInput] = useState('');

      const [foodMode, setFoodMode] = useState(false);

      const botpressTranscriptSignatureRef = useRef('');
      const botpressRestartInProgressRef = useRef(false);
      const botpressArchiveSelectionRef = useRef(false);
      const activeConversationId = activeConversationByProvider[provider];
      const activeConversation = conversations.find((conversation) => conversation.id === activeConversationId);
      const messages = activeConversation?.messages || [];
      const isBotpressArchive = provider === 'Botpress'
        && Boolean(activeConversation?.botpressConversationId)
        && Boolean(botpressLiveConversationId)
        && activeConversation.botpressConversationId !== botpressLiveConversationId;
      const botpressArchiveRef = useRef(isBotpressArchive);
      botpressArchiveRef.current = isBotpressArchive;

      useEffect(() => {
        if (provider !== 'Botpress') {
          window.botpress?.close?.();
          return undefined;
        }

        let rootObserver;
        let widgetStyleObserver;
        let resizeObserver;
        let retryTimer;
        let stateTimer;
        let cancelled = false;
        let positionFrame = 0;
        let observedWidget = null;
        const clipOverflow = new Set(['auto', 'clip', 'hidden', 'scroll']);
        const positionBotpress = () => {
          positionFrame = 0;
          const target = botpressPanelRef.current;
          const root = document.getElementById('fab-root')?.shadowRoot;
          const webchat = root?.querySelector('.bpWebchat');
          if (!target || !webchat) return;

          const targetBounds = target.getBoundingClientRect();
          const visibleBounds = {
            top: 0,
            left: 0,
            right: window.innerWidth,
            bottom: window.innerHeight
          };
          let ancestor = target.parentElement;
          while (ancestor && ancestor !== document.body) {
            const bounds = ancestor.getBoundingClientRect();
            const style = window.getComputedStyle(ancestor);
            if (clipOverflow.has(style.overflowX)) {
              visibleBounds.left = Math.max(visibleBounds.left, bounds.left);
              visibleBounds.right = Math.min(visibleBounds.right, bounds.right);
            }
            if (clipOverflow.has(style.overflowY)) {
              visibleBounds.top = Math.max(visibleBounds.top, bounds.top);
              visibleBounds.bottom = Math.min(visibleBounds.bottom, bounds.bottom);
            }
            ancestor = ancestor.parentElement;
          }

          const appRoot = document.getElementById('root');
          if (appRoot) {
            const appRootBounds = appRoot.getBoundingClientRect();
            const appContentLeft = appRootBounds.left + appRoot.clientLeft;
            visibleBounds.left = Math.max(visibleBounds.left, appContentLeft);
            visibleBounds.right = Math.min(visibleBounds.right, appContentLeft + appRoot.clientWidth);
          }

          const bottomNav = document.querySelector('#root [aria-label="Navegación principal"]');
          const bottomNavBounds = bottomNav?.getBoundingClientRect();
          if (bottomNavBounds
            && targetBounds.left < bottomNavBounds.right
            && targetBounds.right > bottomNavBounds.left
            && targetBounds.bottom > bottomNavBounds.top) {
            visibleBounds.bottom = Math.min(visibleBounds.bottom, bottomNavBounds.top);
          }

          const width = Math.max(0, visibleBounds.right - visibleBounds.left);
          const height = Math.max(0, visibleBounds.bottom - visibleBounds.top);
          const fitsVisibleArea = width > 0 && height > 0;
          const clipTop = Math.max(0, visibleBounds.top - targetBounds.top);
          const clipBottom = Math.max(0, targetBounds.bottom - visibleBounds.bottom);
          const nextStyles = {
            position: 'fixed',
            inset: 'auto',
            top: `${targetBounds.top}px`,
            left: `${visibleBounds.left}px`,
            right: 'auto',
            bottom: 'auto',
            width: `${width}px`,
            height: `${targetBounds.height}px`,
            minWidth: '0px',
            minHeight: '0px',
            maxWidth: `${width}px`,
            maxHeight: `${targetBounds.height}px`,
            boxSizing: 'border-box',
            borderRadius: '24px',
            clipPath: `inset(${clipTop}px 0px ${clipBottom}px)`,
            transform: 'none',
            zIndex: '30',
            visibility: fitsVisibleArea ? 'visible' : 'hidden',
            pointerEvents: fitsVisibleArea ? 'auto' : 'none'
          };
          Object.entries(nextStyles).forEach(([property, value]) => {
            if (webchat.style[property] !== value) webchat.style[property] = value;
          });
        };

        const schedulePositionBotpress = () => {
          if (!positionFrame) positionFrame = window.requestAnimationFrame(positionBotpress);
        };

        const syncBotpressOpenState = () => {
          const botpress = window.botpress;
          if (!botpress?.initialized) return;
          const root = document.getElementById('fab-root')?.shadowRoot;
          const webchat = root?.querySelector('.bpWebchat');
          if (botpressArchiveRef.current) {
            root?.host.setAttribute('data-altoque-chat-active', 'false');
