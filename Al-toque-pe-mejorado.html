            <article key={order.id} className="rider-card rider-order-enter border-l-4 border-l-[#a90000] p-3.5">
              <div className="flex items-start justify-between gap-3">
                <div>
                  <p className="text-[9px] font-bold uppercase tracking-wider text-green-700">PEDIDO EN LÍNEA · #{order.id}</p>
                  <h2 className="mt-1 font-title text-sm font-bold">{order.item}</h2>
                  {order.items.some((item) => item.description || item.image) && (
                    <div className="mt-2 space-y-2">
                      {order.items.filter((item) => item.description || item.image).map((item, index) => (
                        <div key={`${item.name}-${index}`} className="flex items-center gap-2">
                          {item.image && <img src={item.image} alt={`Imagen referencial de ${item.name}`} className="h-9 w-9 shrink-0 rounded-lg object-cover" />}
                          <div className="min-w-0">
                            <p className="text-[10px] font-semibold text-gray-700">{item.name}{item.quantity > 1 ? ` ×${item.quantity}` : ''}</p>
                            {item.description && <p className="text-[9px] leading-snug text-gray-500">{item.description}</p>}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <span className="rounded-full bg-[#fff1d7] px-2 py-1 text-[9px] font-bold text-[#80520d]">S/{order.payout.toFixed(2)} ganas</span>
              </div>
              <div className="mt-3 space-y-2 text-[10px] text-gray-600">
                <p className="flex items-center gap-2"><i data-lucide="store" className="h-3.5 w-3.5 text-[#ed711b]"></i>{order.pickup}</p>
                <p className="flex items-center gap-2"><i data-lucide="map-pin" className="h-3.5 w-3.5 text-[#a90000]"></i>{order.dropoff}</p>
              </div>
              <div className="mt-3 flex items-center justify-between border-t border-gray-100 pt-2 text-[9px] text-gray-500">
                <span>{order.distance} · aprox. {order.eta} min</span>
                <span>Total S/{order.total.toFixed(2)}</span>
              </div>
              <div className="mt-3 grid grid-cols-[0.75fr_1.25fr] gap-2">
                <button type="button" disabled={!isOnline || Boolean(activeOrder)} onClick={() => declineOrder(order)} className="rounded-xl border border-gray-200 py-2.5 text-[10px] font-bold text-gray-600 disabled:cursor-not-allowed disabled:opacity-40">Rechazar</button>
                <button type="button" disabled={!isOnline || Boolean(activeOrder)} onClick={() => acceptOrder(order)} className="flex items-center justify-center gap-1.5 rounded-xl bg-[#211716] py-2.5 text-[10px] font-bold text-white transition hover:bg-black disabled:cursor-not-allowed disabled:opacity-40">
                  Aceptar pedido <i data-lucide="chevron-right" className="h-3.5 w-3.5"></i>
                </button>
              </div>
            </article>
          ))}
          {liveOrders.length > 0 && <p className="rounded-xl border border-dashed border-green-200 bg-green-50 p-2.5 text-center text-[9px] leading-relaxed text-green-800">Pedidos en línea compartidos con la app principal. La lista se actualiza cada 2,5 segundos.</p>}
        </section>
      );

      const renderRoutes = () => !activeOrder ? (
        <section className="rider-card space-y-3 p-5 text-center">
          <div className="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-[#fff2df] text-[#a90000]"><i data-lucide="route" className="h-6 w-6"></i></div>
          <h1 className="font-title text-lg font-bold">Aún no tienes una ruta</h1>
          <p className="text-xs text-gray-500">Acepta un pedido para ver sus indicaciones de recojo y entrega.</p>
          <button type="button" onClick={() => setActiveTab('orders')} className="rounded-xl bg-[#a90000] px-4 py-2.5 text-xs font-bold text-white">Ver pedidos</button>
        </section>
      ) : (
        <section className="space-y-3">
          <div>
            <h1 className="font-title text-xl font-bold">Navegación UPCH</h1>
            <p className="text-[11px] text-gray-500">Pedido #{activeOrder.id} · {activeOrder.step === 0 ? 'Ruta al punto de recojo' : 'Ruta al cliente'}</p>
          </div>
          {renderMap(activeOrder.step)}
          <p className="px-1 text-[9px] text-gray-500" role="status">
            {activeOrder.step === 0
              ? 'El GPS del repartidor se compartirá con el cliente al confirmar el recojo.'
              : locationSharingStatus || 'El seguimiento GPS se activa al confirmar el recojo.'}
          </p>
          <div className="rider-card space-y-3 p-4">
            <div className="flex items-start justify-between">
              <div>
                <p className="text-[9px] font-bold uppercase tracking-wider text-[#a90000]">Cliente: {activeOrder.customer}</p>
                <h2 className="mt-1 font-title text-sm font-bold">{activeOrder.item}</h2>
              </div>
              <span className="font-title text-sm font-bold text-[#a90000]">S/{activeOrder.payout.toFixed(2)}<span className="block text-right text-[8px] text-gray-500">ganancia estimada</span></span>
            </div>

            <div className="space-y-2 rounded-xl bg-[#fffaf0] p-3">
              <div className={`flex gap-2 ${activeOrder.step === 0 ? 'text-[#a90000]' : 'text-green-700'}`}>
                <i data-lucide={activeOrder.step === 0 ? 'circle-dot' : 'circle-check'} className="mt-0.5 h-4 w-4"></i>
                <div><p className="text-[10px] font-bold">RECOGER EN</p><p className="text-[10px] text-gray-600">{activeOrder.pickup}</p></div>
              </div>
              <div className="ml-[7px] h-4 border-l border-dashed border-gray-300"></div>
              <div className={`flex gap-2 ${activeOrder.step === 1 ? 'text-[#a90000]' : 'text-gray-500'}`}>
                <i data-lucide={activeOrder.step === 1 ? 'circle-dot' : 'map-pin'} className="mt-0.5 h-4 w-4"></i>
                <div><p className="text-[10px] font-bold">ENTREGAR EN</p><p className="text-[10px] text-gray-600">{activeOrder.dropoff}</p></div>
              </div>
            </div>

            <div className="flex items-center justify-between text-[9px] text-gray-500">
              <span>{activeOrder.distance} · aprox. {activeOrder.eta} min</span>
              <span>{activeOrder.payment}</span>
            </div>
            <div className="grid grid-cols-2 gap-2 py-2">
              <button type="button" onClick={() => voiceCall.startCall()} disabled={['incoming', 'ringing', 'connecting', 'connected'].includes(voiceCall.call.status)} aria-label="Llamar al cliente dentro de la app" className="flex flex-col items-center gap-1.5 py-1 text-center text-[10px] font-bold text-[#a90000] disabled:cursor-not-allowed disabled:opacity-50">
                <span className="flex h-14 w-14 items-center justify-center rounded-full border-2 border-[#a90000] bg-white shadow-sm">
                  <i data-lucide="phone" className="h-6 w-6"></i>
                </span>
                Llamar al cliente
              </button>
              <div className="relative flex flex-col items-center">
                {hasNewCustomerMessage && !isRiderChatOpen && (
                  <div
                    className="new-rider-message absolute bottom-full right-0 z-20 mb-3 flex w-56 items-center gap-2 rounded-2xl px-3 py-2.5 text-left text-xs font-bold text-white"
                    role="status"
                    aria-live="polite"
                  >
                    <img
                      key={riderChatMessages.filter((message) => message.sender === 'customer').length % APP_STICKER_COUNT}
                      src={`/${getStickerAssetName((riderChatMessages.filter((message) => message.sender === 'customer').length % APP_STICKER_COUNT) + 1)}`}
                      alt=""
                      className="new-rider-message-sticker h-10 w-10 shrink-0 object-contain"
                    />
                    <span className="flex-1">¡Tienes un nuevo mensaje!</span>
                    <span className="absolute -bottom-1.5 right-7 h-3 w-3 rotate-45 rounded-sm bg-[#a90000]" aria-hidden="true"></span>
                  </div>
                )}
                <button
                  type="button"
                  onClick={() => {
                    setHasNewCustomerMessage(false);
                    setIsRiderChatOpen(true);
                  }}
                  aria-label="Abrir chat con el cliente"
                  className="flex flex-col items-center gap-1.5 py-1 text-center text-[10px] font-bold text-[#a90000]"
                >
                  <span className="flex h-14 w-14 items-center justify-center rounded-full border-2 border-[#a90000] bg-white shadow-sm">
                    <i data-lucide="message-circle" className="h-6 w-6"></i>
                  </span>
                  Chat con el cliente
                </button>
              </div>
            </div>
            <a
              href="https://www.google.com/maps/dir/KOU-XIN,+Av.+Armend%C3%A1riz+524,+Miraflores+15076/Universidad+Peruana+Cayetano+Heredia+-+Sede+Miraflores,+Av.+Armend%C3%A1riz+497,+Miraflores+15074/@-12.1344714,-77.0260124,20.03z/data=!4m13!4m12!1m5!1m1!1s0x9105b7007a198825:0xc97840f7f6ccaee5!2m2!1d-77.0260012!2d-12.1348222!1m5!1m1!1s0x9105b7e3bfbe8e9b:0xbd7840de0e702ace!2m2!1d-77.0260721!2d-12.1341675?entry=ttu&g_ep=EgoyMDI2MTAyOC4wIKXMDSoASAFQAw%3D%3D"
              target="_blank"
              rel="noopener noreferrer"
              className="flex w-full items-center justify-center gap-2 rounded-xl border border-[#a90000]/25 py-2.5 text-[10px] font-bold text-[#a90000]"
            >
              <i data-lucide="navigation" className="h-4 w-4"></i> Abrir ruta en Google Maps
            </a>
            {unavailableDeliveryOrderId === activeOrder.id ? (
              <div className="space-y-2 rounded-xl border border-amber-200 bg-amber-50 p-3">
                <p className="text-center text-[10px] text-amber-900" role="alert">El servidor ya cambió el estado de este pedido. No se marcará como completado ni afectará tus ganancias.</p>
                <button type="button" onClick={discardUnavailableDeliveryOrder} className="flex w-full items-center justify-center gap-2 rounded-xl bg-[#a90000] py-3 text-xs font-bold text-white shadow-md">
                  Quitar solo este pedido y continuar
                </button>
              </div>
            ) : (
              <button type="button" onClick={confirmOrderStep} className="flex w-full items-center justify-center gap-2 rounded-xl bg-[#a90000] py-3 text-xs font-bold text-white shadow-md">
                <i data-lucide={activeOrder.step === 0 ? 'package-check' : 'check-circle-2'} className="h-4 w-4"></i>
                {activeOrder.step === 0 ? 'Confirmar recojo' : 'Confirmar entrega'}
              </button>
            )}
            <p className="text-center text-[9px] text-gray-500">Al confirmar cada etapa, el estado se actualiza en el servidor de Al Toque.</p>
          </div>
          <div className="rider-card p-3">
            <div className="flex items-center justify-between gap-2">
              <div>
                <p className="text-[10px] font-bold">Ubicación del dispositivo</p>
                <p className="text-[9px] text-gray-500">{gps.status === 'active' ? `GPS activo · precisión ±${Math.round(gps.accuracy)} m` : 'La ubicación no se comparte mientras el GPS está desactivado.'}</p>
              </div>
              <button type="button" onClick={requestGps} disabled={gps.status === 'loading' || gps.status === 'active'} className="shrink-0 rounded-lg border border-gray-200 px-2.5 py-2 text-[9px] font-bold text-[#a90000] disabled:opacity-50">
                {gps.status === 'active' ? 'GPS activo' : gps.status === 'loading' ? 'Buscando…' : 'Activar GPS'}
              </button>
            </div>
            {gps.status === 'active' && (
              <div className="mt-2 space-y-1 rounded-lg bg-[#fff8f1] p-2 text-[9px] text-gray-600">
                <p><span className="font-bold text-gray-700">Departamento:</span> {gps.department || 'Buscando…'}</p>
                <p><span className="font-bold text-gray-700">Distrito:</span> {gps.district || 'Buscando…'}</p>
                <p><span className="font-bold text-gray-700">Avenida/calle:</span> {gps.road || (gps.addressError ? 'No identificada en el mapa' : 'Buscando…')}</p>
                <p><span className="font-bold text-gray-700">Distancia a UPCH Miraflores:</span> {gps.distanceKm === null ? 'Calculando…' : `${gps.distanceKm.toFixed(2)} km en línea recta`}</p>
                <p className="text-[8px] text-gray-500">Precisión ±{Math.round(gps.accuracy)} m · {gps.latitude.toFixed(5)}, {gps.longitude.toFixed(5)}</p>
                {gps.addressError && <p className="text-red-600">{gps.addressError}</p>}
                {gps.addressError && <button type="button" onClick={() => void lookupGpsAddress(gps.latitude, gps.longitude)} className="font-bold text-[#a90000]">Reintentar dirección</button>}
                <p className="text-[8px] text-gray-500">Dirección aproximada al activar GPS · OpenStreetMap</p>
              </div>
            )}
            {gps.message && <p className="mt-2 text-[9px] text-red-600" role="alert">{gps.message}</p>}
          </div>
          {isRiderChatOpen && ReactDOM.createPortal(
            <div
              className="absolute inset-0 z-[100] flex items-center justify-center bg-black/45 p-5"
              onMouseDown={(event) => {
                if (event.target === event.currentTarget) setIsRiderChatOpen(false);
              }}
            >
              <section className="relative w-full max-w-sm space-y-3 rounded-2xl bg-white p-4 shadow-2xl" role="dialog" aria-modal="true" aria-label="Chat con el cliente">
                <button type="button" onClick={() => setIsRiderChatOpen(false)} aria-label="Cerrar chat" className="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100">
                  <i data-lucide="x" className="h-5 w-5"></i>
                </button>
                <h3 className="pr-10 text-xs font-bold">Chat con {activeOrder.customer || 'el cliente'}</h3>
                <OrderChatPanel
                  messages={riderChatMessages}
                  role="rider"
                  sendError={riderChatError}
                  onSend={sendRiderChatReply}
                  emptyMessage="Aún no hay mensajes."
                />
              </section>
            </div>,
            document.getElementById('root')
          )}
          <VoiceCallDialog controller={voiceCall} contactName={activeOrder.customer || 'el cliente'} />
        </section>
      );

      const renderEarnings = () => (
        <section className="space-y-4">
          <div className="rounded-b-3xl rounded-t-[22px] bg-[#211716] px-5 py-6 text-center text-white">
            <p className="text-[9px] font-bold uppercase tracking-[.18em] text-amber-300">Acumulado por entregas completadas</p>
            <p className="mt-1 font-title text-4xl font-bold">S/ {earnings.toFixed(2)}</p>
            <p className="mt-1 text-[9px] text-white/55">Registro local de esta sesión del dispositivo</p>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div className="rider-card p-3"><p className="text-[9px] uppercase text-gray-500">Últimos 7 días</p><p className="mt-1 font-title text-lg font-bold text-[#a90000]">S/{weeklyEarnings.toFixed(2)}</p><p className="text-[9px] text-gray-500">Suma de entregas registradas aquí</p></div>
            <div className="rider-card p-3"><p className="text-[9px] uppercase text-gray-500">Entregas · total local</p><p className="mt-1 font-title text-lg font-bold">{completedCount}</p><p className="text-[9px] text-gray-500">{weeklyCompletedCount} en los últimos 7 días</p></div>
          </div>
          <div className="rider-card p-4">
            <div className="flex items-center justify-between"><h2 className="font-title text-sm font-bold">Actividad de los últimos 7 días</h2><span className="text-[9px] text-gray-500">Ganancia local</span></div>
            <div className="mt-3 flex h-28 items-end justify-around gap-2 border-b border-gray-100 px-1">
              {weekDays.map((day, index) => <div key={`${day.label}-${index}`} title={`S/${day.amount.toFixed(2)}`} className="flex h-full flex-1 flex-col justify-end"><div className="min-h-1 rounded-t-md bg-[#a90000]/80" style={{ height: `${day.amount > 0 ? Math.max(8, day.amount / weeklyMax * 100) : 3}%` }}></div><span className="pt-1 text-center text-[8px] text-gray-500">{day.label}</span></div>)}
            </div>
          </div>
          <div>
            <div className="mb-2 flex items-center justify-between"><h2 className="font-title text-sm font-bold">Actividad reciente</h2><span className="text-[9px] text-gray-500">Entregas reales de esta sesión</span></div>
            <div className="space-y-2">
              {completedOrders.slice(0, 4).map((order, index) => (
                <div key={`${order.id}-${index}`} className="rider-card flex items-center justify-between p-3">
                  <div className="flex items-center gap-2"><span className="flex h-8 w-8 items-center justify-center rounded-full bg-[#fff2df] text-[#a90000]"><i data-lucide="bike" className="h-4 w-4"></i></span><div><p className="text-[10px] font-bold">Pedido #{order.id}</p><p className="text-[9px] text-gray-500">{order.item} · {order.completedAt || 'Ayer'}</p></div></div>
                  <div className="text-right"><p className="text-[10px] font-bold">S/{order.payout.toFixed(2)}</p><p className="text-[8px] uppercase text-gray-500">entrega</p></div>
                </div>
              ))}
              {completedOrders.length === 0 && <p className="rider-card p-4 text-center text-[10px] text-gray-500">Aquí aparecerán tus pedidos cuando completes una entrega real.</p>}
            </div>
          </div>
        </section>
      );

      const renderProfile = () => {
        const reviews = [...riderReviewProfile.reviews, ...localRiderReviews.filter((local) => !riderReviewProfile.reviews.some((remote) => remote.orderId === local.orderId))]
          .sort((first, second) => Number(new Date(second.createdAt)) - Number(new Date(first.createdAt)));
        const reviewCount = reviews.length;
        const ratingAverage = reviewCount ? Number((reviews.reduce((sum, review) => sum + review.rating, 0) / reviewCount).toFixed(1)) : 0;
        return (
        <section className="space-y-4">
          <div className="rounded-3xl bg-[#211716] p-5 text-white">
            <p className="text-[9px] font-bold uppercase tracking-[.15em] text-amber-300">Perfil del repartidor</p>
            <div className="mt-2 flex items-center gap-3">
              <div className="flex h-14 w-14 shrink-0 items-center justify-center overflow-hidden rounded-full border-2 border-white/50 bg-white/10 text-xl">
                {riderDetails.profilePhoto ? <img src={riderDetails.profilePhoto} alt={`Foto de ${displayedRiderName}`} className="h-full w-full object-cover" /> : <span aria-hidden="true">{displayedRiderName.slice(0, 1).toUpperCase()}</span>}
              </div>
              <div className="min-w-0"><h1 className="truncate font-title text-xl font-bold">{displayedRiderName}</h1><p className="mt-1 text-[10px] text-white/65">Campus Cayetano · Panel conectado a pedidos</p></div>
            </div>
            <div className="mt-3 flex items-center justify-between gap-2">
              <span className="rounded-full bg-white/10 px-2.5 py-1 text-[10px] font-bold">
                {reviewCount > 0
                  ? `★ ${ratingAverage.toFixed(1)} · ${reviewCount} opiniones`
                  : 'Aún sin calificaciones'}
              </span>
              <span className="flex items-center gap-1 rounded-full bg-green-500/20 px-2.5 py-1 text-[9px] font-bold text-green-200" aria-label="Distintivo informativo de capacitación de Al Toque">
                <i data-lucide="shield-check" className="h-3.5 w-3.5"></i> Capacitación Al Toque
              </span>
            </div>
            <p className="mt-1 text-right text-[8px] text-white/45">Insignia informativa; no acredita una certificación oficial.</p>
            <div className="mt-4 border-t border-white/15 pt-3 text-center"><p className="font-bold">{completedCount}</p><p className="text-[8px] text-white/55">Entregas completadas en este dispositivo</p></div>
          </div>

          <div className="rider-card space-y-3 p-4">
            <div className="flex items-center justify-between gap-2">
              <div><h2 className="text-xs font-bold">Opiniones de tus clientes</h2><p className="mt-1 text-[9px] text-gray-500">Se actualizan automáticamente desde los pedidos entregados.</p></div>
              <span className="text-lg font-bold text-amber-500">{ratingAverage > 0 ? `★ ${ratingAverage.toFixed(1)}` : '—'}</span>
            </div>
            {reviews.length > 0 ? (
              <div className="space-y-2">
                {reviews.slice(0, 5).map((review) => (
                  <article key={review.orderId} className="rounded-xl bg-gray-50 p-3">
                    <div className="flex items-center justify-between gap-2">
                      <p className="truncate text-[10px] font-bold">{review.customer}</p>
                      <span className="shrink-0 text-[10px] font-bold text-amber-500">{'★'.repeat(review.rating)}<span className="text-gray-200">{'★'.repeat(5 - review.rating)}</span></span>
                    </div>
                    <p className="mt-1 text-[10px] leading-relaxed text-gray-600">{review.comment}</p>
                    <p className="mt-1 text-right text-[8px] text-gray-500">{new Date(review.createdAt).toLocaleDateString('es-PE')}</p>
                  </article>
                ))}
              </div>
            ) : (
              <p className="rounded-xl bg-gray-50 p-3 text-[10px] text-gray-500">Cuando un cliente califique una entrega completada, su comentario aparecerá aquí.</p>
            )}
          </div>

          <div className="rider-card space-y-3 p-4">
            <div><h2 className="text-xs font-bold">Ubicación y seguridad</h2><p className="mt-1 text-[10px] leading-relaxed text-gray-500">El GPS solo se solicita cuando lo activas. El punto se muestra en este dispositivo.</p></div>
            <button type="button" onClick={requestGps} disabled={gps.status === 'loading' || gps.status === 'active'} className="flex w-full items-center justify-center gap-2 rounded-xl border border-gray-200 py-2.5 text-[10px] font-bold text-[#a90000] disabled:opacity-50">
              <i data-lucide="locate-fixed" className="h-4 w-4"></i>{gps.status === 'active' ? 'Ubicación activa' : gps.status === 'loading' ? 'Solicitando ubicación…' : 'Activar ubicación del dispositivo'}
            </button>
            {gps.status === 'active' && (
              <div className="space-y-1 rounded-lg bg-[#fff8f1] p-2 text-[9px] text-gray-600">
                <p><span className="font-bold text-gray-700">Departamento:</span> {gps.department || 'Buscando…'}</p>
                <p><span className="font-bold text-gray-700">Distrito:</span> {gps.district || 'Buscando…'}</p>
                <p><span className="font-bold text-gray-700">Avenida/calle:</span> {gps.road || (gps.addressError ? 'No identificada en el mapa' : 'Buscando…')}</p>
                <p><span className="font-bold text-gray-700">Distancia a UPCH Miraflores:</span> {gps.distanceKm === null ? 'Calculando…' : `${gps.distanceKm.toFixed(2)} km en línea recta`}</p>
                <p className="text-[8px] text-gray-500">Precisión ±{Math.round(gps.accuracy)} m · {gps.latitude.toFixed(5)}, {gps.longitude.toFixed(5)}</p>
                {gps.addressError && <p className="text-red-600">{gps.addressError}</p>}
                {gps.addressError && <button type="button" onClick={() => void lookupGpsAddress(gps.latitude, gps.longitude)} className="font-bold text-[#a90000]">Reintentar dirección</button>}
                <p className="text-[8px] text-gray-500">Dirección aproximada al activar GPS · OpenStreetMap</p>
              </div>
            )}
            {gps.message && <p className="text-[10px] text-red-600" role="alert">{gps.message}</p>}
          </div>

          <div className="rider-card divide-y divide-gray-100">
            <button type="button" onClick={() => { setProfileFormError(''); setProfileModal('identity'); }} className="flex w-full items-center gap-3 p-3 text-left">
              <span className="flex h-9 w-9 items-center justify-center rounded-xl bg-[#fff2df] text-[#a90000]"><i data-lucide="file-check-2" className="h-4 w-4"></i></span>
              <span className="flex-1"><span className="block text-[10px] font-bold">Idoneidad y documentos</span><span className="block text-[9px] text-gray-500">{riderDetails.dni ? 'Datos guardados en este dispositivo' : 'Agrega tus datos y fotos de identificación'}</span></span>
              <i data-lucide="chevron-right" className="h-4 w-4 text-gray-500"></i>
            </button>
            <button type="button" onClick={() => setProfileModal('vehicle')} className="flex w-full items-center gap-3 p-3 text-left">
              <span className="flex h-9 w-9 items-center justify-center rounded-xl bg-[#fff2df] text-[#a90000]"><i data-lucide="bike" className="h-4 w-4"></i></span>
              <span className="flex-1"><span className="block text-[10px] font-bold">Vehículo</span><span className="block text-[9px] text-gray-500">{riderDetails.vehicle || 'Elige moto, bicicleta o caminar'}</span></span>
              <i data-lucide="chevron-right" className="h-4 w-4 text-gray-500"></i>
            </button>
            <button type="button" onClick={() => { setSupportQuery(''); setSupportAnswer(null); setSupportError(''); setProfileModal('support'); }} className="flex w-full items-center gap-3 p-3 text-left">
              <span className="flex h-9 w-9 items-center justify-center rounded-xl bg-[#fff2df] text-[#a90000]"><i data-lucide="life-buoy" className="h-4 w-4"></i></span>
              <span className="flex-1"><span className="block text-[10px] font-bold">Ayuda y soporte</span><span className="block text-[9px] text-gray-500">Asistente y 12 respuestas frecuentes</span></span>
              <i data-lucide="chevron-right" className="h-4 w-4 text-gray-500"></i>
            </button>
          </div>
          {profileModal && (
            <div className="fixed inset-0 z-[80] flex items-end justify-center bg-black/50 p-0 sm:items-center sm:p-4" onClick={closeProfileModal}>
              <section
                className="max-h-[88vh] w-full max-w-[390px] space-y-4 overflow-y-auto rounded-t-[28px] bg-white p-5 shadow-2xl sm:rounded-[28px]"
                role="dialog"
                aria-modal="true"
                aria-labelledby="rider-profile-modal-title"
                onClick={(event) => event.stopPropagation()}
              >
                <div className="flex items-start justify-between gap-3">
                  <div>
                    <p className="text-[9px] font-bold uppercase tracking-wider text-[#a90000]">Perfil del repartidor</p>
                    <h2 id="rider-profile-modal-title" className="mt-1 font-title text-lg font-bold">
                      {profileModal === 'identity' ? 'Datos e identificación' : profileModal === 'vehicle' ? 'Elige tu medio de transporte' : 'Ayuda y soporte'}
                    </h2>
                  </div>
                  <button type="button" onClick={closeProfileModal} aria-label="Cerrar ventana" className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gray-100 text-xl text-gray-600">×</button>
                </div>

                {profileModal === 'identity' && (
                  <form className="space-y-3" onSubmit={async (event) => {
                    event.preventDefault();
                    if (riderDetails.fullName.trim().length < 2) {
                      setProfileFormError('Escribe tu nombre completo.');
                      return;
                    }
                    if (!/^\d{8}$/.test(riderDetails.dni)) {
                      setProfileFormError('El DNI debe tener 8 dígitos.');
                      return;
                    }
                    try {
                      await savePublicRiderProfile(riderDetails);
                      localStorage.setItem('altoque_rider_profile', JSON.stringify(riderDetails));
                    } catch (error) {
                      console.error('No se pudo guardar el perfil local del repartidor:', error);
                      setProfileFormError(`No se pudo sincronizar el perfil con tus clientes: ${error.message}`);
                      return;
                    }
                    setProfileFormError('');
                    closeProfileModal();
                    showNotice('Tu perfil actualizado ya aparece para tus clientes.');
                  }}>
                    <p className="text-[10px] leading-relaxed text-gray-500">El nombre y la foto de perfil se mostrarán al cliente asignado. El DNI y la foto del documento solo se guardan en este dispositivo.</p>
                    <div>
                      <label htmlFor="rider-full-name" className="mb-1 block text-[10px] font-bold text-gray-600">Nombre completo</label>
                      <input id="rider-full-name" value={riderDetails.fullName} onChange={(event) => setRiderDetails((current) => ({ ...current, fullName: event.target.value.slice(0, 80) }))} maxLength={80} autoComplete="name" className="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-xs focus:border-[#a90000] focus:outline-none" required />
                    </div>
                    <div>
                      <label htmlFor="rider-dni" className="mb-1 block text-[10px] font-bold text-gray-600">DNI (8 dígitos)</label>
                      <input id="rider-dni" value={riderDetails.dni} onChange={(event) => setRiderDetails((current) => ({ ...current, dni: event.target.value.replace(/\D/g, '').slice(0, 8) }))} inputMode="numeric" autoComplete="off" maxLength={8} className="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-xs focus:border-[#a90000] focus:outline-none" required />
                    </div>
                    <div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div className="space-y-2">
                        <p className="text-[10px] font-bold text-gray-600">Foto de perfil</p>
                        <input ref={profilePhotoInputRef} type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={(event) => handleRiderPhoto(event, 'profilePhoto')} aria-label="Seleccionar foto de perfil del repartidor" />
                        <button type="button" onClick={() => profilePhotoInputRef.current?.click()} className="flex h-24 w-full items-center justify-center overflow-hidden rounded-xl border border-dashed border-gray-300 bg-gray-50 text-[10px] font-semibold text-[#a90000]">
                          {riderDetails.profilePhoto ? <img src={riderDetails.profilePhoto} alt="Vista previa de perfil" className="h-full w-full object-cover" /> : 'Subir foto'}
                        </button>
                      </div>
                      <div className="space-y-2">
                        <p className="text-[10px] font-bold text-gray-600">Foto del documento</p>
                        <input ref={identityPhotoInputRef} type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={(event) => handleRiderPhoto(event, 'identityPhoto')} aria-label="Seleccionar foto del documento de identidad" />
                        <button type="button" onClick={() => identityPhotoInputRef.current?.click()} className="flex h-24 w-full items-center justify-center overflow-hidden rounded-xl border border-dashed border-gray-300 bg-gray-50 text-[10px] font-semibold text-[#a90000]">
                          {riderDetails.identityPhoto ? <img src={riderDetails.identityPhoto} alt="Vista previa del documento" className="h-full w-full object-cover" /> : 'Subir documento'}
                        </button>
                      </div>
                    </div>
                    <p className="rounded-xl bg-amber-50 p-3 text-[9px] leading-relaxed text-amber-900">Privacidad: el DNI y la foto del documento se guardan únicamente en este navegador y no se comparten. El nombre y la foto de perfil se sincronizan para mostrarse al cliente de tu pedido.</p>
                    {profileFormError && <p className="text-[10px] text-red-600" role="alert">{profileFormError}</p>}
                    <button type="submit" className="w-full rounded-xl bg-[#a90000] py-3 text-xs font-bold text-white">Guardar datos</button>
                  </form>
                )}

                {profileModal === 'vehicle' && (
                  <div className="space-y-2">
                    <p className="text-[10px] text-gray-500">Selecciona cómo realizarás las entregas. El cliente de tu pedido podrá ver el medio elegido.</p>
                    {profileFormError && <p className="text-[10px] text-red-600" role="alert">{profileFormError}</p>}
                    {[
                      { name: 'Moto', icon: 'bike', detail: 'Entrega motorizada' },
                      { name: 'Bicicleta', icon: 'bike', detail: 'Entrega en bicicleta' },
                      { name: 'Caminando', icon: 'footprints', detail: 'Entrega a pie en el campus' }
                    ].map((vehicle) => (
                      <button key={vehicle.name} type="button" onClick={async () => {
                        const nextDetails = { ...riderDetails, vehicle: vehicle.name };
                        try {
                          await savePublicRiderProfile(nextDetails);
                          setRiderDetails(nextDetails);
                          closeProfileModal();
                          showNotice(`Medio de transporte actualizado para tu cliente: ${vehicle.name}.`);
                        } catch (error) {
                          console.error('No se pudo sincronizar el medio de transporte del repartidor:', error);
                          setProfileFormError(`No se pudo actualizar para el cliente: ${error.message}`);
                        }
                      }} aria-pressed={riderDetails.vehicle === vehicle.name} className={`flex w-full items-center gap-3 rounded-xl border p-3 text-left ${riderDetails.vehicle === vehicle.name ? 'border-green-300 bg-green-50' : 'border-gray-200 bg-white'}`}>
                        <span className="flex h-10 w-10 items-center justify-center rounded-xl bg-[#fff2df] text-xl" aria-hidden="true">{vehicle.name === 'Moto' ? '🛵' : vehicle.name === 'Bicicleta' ? '🚲' : '🚶'}</span>
                        <span className="flex-1"><span className="block text-xs font-bold">{vehicle.name}</span><span className="block text-[9px] text-gray-500">{vehicle.detail}</span></span>
                        {riderDetails.vehicle === vehicle.name && <span className="text-sm font-bold text-green-700" aria-label="Seleccionado">✓</span>}
                      </button>
                    ))}
                  </div>
                )}

                {profileModal === 'support' && (
                  <div className="space-y-3">
                    <p className="text-[10px] leading-relaxed text-gray-500">Pregúntale directamente al asistente de soporte de Al Toque. La respuesta de Botpress aparecerá aquí, sin abrir otra ventana.</p>
                    <form className="flex gap-2" onSubmit={(event) => { event.preventDefault(); answerSupportQuestion(); }}>
                      <input value={supportQuery} onChange={(event) => { setSupportQuery(event.target.value); setSupportError(''); }} placeholder="¿En qué te puedo ayudar?" className="min-w-0 flex-1 rounded-xl border border-gray-200 px-3 py-2.5 text-[11px] focus:border-[#a90000] focus:outline-none" aria-label="Pregunta para el asistente" maxLength={1000} />
                      <button type="submit" disabled={supportIsLoading} className="rounded-xl bg-[#a90000] px-3 text-[10px] font-bold text-white disabled:opacity-50">{supportIsLoading ? 'Pensando…' : 'Consultar'}</button>
                    </form>
                    {supportError && <p className="text-[10px] text-gray-500" role="status">{supportError}</p>}
                    {supportIsLoading && <p className="text-[10px] text-gray-500" role="status">La IA está preparando una orientación…</p>}
                    {supportAnswer && <article className="space-y-1 rounded-xl border border-green-200 bg-green-50 p-3" aria-live="polite"><p className="text-[10px] font-bold text-green-900">{supportAnswer.question}</p><p className="text-[10px] leading-relaxed text-green-900">{supportAnswer.answer}</p></article>}
                    <div className="max-h-[38vh] space-y-2 overflow-y-auto">
                      <p className="text-[10px] font-semibold text-gray-600">También puedes preguntar sobre:</p>
                      {RIDER_SUPPORT_FAQS.map((faq) => (
                        <button key={faq.question} type="button" onClick={() => { setSupportQuery(faq.question); answerSupportQuestion(faq.question); }} className="flex w-full items-center justify-between gap-2 rounded-xl border border-gray-100 bg-white p-3 text-left text-[10px] font-semibold text-gray-700 hover:border-[#a90000]/30">
                          <span>{faq.question}</span><span className="shrink-0 text-lg text-gray-500" aria-hidden="true">›</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </section>
            </div>
          )}
          <button type="button" onClick={onExit} className="w-full rounded-xl border border-gray-200 bg-white py-3 text-xs font-bold text-[#211716]">Volver a Al Toque</button>
        </section>
        );
      };

      const tabs = [
        { id: 'orders', label: 'Pedidos', icon: 'clipboard-list' },
        { id: 'routes', label: 'Rutas', icon: 'map' },
        { id: 'earnings', label: 'Ganancias', icon: 'chart-no-axes-column-increasing' },
        { id: 'profile', label: 'Perfil', icon: 'user-round' }
      ];

      return (
        <div className="rider-app">
          <header className="rider-topbar">
            <div className="flex items-center gap-2">
              <button type="button" onClick={onExit} aria-label="Volver a Al Toque" className="flex h-9 w-9 items-center justify-center rounded-full bg-white/15"><i data-lucide="arrow-left" className="h-4 w-4"></i></button>
              <div><p className="rider-brand-title">Al Toque PE</p><p className="rider-brand-subtitle">PANEL DEL REPARTIDOR</p></div>
            </div>
            <button type="button" onClick={() => {
              if (activeOrder) {
                showNotice('Completa tu entrega antes de desconectarte.');
                return;
              }
              setIsOnline((value) => !value);
            }} aria-pressed={isOnline} className={`flex items-center gap-2 rounded-full px-3 py-2 text-[9px] font-bold ${isOnline ? 'bg-white/15' : 'bg-black/20'}`}>
              {isOnline ? 'En línea' : 'Desconectado'}<span className={`h-2.5 w-2.5 rounded-full ${isOnline ? 'bg-green-400' : 'bg-gray-400'}`}></span>
            </button>
          </header>

          <main className="rider-content">
            {activeTab === 'orders' && renderOrders()}
            {activeTab === 'routes' && renderRoutes()}
            {activeTab === 'earnings' && renderEarnings()}
            {activeTab === 'profile' && renderProfile()}
          </main>

          {notice && <div className="absolute left-1/2 top-20 z-20 w-[calc(100%-32px)] -translate-x-1/2 rounded-xl bg-[#211716] px-4 py-3 text-center text-[11px] font-semibold text-white shadow-xl" role="status">{notice}</div>}

          <nav className="rider-bottom-nav" aria-label="Navegación del repartidor">
            {tabs.map((tab) => (
              <button key={tab.id} type="button" onClick={() => setActiveTab(tab.id)} aria-current={activeTab === tab.id ? 'page' : undefined} className={`rider-nav-item ${activeTab === tab.id ? 'active' : ''}`}>
                <i data-lucide={tab.icon} className="h-4 w-4"></i><span>{tab.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    function ProfileScreen({ onNavigate, onBecomeRider, onRestoreClassicHome, notifications, setNotifications, profile, setProfile, orderHistory, orderHistoryStorageError, onClearOrderHistory }) {
      const [showQuestionnaire, setShowQuestionnaire] = useState(!profile.privacyAccepted);
      const [showThankYou, setShowThankYou] = useState(false);
      const [isSendingMarketingConfirmation, setIsSendingMarketingConfirmation] = useState(false);
      const [marketingEmailError, setMarketingEmailError] = useState('');
      const [marketingEmailStatus, setMarketingEmailStatus] = useState('');
      const [showHelp, setShowHelp] = useState(false);
      const [showOrderHistory, setShowOrderHistory] = useState(false);
      const [showThemePicker, setShowThemePicker] = useState(false);
      const [showComplaintsBook, setShowComplaintsBook] = useState(false);
      const [complaintForm, setComplaintForm] = useState(() => ({
        kind: 'reclamo',
        consumerName: profile.fullName || '',
        documentType: 'DNI',
        documentNumber: '',
        address: '',
        email: profile.email || '',
        phone: profile.phone || '',
        product: '',
        amount: '',
        description: '',
        request: '',
        privacyConsent: false
      }));
      const [isSubmittingComplaint, setIsSubmittingComplaint] = useState(false);
      const [complaintError, setComplaintError] = useState('');
      const [complaintReceipt, setComplaintReceipt] = useState(null);
      const [photoError, setPhotoError] = useState('');
      const [showRiderAccess, setShowRiderAccess] = useState(false);
      const riderPinInputRef = useRef(null);
      const [riderPin, setRiderPin] = useState('');
      const [riderPinError, setRiderPinError] = useState('');
      const [isCheckingRiderPin, setIsCheckingRiderPin] = useState(false);
      const photoInputRef = useRef(null);
      const updateProfile = (field, value) => setProfile((current) => ({ ...current, [field]: value }));
      const submitComplaint = async (event) => {
        event.preventDefault();
        setIsSubmittingComplaint(true);
        setComplaintError('');
        try {
          const response = await fetch('/api/complaints', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(complaintForm)
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || `No se pudo enviar la solicitud (${response.status}).`);
          if (!payload.complaint || typeof payload.complaint.id !== 'string' || typeof payload.complaint.submittedAt !== 'string') {
            throw new Error('El servidor no devolvió la constancia de tu solicitud.');
          }
          setComplaintReceipt(payload.complaint);
        } catch (error) {
          setComplaintError(error.message || 'No se pudo enviar la solicitud. Inténtalo nuevamente.');
        } finally {
          setIsSubmittingComplaint(false);
        }
      };
      const handleSalesUpdatesChange = async (event) => {
        if (!event.target.checked) {
          setProfile((current) => ({ ...current, salesUpdates: false, salesUpdatesConsentAt: null }));
          setMarketingEmailError('');
          setMarketingEmailStatus('');
          return;
        }

        const email = typeof profile.email === 'string' ? profile.email.trim() : '';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 254) {
          setMarketingEmailError('Ingresa un correo válido para enviarte la confirmación.');
          document.getElementById('profile-email')?.focus();
          return;
        }

        setIsSendingMarketingConfirmation(true);
        setMarketingEmailError('');
        setMarketingEmailStatus('');
        try {
          const response = await fetch('/api/marketing/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || `Error ${response.status}`);
          setProfile((current) => ({
            ...current,
            salesUpdates: true,
            salesUpdatesConsentAt: Date.now()
          }));
          setMarketingEmailStatus(payload.provider === 'hubspot'
            ? '¡Listo! Registramos tu suscripción a recomendaciones y promociones.'
            : '¡Listo! Te enviamos un correo para confirmar tu inscripción a Al Toque Pe.');
        } catch (error) {
          setMarketingEmailError(error.message || 'No se pudo enviar el correo de confirmación.');
        } finally {
          setIsSendingMarketingConfirmation(false);
        }
      };
      const closeRiderAccess = () => {
        setShowRiderAccess(false);
        setRiderPin('');
        setRiderPinError('');
      };
      const handleRiderAccess = async (event) => {
        event.preventDefault();
        setRiderPinError('');
        setIsCheckingRiderPin(true);
        try {
          const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(riderPin));
          const pinDigest = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
          if (pinDigest !== '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4') {
            setRiderPinError('Tú eres nuestro consumidor, sirvase a pedir algo');
            setRiderPin('');
            return;
          }
          setShowRiderAccess(false);
          setRiderPin('');
          onBecomeRider();
        } catch (error) {
          setRiderPinError(`No se pudo comprobar el acceso: ${error.message || 'error inesperado'}`);
        } finally {
          setIsCheckingRiderPin(false);
        }
      };

      const handleProfilePhoto = async (event) => {
        const file = event.target.files?.[0];
        event.target.value = '';
        if (!file) return;

        if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
          setPhotoError('Elige una imagen JPG, PNG o WebP.');
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          setPhotoError('La imagen debe pesar menos de 10 MB.');
          return;
        }

        const imageUrl = URL.createObjectURL(file);
        try {
          const image = new Image();
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () => reject(new Error('No se pudo leer la imagen seleccionada.'));
            image.src = imageUrl;
          });

          const scale = Math.min(1, 512 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('No se pudo preparar la imagen para guardarla.');
          context.drawImage(image, 0, 0, canvas.width, canvas.height);

          const photo = canvas.toDataURL('image/jpeg', 0.78);
          if (photo.length > 450_000) {
            throw new Error('La imagen sigue siendo demasiado pesada. Prueba con otra foto.');
          }
          updateProfile('photo', photo);
          setPhotoError('');
        } catch (error) {
          setPhotoError(error.message || 'No se pudo guardar la imagen.');
        } finally {
          URL.revokeObjectURL(imageUrl);
        }
      };

      useEffect(() => {
        if (showRiderAccess) riderPinInputRef.current?.focus();
      }, [showRiderAccess]);

      useEffect(() => {
        if (!showThemePicker) return;
        const closeOnEscape = (event) => {
          if (event.key === 'Escape') setShowThemePicker(false);
        };
        window.addEventListener('keydown', closeOnEscape);
        return () => window.removeEventListener('keydown', closeOnEscape);
      }, [showThemePicker]);

      useEffect(() => {
        if (!showComplaintsBook) return;
        const closeOnEscape = (event) => {
          if (event.key === 'Escape' && !isSubmittingComplaint) setShowComplaintsBook(false);
        };
        window.addEventListener('keydown', closeOnEscape);
        return () => window.removeEventListener('keydown', closeOnEscape);
      }, [showComplaintsBook, isSubmittingComplaint]);

      useEffect(() => {
        if (!showRiderAccess) return;
        const closeOnEscape = (event) => {
          if (event.key === 'Escape') closeRiderAccess();
        };
        window.addEventListener('keydown', closeOnEscape);
        return () => window.removeEventListener('keydown', closeOnEscape);
      }, [showRiderAccess]);

      const affiliateProfile = () => {
        setProfile((current) => ({ ...current, affiliated: true }));
        setShowQuestionnaire(false);
        setShowThankYou(true);
        setTimeout(() => setShowThankYou(false), 3500);
      };

      return (
        <div className="space-y-4 pt-2">
          <div className="flex justify-between items-center">
            <div className="flex items-center space-x-2">
              <div className="relative h-10 w-10 shrink-0">
                <img
                  src="/al-toque-pe-emblema.png"
                  alt="Emblema circular de Al Toque Pe"
                  loading="eager"
                  decoding="sync"
                  onError={(event) => {
                    event.currentTarget.hidden = true;
                    event.currentTarget.nextElementSibling.style.display = 'grid';
                  }}
                  className="h-10 w-10 rounded-full border border-[#c5a45c] bg-cream object-cover"
                />
                <span aria-hidden="true" style={{ display: 'none' }} className="h-10 w-10 place-items-center rounded-full border border-[#c5a45c] bg-cream font-title text-[10px] font-bold text-brand">AT</span>
              </div>
              <div className="flex h-10 min-w-0 items-center">
                <img
                  src="/al-toque-pe-logo.png"
                  alt="Al Toque Pe"
                  loading="eager"
                  decoding="sync"
                  onError={(event) => {
                    event.currentTarget.hidden = true;
                    event.currentTarget.nextElementSibling.style.display = 'block';
                  }}
                  className="h-10 w-auto max-w-[150px] object-contain"
                />
                <span style={{ display: 'none' }} className="font-title text-sm font-bold text-dark">al toque</span>
              </div>
            </div>
            <button onClick={() => onNavigate('home')} aria-label="Cerrar perfil" className="w-8 h-8 bg-cream rounded-full flex items-center justify-center text-dark hover:opacity-80">
              <i data-lucide="x" className="w-4 h-4"></i>
            </button>
          </div>

          <div className="flex items-center justify-between rounded-3xl bg-gradient-to-r from-[#a90000] to-[#741522] p-4 text-white shadow-md shadow-[#741522]/15">

              >
                <div className="mb-4 flex items-start justify-between gap-3">
                  <div>

                  <p><strong>Razón social:</strong> Al toque pe · <strong>RUC:</strong> 20054389212</p>
                  <p><strong>Domicilio:</strong> Av. Armendáriz 497, Miraflores 15074</p>
                  <p><strong>Correo:</strong> <a className="text-[#a90000] underline" href="mailto:usertokep@gmail.com">usertokep@gmail.com</a></p>
                </div>

                {complaintReceipt ? (
                  <div className="rounded-2xl border border-green-200 bg-green-50 p-5 text-center" role="status">
                    <span className="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-green-100 text-green-700">
                      <i data-lucide="check" className="h-6 w-6"></i>
                    </span>
                    <h3 className="mt-3 font-title text-lg font-bold text-green-900">Solicitud registrada</h3>
                    <p className="mt-1 text-xs text-green-800">Guarda este código como constancia de tu presentación:</p>
                    <p className="mt-2 break-all rounded-lg bg-white px-3 py-2 font-mono text-sm font-bold text-green-900">{complaintReceipt.id}</p>
                    <p className="mt-2 text-[10px] text-green-800">
                      {new Intl.DateTimeFormat('es-PE', { dateStyle: 'long', timeStyle: 'short' }).format(new Date(complaintReceipt.submittedAt))}
                    </p>
                    <button type="button" onClick={() => setShowComplaintsBook(false)} className="mt-4 w-full rounded-xl bg-[#a90000] py-3 text-xs font-bold text-white">Cerrar</button>
                  </div>
                ) : (
                  <form onSubmit={submitComplaint} className="space-y-3">
                    <div>
                      <label htmlFor="complaint-kind" className="mb-1 block text-[10px] font-bold text-gray-600">Tipo de solicitud</label>
                      <select id="complaint-kind" required value={complaintForm.kind} onChange={(event) => setComplaintForm((current) => ({ ...current, kind: event.target.value }))} className="w-full rounded-xl border border-gray-200 bg-white px-3 py-2.5 text-xs">
                        <option value="reclamo">Reclamo: disconformidad con un producto o servicio</option>
                        <option value="queja">Queja: disconformidad con la atención recibida</option>
                      </select>
                    </div>
                    <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                      <div>
                        <label htmlFor="complaint-name" className="mb-1 block text-[10px] font-bold text-gray-600">Nombres y apellidos</label>
                        <input id="complaint-name" required maxLength={120} autoComplete="name" value={complaintForm.consumerName} onChange={(event) => setComplaintForm((current) => ({ ...current, consumerName: event.target.value }))} className="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                      </div>
                      <div>
                        <label htmlFor="complaint-document" className="mb-1 block text-[10px] font-bold text-gray-600">Documento</label>
                        <div className="flex gap-2">
                          <select aria-label="Tipo de documento" value={complaintForm.documentType} onChange={(event) => setComplaintForm((current) => ({ ...current, documentType: event.target.value, documentNumber: '' }))} className="w-20 rounded-xl border border-gray-200 bg-white px-2 py-2.5 text-xs">
                            <option value="DNI">DNI</option>
                            <option value="CE">CE</option>
                          </select>
                          <input id="complaint-document" required inputMode={complaintForm.documentType === 'DNI' ? 'numeric' : 'text'} maxLength={complaintForm.documentType === 'DNI' ? 8 : 12} pattern={complaintForm.documentType === 'DNI' ? '[0-9]{8}' : '[A-Za-z0-9]{6,12}'} value={complaintForm.documentNumber} onChange={(event) => setComplaintForm((current) => ({ ...current, documentNumber: event.target.value.replace(complaintForm.documentType === 'DNI' ? /\D/g : /[^a-z0-9]/gi, '').slice(0, complaintForm.documentType === 'DNI' ? 8 : 12) }))} className="min-w-0 flex-1 rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                        </div>
                      </div>
                    </div>
                    <div>
                      <label htmlFor="complaint-address" className="mb-1 block text-[10px] font-bold text-gray-600">Domicilio</label>
                      <input id="complaint-address" required maxLength={200} autoComplete="street-address" value={complaintForm.address} onChange={(event) => setComplaintForm((current) => ({ ...current, address: event.target.value }))} className="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                    </div>
                    <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                      <div>
                        <label htmlFor="complaint-email" className="mb-1 block text-[10px] font-bold text-gray-600">Correo electrónico</label>
                        <input id="complaint-email" type="email" required maxLength={254} autoComplete="email" value={complaintForm.email} onChange={(event) => setComplaintForm((current) => ({ ...current, email: event.target.value }))} className="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                      </div>
                      <div>
                        <label htmlFor="complaint-phone" className="mb-1 block text-[10px] font-bold text-gray-600">Teléfono</label>
                        <input id="complaint-phone" type="tel" required maxLength={24} autoComplete="tel" value={complaintForm.phone} onChange={(event) => setComplaintForm((current) => ({ ...current, phone: event.target.value }))} className="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                      </div>
                    </div>
                    <div className="grid grid-cols-1 gap-3 sm:grid-cols-[1fr_150px]">
                      <div>
                        <label htmlFor="complaint-product" className="mb-1 block text-[10px] font-bold text-gray-600">Producto o servicio</label>
                        <input id="complaint-product" required maxLength={160} value={complaintForm.product} onChange={(event) => setComplaintForm((current) => ({ ...current, product: event.target.value }))} className="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                      </div>
                      <div>
                        <label htmlFor="complaint-amount" className="mb-1 block text-[10px] font-bold text-gray-600">Monto (S/, opcional)</label>
                        <input id="complaint-amount" type="number" min="0" max="1000000" step="0.01" value={complaintForm.amount} onChange={(event) => setComplaintForm((current) => ({ ...current, amount: event.target.value }))} className="w-full rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                      </div>
                    </div>
                    <div>
                      <label htmlFor="complaint-description" className="mb-1 block text-[10px] font-bold text-gray-600">Cuéntanos qué ocurrió</label>
                      <textarea id="complaint-description" required minLength={20} maxLength={2000} rows={4} value={complaintForm.description} onChange={(event) => setComplaintForm((current) => ({ ...current, description: event.target.value }))} className="w-full resize-y rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                    </div>
                    <div>
                      <label htmlFor="complaint-request" className="mb-1 block text-[10px] font-bold text-gray-600">¿Qué solución solicitas?</label>
                      <textarea id="complaint-request" required minLength={5} maxLength={1000} rows={3} value={complaintForm.request} onChange={(event) => setComplaintForm((current) => ({ ...current, request: event.target.value }))} className="w-full resize-y rounded-xl border border-gray-200 px-3 py-2.5 text-xs" />
                    </div>
                    <label className="flex items-start gap-2 rounded-xl bg-[#fff6e8] p-3 text-[10px] leading-relaxed text-gray-600">
                      <input type="checkbox" required checked={complaintForm.privacyConsent} onChange={(event) => setComplaintForm((current) => ({ ...current, privacyConsent: event.target.checked }))} className="mt-0.5 accent-[#a90000]" />
                      <span>Autorizo el uso de los datos personales proporcionados únicamente para registrar, gestionar y responder este reclamo o queja. Evita incluir datos de tarjetas o contraseñas.</span>
                    </label>
                    {complaintError && <p className="rounded-xl bg-red-50 px-3 py-2 text-[10px] text-red-700" role="alert">{complaintError}</p>}
                    <button type="submit" disabled={isSubmittingComplaint} className="w-full rounded-xl bg-[#a90000] py-3 text-xs font-bold text-white disabled:opacity-60">
                      {isSubmittingComplaint ? 'Enviando solicitud…' : 'Enviar al Libro de Reclamaciones'}
                    </button>
                  </form>
                )}
              </section>
            </div>
          )}

          {showThemePicker && (
            <div
              className="fixed inset-0 z-[70] flex items-center justify-center bg-black/55 p-4"
              onClick={() => setShowThemePicker(false)}
            >
              <section
                className="brand-theme-dialog w-full max-w-[380px] overflow-y-auto rounded-3xl bg-white p-4 shadow-2xl"
                role="dialog"
                aria-modal="true"
                aria-labelledby="splash-theme-title"
                onClick={(event) => event.stopPropagation()}
              >
                <div className="mb-3 flex items-start justify-between gap-3">
                  <div>
                    <h3 id="splash-theme-title" className="font-title text-lg font-bold">Elige tu tema de inicio</h3>
                    <p className="mt-1 text-[10px] text-gray-500">Mira una vista previa y selecciona el estilo que prefieras. Se aplicará al próximo inicio.</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowThemePicker(false)}
                    aria-label="Cerrar temas de inicio"
                    className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-gray-100 text-lg text-gray-600"
                  >
                    ×
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  {SPLASH_THEME_OPTIONS.map((option) => {
                    const selected = (profile.splashPreference || 'brand') === option.id;
                    return (
                      <button
                        key={option.id}
                        type="button"
                        onClick={() => updateProfile('splashPreference', option.id)}
                        aria-pressed={selected}
                        aria-label={`${option.label}: ${option.description}`}
                        className={`rounded-2xl border p-2 text-left transition ${selected ? 'border-[#a90000] bg-red-50 ring-1 ring-[#a90000]' : 'border-gray-200 bg-white hover:border-gray-300'}`}
                      >
                        {option.id === 'random' ? (
                          <div className="brand-preview-strip">
                            {SPLASH_THEME_VARIANTS.map((theme) => <SplashPreview key={theme} theme={theme} />)}
                          </div>
                        ) : (
                          <SplashPreview theme={option.id} />
                        )}
                        <span className="mt-2 flex items-center justify-between gap-1">
                          <span className="text-[11px] font-bold leading-tight">{option.label}</span>
                          {selected && <span className="text-xs font-bold text-[#a90000]" aria-hidden="true">✓</span>}
                        </span>
                        <span className="mt-1 block text-[9px] leading-snug text-gray-500">{option.description}</span>
                      </button>
                    );
                  })}
                </div>
                <button
                  type="button"
                  onClick={() => setShowThemePicker(false)}
                  className="mt-3 w-full rounded-xl bg-[#a90000] py-2.5 text-xs font-bold text-white"
                >
                  Listo
                </button>
              </section>
            </div>
          )}

          {showHelp && (
            <div className="fixed inset-0 z-50 bg-black/40 flex items-end justify-center" role="dialog" aria-modal="true" aria-label="Ayuda y soporte">
              <div className="w-full max-w-[390px] bg-white rounded-t-3xl p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-title font-bold text-lg">Ayuda y soporte</h3>
                  <button type="button" onClick={() => setShowHelp(false)} aria-label="Cerrar ayuda" className="w-8 h-8 rounded-full bg-cream flex items-center justify-center">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>
                <p className="text-xs text-gray-500">Estamos para ayudarte con tus pedidos, pagos y afiliación.</p>
                <a href="tel:967059396" className="flex items-center gap-3 rounded-2xl bg-cream/60 p-3 text-xs font-bold text-dark">
                  <i data-lucide="phone" className="w-4 h-4 text-brand"></i>
                  967 059 396
                </a>
                <a href="mailto:altoquepe@upch.com" className="flex items-center gap-3 rounded-2xl bg-cream/60 p-3 text-xs font-bold text-dark">
                  <i data-lucide="mail" className="w-4 h-4 text-brand"></i>
                  altoquepe@upch.com
                </a>
                <a
                  href="https://wa.me/51967059396?text=Hola%2C%20necesito%20ayuda%20con%20Al%20Toque."
                  target="_blank"
                  rel="noopener noreferrer"
                  className="help-whatsapp-button flex w-full items-center justify-center gap-2 rounded-2xl p-3 text-sm font-bold text-white transition"
                  aria-label="Enviar mensaje por WhatsApp al 967 059 396"
                >
                  <svg viewBox="0 0 32 32" className="h-5 w-5" fill="currentColor" aria-hidden="true">
                    <path d="M16.04 3C8.86 3 3.02 8.82 3.02 15.98c0 2.28.6 4.5 1.74 6.46L3 29l6.75-1.74a13.1 13.1 0 0 0 6.28 1.6h.01c7.17 0 13.01-5.82 13.01-12.98A12.9 12.9 0 0 0 25.22 6.7 12.94 12.94 0 0 0 16.04 3Zm0 23.66h-.01a10.9 10.9 0 0 1-5.56-1.52l-.4-.24-4.01 1.03 1.07-3.89-.26-.4a10.78 10.78 0 0 1-1.66-5.66c0-5.97 4.87-10.83 10.84-10.83 2.9 0 5.62 1.13 7.67 3.18a10.75 10.75 0 0 1 3.17 7.66c0 5.97-4.87 10.83-10.85 10.83Zm5.95-8.11c-.33-.16-1.94-.96-2.24-1.07-.3-.11-.52-.16-.74.16-.22.33-.85 1.07-1.04 1.29-.19.22-.39.25-.72.08-.33-.16-1.39-.51-2.65-1.63-.98-.87-1.64-1.95-1.83-2.28-.19-.33-.02-.5.14-.66.15-.15.33-.39.5-.58.17-.19.22-.33.33-.55.11-.22.06-.41-.03-.58-.08-.16-.74-1.78-1.01-2.44-.27-.64-.54-.55-.74-.56h-.63c-.22 0-.58.08-.88.41-.3.33-1.15 1.12-1.15 2.73s1.18 3.17 1.35 3.39c.16.22 2.32 3.54 5.62 4.96.79.34 1.4.54 1.88.69.79.25 1.51.21 2.08.13.63-.09 1.94-.79 2.21-1.56.28-.77.28-1.42.2-1.56-.08-.14-.3-.22-.63-.39Z" />
                  </svg>
                  Enviar mensaje por WhatsApp
                </a>
                <button
                  type="button"
                  onClick={() => {
                    setShowHelp(false);
                    onRestoreClassicHome();
                  }}
                  className="mx-auto block rounded-full px-3 py-1 text-[9px] text-gray-500 transition hover:text-gray-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#a90000]"
                  aria-label="Volver al inicio clásico de Al Toque"
                >
                  ¿Recuerdas el inicio de antes?
                </button>
              </div>
            </div>
          )}

          <div className="text-center pt-4">
            <p className="text-[11px] text-gray-500 font-medium">Al Toque PE · Comida que sigue tu ritmo</p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <>
        <div
          aria-hidden="true"
          style={{
            position: 'fixed',
            left: '-10000px',
            top: 0,
            width: '390px',
            height: '300px',
            opacity: 0,
            pointerEvents: 'none'
          }}
        >
          <LiveRouteMapErrorBoundary className="delivery-map" label="Precarga del mapa de entregas">
            <LiveRouteMap location={null} className="delivery-map" label="Precarga del mapa de entregas" />
          </LiveRouteMapErrorBoundary>
        </div>
        <App />
      </>
    );
  </script>
</body>
</html>
