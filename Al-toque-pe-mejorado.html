                <span className="mt-1 block text-[9px] leading-relaxed text-white/80">Canjea pedidos del menú y suma el doble.</span>
              </span>
              <span className="text-lg font-bold text-[#f5d36e]" aria-hidden="true">›</span>
            </button>

            <div className="flex items-center gap-2 rounded-2xl bg-[#f6b935] px-3 py-2.5 text-[#4b1420]">
              <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#7d1025] text-base text-[#fff4d2]" aria-hidden="true">♟</span>
              <p className="text-[10px] leading-relaxed"><strong className="block text-xs">Canjea tus Gorritos</strong>Por productos del menú dentro de la app.</p>
            </div>
          </section>

          {showWelcome && !profile.affiliated && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center bg-[#211716]/60 p-3 backdrop-blur-[3px]" onMouseDown={(event) => { if (event.target === event.currentTarget) setShowWelcome(false); }}>
              <section className="gorritos-welcome-modal relative w-full max-w-[370px] overflow-hidden rounded-[28px] border border-[#f5d36e]/60 bg-[#fffaf1] shadow-[0_24px_70px_rgba(33,23,22,0.35)]" role="dialog" aria-modal="true" aria-labelledby="gorritos-welcome-title">
                <div className="gorritos-scene relative px-5 pb-5 pt-5 text-[#fffaf1]">
                  <button type="button" onClick={() => setShowWelcome(false)} className="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-full bg-black/20 text-lg text-white transition hover:bg-black/35" aria-label="Cerrar invitación">×</button>
                  <div className="flex items-center gap-3 pr-8">
                    <AlToqueCoinMark sizeClass="h-14 w-14 shrink-0" />
                    <div>
                      <p className="text-[9px] font-bold uppercase tracking-[0.18em] text-[#f5d36e]">Al Toque Pe · UPCH</p>
                      <h2 id="gorritos-welcome-title" className="mt-1 font-title text-xl font-extrabold leading-tight">¡Únete a Gorritos!</h2>
                      <p className="mt-1 text-[10px] text-white/80">Tu tarjeta de recompensas del campus</p>
                    </div>
                  </div>
                  <div className="mt-4 flex items-center gap-3 rounded-2xl border border-white/15 bg-black/10 p-3">
                    <span className="flex h-9 w-9 shrink-0 items-center justify-center">
                      <AlToqueCoinMark sizeClass="h-8 w-8" />
                    </span>
                    <p className="text-[10px] leading-relaxed"><strong className="block text-xs">Un Gorrito de bienvenida</strong>Empieza a sumar desde tu primera compra participante.</p>
                    <img src="/gorritos-welcome-hat.png" alt="" className="gorritos-sticker-float h-14 w-14 shrink-0 object-cover object-center" />
                  </div>
                </div>
                <div className="space-y-2.5 px-5 py-4">
                  <p className="flex items-center gap-2 text-[10px] font-semibold text-[#211716]"><span className="flex h-5 w-5 items-center justify-center rounded-full bg-[#7d1025] text-white">✓</span> Suma Gorritos con compras participantes</p>
                  <p className="flex items-center gap-2 text-[10px] font-semibold text-[#211716]"><span className="flex h-5 w-5 items-center justify-center rounded-full bg-[#7d1025] text-white">✓</span> Lleva tu tarjeta digital siempre contigo</p>
                  <p className="flex items-center gap-2 text-[10px] font-semibold text-[#211716]"><span className="flex h-5 w-5 items-center justify-center rounded-full bg-[#7d1025] text-white">✓</span> Desbloquea beneficios al llegar a VIP</p>
                  <p className="rounded-xl bg-[#f5e8c9] px-3 py-2 text-[9px] leading-relaxed text-[#594432]"><strong>🎉 Regalo de bienvenida:</strong> +1 Gorrito al unirte.</p>
                  <button type="button" onClick={joinGorritos} className="w-full rounded-full bg-gradient-to-r from-[#a90000] to-[#7d1025] px-4 py-3 text-xs font-extrabold text-[#fffaf1] shadow-[0_6px_16px_rgba(125,16,37,0.25)] transition hover:-translate-y-0.5 hover:shadow-lg">
                    Unirme y sumar mi Gorrito
                  </button>
                  <button type="button" onClick={() => setShowWelcome(false)} className="w-full py-1 text-[10px] font-semibold text-[#7a6258] transition hover:text-[#a90000]">Ahora no</button>
                </div>
              </section>
            </div>
          )}

          {selectedTier && (
            <div
              className="fixed inset-0 z-[80] flex items-center justify-center bg-[#211716]/65 p-4 backdrop-blur-sm"
              onMouseDown={(event) => { if (event.target === event.currentTarget) setSelectedTier(null); }}
            >
              <section
                className="gorritos-welcome-modal relative max-h-[min(82vh,620px)] w-full max-w-[360px] overflow-y-auto rounded-[28px] border border-[#f5d36e]/60 bg-[#fffaf1] shadow-[0_24px_70px_rgba(33,23,22,0.4)]"
                role="dialog"
                aria-modal="true"
                aria-labelledby="gorritos-tier-dialog-title"
              >
                <div className={`gorritos-scene relative overflow-hidden px-5 pb-5 pt-5 text-[#fffaf1] ${selectedTier === 'vip' ? 'bg-[#651326]' : ''}`}>
                  <div className="pointer-events-none absolute inset-0" aria-hidden="true">
                    {tierStickers.map((sticker, index) => (
                      <img
                        key={sticker}
                        src={`./${getStickerAssetName(sticker)}`}
                        alt=""
                        className="gorritos-tier-sticker absolute object-contain drop-shadow-lg"
                        style={{
                          width: '54px',
                          height: '54px',
                          top: '30%',
                          right: '5%',
                          animationDelay: `${index * -0.7}s`
                        }}
                      />
                    ))}
                  </div>
                  <button
                    type="button"
                    onClick={() => setSelectedTier(null)}
                    className="absolute right-3 top-3 z-10 flex h-8 w-8 items-center justify-center rounded-full bg-black/20 text-lg text-white transition hover:bg-black/35"
                    aria-label="Cerrar información de beneficios"
                  >×</button>
                  <div className="relative z-[1] flex items-center gap-3 pr-20">
                    <AlToqueCoinMark sizeClass="h-14 w-14 shrink-0" />
                    <div className="min-w-0">
                      <p className="text-[9px] font-bold uppercase tracking-[0.18em] text-[#f5d36e]">Membresía Al Toque Pe</p>
                      <h2 id="gorritos-tier-dialog-title" className="mt-1 font-title text-xl font-extrabold leading-tight">{tiers[selectedTier].name}</h2>
                      <span className="mt-1 inline-flex rounded-full bg-[#f5d36e] px-2.5 py-1 text-[9px] font-extrabold text-[#4b1420]">{selectedTier === 'vip' && isGorritosVip ? 'Desbloqueado' : tiers[selectedTier].badge}</span>
                    </div>
                  </div>
                  <div className="relative z-[1] mt-4 rounded-2xl border border-white/15 bg-black/10 p-3 pr-16">
                    <p className="text-sm font-extrabold text-[#f5d36e]">{tiers[selectedTier].reward}</p>
                    <p className="text-[10px] text-white/85">{tiers[selectedTier].description}</p>
                  </div>
                </div>
                <div className="space-y-3 px-5 py-4">
                  <h3 className="font-title text-sm font-extrabold text-[#211716]">Tus beneficios</h3>
                  <ul className="space-y-2.5">
                    {tiers[selectedTier].benefits.map((benefit) => (
                      <li key={benefit} className="flex items-start gap-2 text-[10px] leading-relaxed text-[#211716]">
                        <span className="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-[#e9f3e8] font-bold text-[#22764a]" aria-hidden="true">✓</span>
                        <span>{benefit}</span>
                      </li>
                    ))}
                  </ul>
                  {selectedTier === 'vip' && (
                    <p className="rounded-xl bg-[#f5e8c9] px-3 py-2 text-[9px] leading-relaxed text-[#594432]">
                      {isGorritosVip
                        ? <><strong>¡Ya eres VIP Gorritos!</strong> Recibes el doble de Gorritos por cada compra participante.</>
                        : <><strong>¿Cómo desbloquearlo?</strong> Alcanza 20 Gorritos o completa 20 compras participantes para obtener el nivel VIP.</>}
                    </p>
                  )}
                  <button
                    type="button"
                    onClick={() => {
                      setSelectedTier(null);
                      if (!profile.affiliated) setShowWelcome(true);
                    }}
                    className="w-full rounded-full bg-gradient-to-r from-[#a90000] to-[#7d1025] px-4 py-3 text-xs font-extrabold text-[#fffaf1] shadow-[0_6px_16px_rgba(125,16,37,0.25)] transition hover:-translate-y-0.5 hover:shadow-lg"
                  >
                    {profile.affiliated ? '¡Seguir sumando!' : 'Unirme a Gorritos'}
                  </button>
                  <button
                    type="button"
                    onClick={() => setSelectedTier(null)}
                    className="w-full py-1 text-[10px] font-semibold text-[#7a6258] transition hover:text-[#a90000]"
                  >Volver a Gorritos</button>
                </div>
              </section>
            </div>
          )}
        </section>
      );
    }

    const CUSTOMER_PROFILE_ID_KEY = 'altoque_customer_profile_id';
    const CUSTOMER_PROFILE_ID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

    function generateCustomerProfileId() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (character) => {
        const random = Math.floor(Math.random() * 16);
        return (character === 'x' ? random : (random & 0x3) | 0x8).toString(16);
      });
    }

    function getCustomerProfileId() {
      let profileId = localStorage.getItem(CUSTOMER_PROFILE_ID_KEY) || '';
      if (!CUSTOMER_PROFILE_ID_PATTERN.test(profileId)) {
        profileId = generateCustomerProfileId();
        localStorage.setItem(CUSTOMER_PROFILE_ID_KEY, profileId);
      }
      return profileId;
    }

    function getCustomerStorageKey(key, profileId = getCustomerProfileId()) {
      if (!CUSTOMER_PROFILE_ID_PATTERN.test(profileId)) {
        throw new Error('El identificador del perfil de cliente no es válido.');
      }
      const scopedKey = `${key}_${profileId}`;
      if (localStorage.getItem(scopedKey) === null) {
        const savedValue = localStorage.getItem(key);
        if (savedValue !== null) {
          localStorage.setItem(scopedKey, savedValue);
          localStorage.removeItem(key);
        }
      }
      return scopedKey;
    }

    function App() {
      const [showSplash, setShowSplash] = useState(true);
      const [customerProfileId] = useState(getCustomerProfileId);
      const [activeTab, setActiveTab] = useState(() => localStorage.getItem(getCustomerStorageKey('altoque_current_order', customerProfileId)) ? 'cart' : 'home');
      const [appMode, setAppMode] = useState(() => {
        try {
          const savedRiderState = JSON.parse(localStorage.getItem('altoque_rider_demo') || 'null');
          return savedRiderState?.schemaVersion === 2
            && savedRiderState.activeOrder?.isLive === true
            && typeof savedRiderState.activeOrder.id === 'string'
            ? 'rider'
            : 'student';
        } catch (error) {
          console.error('No se pudo recuperar el estado del repartidor:', error);
          return 'student';
        }
      });
      const [isOctoberPromoDay, setIsOctoberPromoDay] = useState(() => isOctoberPromotionDay());
      const [isOctoberPromoOpen, setIsOctoberPromoOpen] = useState(false);
      const [homeMood, setHomeMood] = useState('steady');
      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem(getCustomerStorageKey('altoque_cart', customerProfileId));
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });
      const [orderHistory, setOrderHistory] = useState(() => {
        try {
          const saved = localStorage.getItem(getCustomerStorageKey('altoque_order_history', customerProfileId));
          const parsed = saved ? JSON.parse(saved) : [];
          if (!Array.isArray(parsed) || parsed.some((order) => (
            !order || typeof order.id !== 'string' || !Number.isFinite(order.createdAt)
            || !Number.isFinite(order.total) || order.total < 0
            || !Array.isArray(order.items)
            || order.items.some((item) => (
              !item || typeof item.name !== 'string'
              || !Number.isInteger(item.quantity) || item.quantity < 1
              || !Number.isFinite(item.price) || item.price < 0
              || (item.description !== undefined && typeof item.description !== 'string')
            ))
          ))) {
            throw new Error('El formato guardado de Mis pedidos no es válido.');
          }
          return parsed;
        } catch (error) {
          console.error('No se pudo leer el historial de pedidos guardado:', error);
          return [];
        }
      });
      const [orderHistoryStorageError, setOrderHistoryStorageError] = useState('');
      const [customizingDish, setCustomizingDish] = useState(null);
      const [pickupPoint, setPickupPoint] = useState('En la puerta principal');
      const [notifications, setNotifications] = useState(true);
      const [toast, setToast] = useState(null);
      const [orderConfirmed, setOrderConfirmed] = useState(() => Boolean(localStorage.getItem(getCustomerStorageKey('altoque_current_order', customerProfileId))));
      const [liveOrderId, setLiveOrderId] = useState(() => localStorage.getItem(getCustomerStorageKey('altoque_current_order', customerProfileId)) || '');
      const [isMusicPlayerOpen, setIsMusicPlayerOpen] = useState(false);
      const [isPlayerVisible, setIsPlayerVisible] = useState(true);
      const [isPlayerHiddenOnScroll, setIsPlayerHiddenOnScroll] = useState(false);
      const contentRef = useRef(null);
      const lastContentScrollTopRef = useRef(0);
      const octoberPromoDismissedRef = useRef(false);
      const [profile, setProfile] = useState(() => {
        try {
          const savedProfile = JSON.parse(localStorage.getItem(getCustomerStorageKey('altoque_profile', customerProfileId)));
          if (savedProfile && typeof savedProfile === 'object' && !Array.isArray(savedProfile)) {
            const hasExplicitSalesConsent = Number.isFinite(savedProfile.salesUpdatesConsentAt);
            return {
              ...savedProfile,
              salesUpdates: savedProfile.salesUpdates === true && hasExplicitSalesConsent,
              salesUpdatesConsentAt: hasExplicitSalesConsent ? savedProfile.salesUpdatesConsentAt : null,
              gorritosVip: savedProfile.gorritosVip === true
                || (Number.isInteger(savedProfile.gorritos) && savedProfile.gorritos >= 20)
                || (Number.isInteger(savedProfile.gorritosPurchaseCount) && savedProfile.gorritosPurchaseCount >= 20),
              useOrderHistoryForRecommendations: true
            };
          }
          return {
            fullName: '',
            career: '',
            nickname: '',
            email: '',
            salesUpdates: false,
            salesUpdatesConsentAt: null,
            privacyAccepted: false,
            useOrderHistoryForRecommendations: true
          };
        } catch {
          return { fullName: '', career: '', nickname: '', email: '', salesUpdates: false, salesUpdatesConsentAt: null, privacyAccepted: false, useOrderHistoryForRecommendations: true };
        }
      });
      const [splashTheme, setSplashTheme] = useState(() => getStartupSplashTheme(profile.splashPreference || 'brand'));

      useEffect(() => {
        if (!showSplash) return undefined;
        const timer = setTimeout(() => setShowSplash(false), 3000);
        return () => clearTimeout(timer);
      }, [showSplash]);

      useEffect(() => {
        const timer = setInterval(() => {
          setIsOctoberPromoDay(isOctoberPromotionDay());
        }, 60000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (
          !showSplash
          && appMode === 'student'
          && activeTab === 'home'
          && isOctoberPromoDay
          && !octoberPromoDismissedRef.current
        ) {
          setIsOctoberPromoOpen(true);
        } else if (!isOctoberPromoDay) {
          setIsOctoberPromoOpen(false);
          octoberPromoDismissedRef.current = false;
        }
      }, [showSplash, appMode, activeTab, isOctoberPromoDay]);

      useEffect(() => {
        localStorage.setItem(getCustomerStorageKey('altoque_cart', customerProfileId), JSON.stringify(cart));
      }, [cart, customerProfileId]);

      useEffect(() => {
        try {
          localStorage.setItem(getCustomerStorageKey('altoque_order_history', customerProfileId), JSON.stringify(orderHistory));
          setOrderHistoryStorageError('');
        } catch (error) {
          console.error('No se pudo guardar el historial de pedidos:', error);
          setOrderHistoryStorageError('No se pudo guardar el historial en este dispositivo. Libera espacio del navegador e inténtalo de nuevo.');
        }
      }, [customerProfileId, orderHistory]);

      useEffect(() => {
        localStorage.setItem(getCustomerStorageKey('altoque_profile', customerProfileId), JSON.stringify(profile));
      }, [customerProfileId, profile]);

      useEffect(() => {
        const storageKey = getCustomerStorageKey('altoque_current_order', customerProfileId);
        if (liveOrderId) localStorage.setItem(storageKey, liveOrderId);
        else localStorage.removeItem(storageKey);
      }, [customerProfileId, liveOrderId]);

      useEffect(() => {
        const content = contentRef.current;
        if (!content) return;
 
        const handleContentScroll = () => {
          const currentScrollTop = content.scrollTop;
          const previousScrollTop = lastContentScrollTopRef.current;
          const scrollingDown = currentScrollTop > previousScrollTop + 2;

          if (scrollingDown) {
            setIsPlayerVisible(false);
            setIsPlayerHiddenOnScroll(true);
          }

          lastContentScrollTopRef.current = currentScrollTop;
        };

        content.addEventListener('scroll', handleContentScroll, { passive: true });
        return () => {
          content.removeEventListener('scroll', handleContentScroll);
        };
      }, [showSplash]);

      useEffect(() => {
        if (contentRef.current) {
          contentRef.current.scrollTop = 0;
        }
        lastContentScrollTopRef.current = 0;
        setIsPlayerVisible(true);
        setIsPlayerHiddenOnScroll(false);
      }, [activeTab]);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      const addToCart = (item, removedComponents = []) => {
        if (cart.some((cartItem) => cartItem.gorritosRedemption)) {
          showToast('Finaliza o elimina el canje antes de agregar otros productos.');
          return;
        }
        if (cart.some((cartItem) => cartItem.isBembosDemo)) {
          showToast('Vacía el pedido simulado de Bembos antes de añadir productos Al Toque.');
          return;
        }
        const priceDeduction = removedComponents.length * 1.0;
        const finalPrice = Math.max(0, item.price - priceDeduction);

        setCart((prev) => [
          ...prev,
          {
            cartId: Date.now().toString(),
            id: item.id,
            name: item.name,
            price: finalPrice,
            image: item.image,
            description: item.description,
            brand: item.brand,
            removedComponents,
            quantity: 1
          }
        ]);

        showToast(`¡${item.name} agregado al pedido!`);
      };

      const addGorritosRedemptionToCart = (item, gorritosCost) => {
        if (!profile.affiliated) {
          showToast('Afíliate a Gorritos antes de canjear un pedido.');
          return;
        }
        if (cart.length > 0) {
          showToast('Finaliza o vacía tu pedido actual antes de canjear con Gorritos.');
          return;
        }
        if (GORRITOS_REDEMPTION_COSTS[item.id] !== gorritosCost) {
          showToast('No se pudo validar el costo de este canje. Inténtalo de nuevo.');
          return;
        }
        if (!Number.isInteger(gorritosCost) || gorritosCost < 1) {
          showToast('El costo de este canje no es válido.');
          return;
        }
        if ((Number(profile.gorritos) || 0) < gorritosCost) {
          showToast('No tienes suficientes Gorritos para este pedido.');
          return;
        }
        setCart([{
          cartId: `gorritos-${item.id}-${Date.now()}`,
          id: item.id,
          name: item.name,
          price: 0,
          image: item.image,
          description: item.description,
          removedComponents: [],
          quantity: 1,
          gorritosRedemption: true,
          gorritosCost
        }]);
        setActiveTab('cart');
      };

      const addBembosToCart = (promotion) => {
        if (cart.some((item) => !item.isBembosDemo)) {
          showToast('Finaliza o vacía tu pedido de Al Toque antes de iniciar la simulación Bembos.');
          return;
        }
        setCart((previous) => [
          ...previous,
          {
            cartId: `bembos-${promotion.id}-${Date.now()}`,
            id: `bembos-${promotion.id}`,
            name: promotion.name,
            price: promotion.price,
            image: '',
            description: promotion.description,
            removedComponents: [],
            quantity: 1,
            isBembosDemo: true
          }
        ]);
        showToast(`${promotion.name} agregado al pedido simulado.`);
      };

      const removeFromCart = (cartId) => {
        setCart((prev) => prev.filter((item) => item.cartId !== cartId));
      };

      const updateQuantity = (cartId, delta) => {
        setCart((prev) =>
          prev
            .map((item) => {
              if (item.cartId === cartId) {
                const newQty = item.quantity + delta;
                return newQty > 0 ? { ...item, quantity: newQty } : null;
              }
              return item;
            })
            .filter(Boolean)
        );
      };

      const clearCart = () => setCart([]);
      const registerCompletedOrder = (order) => {
        if (!order || typeof order.id !== 'string' || !Number.isFinite(order.createdAt) || !Array.isArray(order.items)) {
          throw new Error('El pedido confirmado no tiene los datos necesarios para guardarlo en Mis pedidos.');
        }
        if (order.isDemo) return;
        const pointsSpent = Number.isInteger(order.gorritosSpent) && order.gorritosSpent > 0
          ? order.gorritosSpent
          : 0;
        const pointsEarned = pointsSpent > 0 || order.paymentMethod === 'gorritos' || !profile.affiliated
          || !order.items.every((item) => GORRITOS_REDEMPTION_COSTS[item.id] > 0)
          ? 0
          : 1;
        const savedOrder = {
          id: order.id,
          createdAt: order.createdAt,
          total: Number.isFinite(order.total) ? order.total : 0,
          ...(pointsSpent > 0 ? { gorritosSpent: pointsSpent } : {}),
          items: order.items.map((item) => ({
            name: item.name,
            quantity: item.quantity,
            price: item.price,
            ...(typeof item.description === 'string' ? { description: item.description } : {})
          }))
        };
        setOrderHistory((previous) => (
          previous.some((entry) => entry.id === savedOrder.id)
            ? previous
            : [savedOrder, ...previous].sort((first, second) => second.createdAt - first.createdAt)
        ));
        if (pointsSpent > 0 || pointsEarned > 0) {
          setProfile((current) => {
            const activity = Array.isArray(current.gorritosActivity) ? current.gorritosActivity : [];
            if (activity.some((movement) => movement.orderId === order.id)) return current;
            const currentPoints = Math.max(0, Number(current.gorritos) || 0);
            const completedPurchases = Math.max(0, Number(current.gorritosPurchaseCount) || 0);
            const alreadyVip = current.gorritosVip === true || currentPoints >= 20 || completedPurchases >= 20;
            const pointsForPurchase = alreadyVip ? 2 : 1;
            const nextBalance = Math.max(0, currentPoints - pointsSpent) + (pointsEarned > 0 ? pointsForPurchase : 0);
            const nextPurchaseCount = completedPurchases + (pointsEarned > 0 ? 1 : 0);
            const movement = pointsSpent > 0
              ? {
                id: `redeem-${order.id}`,
                orderId: order.id,
                label: 'Pedido canjeado',
                detail: order.items.map((item) => item.name).join(', '),
                points: -pointsSpent,
                createdAt: order.createdAt
              }
              : {
                id: `order-${order.id}`,
                orderId: order.id,
                label: 'Compra participante',
                detail: `Pedido ${order.id}`,
                points: pointsForPurchase,
                createdAt: order.createdAt
              };
            return {
              ...current,
              gorritos: nextBalance,
              gorritosPurchaseCount: nextPurchaseCount,
              gorritosVip: alreadyVip || nextBalance >= 20 || nextPurchaseCount >= 20,
              gorritosActivity: [...activity, movement]
            };
          });
        }
      };
      const totalItemsCount = useMemo(() => cart.reduce((acc, curr) => acc + curr.quantity, 0), [cart]);

      if (showSplash) {
        return <SplashScreen theme={splashTheme} />;
      }

      if (appMode === 'rider') {
        return (
          <RiderApp
            onExit={() => {
              setAppMode('student');
              setActiveTab('profile');
            }}
            profile={profile}
          />
        );
      }

      return (
        <div className="flex flex-col h-full bg-white relative font-body text-dark">
          <MusicPlayer
            isOpen={isMusicPlayerOpen}
            isVisible={isPlayerVisible && activeTab === 'home'}
            isOnHome={activeTab === 'home'}
            isHiddenOnScroll={isPlayerHiddenOnScroll}
          />

          <div ref={contentRef} className={`min-h-0 flex-1 no-scrollbar ${activeTab === 'reels' ? 'overflow-hidden p-0' : 'overflow-y-auto px-4 pb-20 pt-2'}`}>
            {activeTab === 'home' && (
              <HomeScreen
                onNavigate={setActiveTab}
                onOpenCustomize={setCustomizingDish}
                mood={homeMood}
                setMood={setHomeMood}
                isMusicPlayerOpen={isMusicPlayerOpen}
                onToggleMusicPlayer={() => {
                  setIsMusicPlayerOpen((isOpen) => !isOpen);
                  setIsPlayerVisible(true);
                  setIsPlayerHiddenOnScroll(false);
                }}
              />
            )}
            {activeTab === 'menu' && (
              <MenuScreen onOpenCustomize={setCustomizingDish} onAddBembos={addBembosToCart} onAddStarbucks={addToCart} isPromoDay={isOctoberPromoDay} />
            )}
            {activeTab === 'ai' && <AIScreen onOpenCustomize={setCustomizingDish} profile={profile} orderHistory={orderHistory} customerProfileId={customerProfileId} />}
            {activeTab === 'affiliation' && <AffiliationScreen profile={profile} setProfile={setProfile} onRedeem={addGorritosRedemptionToCart} />}
            {activeTab === 'reels' && <ReelsScreen onNavigate={setActiveTab} />}
            {activeTab === 'cart' && (
              <CartScreen
                cart={cart}
                updateQuantity={updateQuantity}
                removeFromCart={removeFromCart}
                onNavigate={setActiveTab}
                orderConfirmed={orderConfirmed}
                setOrderConfirmed={setOrderConfirmed}
                liveOrderId={liveOrderId}
                setLiveOrderId={setLiveOrderId}
                clearCart={clearCart}
                pickupPoint={pickupPoint}
                setPickupPoint={setPickupPoint}
                profile={profile}
                setProfile={setProfile}
                customerProfileId={customerProfileId}
                onOrderRegistered={registerCompletedOrder}
              />
            )}
            {activeTab === 'profile' && (
              <ProfileScreen
                onNavigate={setActiveTab}
                notifications={notifications}
                setNotifications={setNotifications}
                profile={profile}
                setProfile={setProfile}
                orderHistory={orderHistory}
                orderHistoryStorageError={orderHistoryStorageError}
                onClearOrderHistory={() => setOrderHistory([])}
                onBecomeRider={() => setAppMode('rider')}
                onRestoreClassicHome={() => {
                  setProfile((current) => ({ ...current, splashPreference: 'classic' }));
                  setSplashTheme('classic');
                  setActiveTab('home');
                  setShowSplash(true);
                }}
              />
            )}
          </div>

          {activeTab === 'home' && isMusicPlayerOpen && isPlayerHiddenOnScroll && (
            <button
              type="button"
              onClick={() => {
                setIsPlayerVisible(true);
                setIsPlayerHiddenOnScroll(false);
                const content = contentRef.current;
                if (!content) return;
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                  content.scrollTop = 0;
                  return;
                }

                const startTop = content.scrollTop;
                const startTime = performance.now();
                const duration = 3000;
                const scrollToTop = (time) => {
                  const progress = Math.min((time - startTime) / duration, 1);
                  const easedProgress = 1 - Math.pow(1 - progress, 3);
                  content.scrollTop = startTop * (1 - easedProgress);
                  if (progress < 1) window.requestAnimationFrame(scrollToTop);
                };
                window.requestAnimationFrame(scrollToTop);
              }}
              aria-label="Volver al reproductor de música"
              title="Volver al reproductor de música"
              className="music-scroll-launcher music-launcher-button flex h-11 w-11 items-center justify-center rounded-2xl transition-transform hover:scale-105 active:scale-95"
            >
              <span className="music-launcher-icon" aria-hidden="true">
                <i data-lucide="music-2" className="music-launcher-note h-5 w-5"></i>
                <span className="music-launcher-star music-launcher-star-one"></span>
                <span className="music-launcher-star music-launcher-star-two"></span>
              </span>
            </button>
          )}

          {toast && (
            <button
              type="button"
              onClick={() => {
                setToast(null);
                setActiveTab('cart');
              }}
              aria-label={`${toast} Ir al pedido`}
              className="absolute top-10 left-1/2 -translate-x-1/2 bg-dark text-white px-4 py-2 rounded-full text-xs font-semibold shadow-lg z-50 animate-bounce cursor-pointer hover:opacity-90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
            >
              {toast}
            </button>
          )}

          {customizingDish && (
            <BottomSheetModal
              dish={customizingDish}
              onClose={() => setCustomizingDish(null)}
              onAdd={(removed) => {
                addToCart(customizingDish, removed);
                setCustomizingDish(null);
              }}
            />
          )}

          {isOctoberPromoOpen && (
            <OctoberPromotionModal
              onClose={() => {
                octoberPromoDismissedRef.current = true;
                setIsOctoberPromoOpen(false);
                setActiveTab('menu');
              }}
              onOpenMenu={() => {
                octoberPromoDismissedRef.current = true;
                setIsOctoberPromoOpen(false);
                setActiveTab('menu');
              }}
            />
          )}

          {activeTab !== 'reels' && <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} badgeCount={totalItemsCount} />}
          {activeTab !== 'reels' && <div className="app-watermark">2026 - Al Toque Pe - Todos los derechos reservados@ - UPCH</div>}
        </div>
      );
    }

    let youtubeIframeApiPromise;

    function loadYouTubeIframeApi() {
      if (window.YT?.Player) return Promise.resolve(window.YT);
      if (youtubeIframeApiPromise) return youtubeIframeApiPromise;

      youtubeIframeApiPromise = new Promise((resolve, reject) => {
        const previousReadyHandler = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => {
          if (typeof previousReadyHandler === 'function') previousReadyHandler();
          resolve(window.YT);
        };

        const script = document.createElement('script');
        script.src = 'https://www.youtube.com/iframe_api';
        script.onerror = () => {
          youtubeIframeApiPromise = null;
          reject(new Error('No se pudo cargar el reproductor oficial de YouTube.'));
        };
        document.head.appendChild(script);
      });

      return youtubeIframeApiPromise;
    }

    const PLAYER_TRACKS = [
      {
        title: 'Jesse & Joy - 2. Ecos de Amor',
        artist: 'DjichoMusic',
        url: 'https://audiomack.com/djicho/song/remix-8'
      },
      {
        title: 'Bby Wow',
        artist: 'Karol G',
        url: 'https://audiomack.com/laurita-36/song/bby-wow'
      },
      {
        title: 'Swim - Chase Atlantic',
        artist: 'Esther',
        url: 'https://audiomack.com/esther-316/song/swim-chase-atlantic-2'
      },
      {
        title: 'SOLTO (FR)-I HUGEL',
        artist: 'Jamaican (Bam Bam)',
        url: 'https://audiomack.com/yuvilev2044/song/jamaican-bam-bam'
      },
      {
        title: 'No me Llores (Remix)',
        artist: 'Duki, Leby',
        url: 'https://audiomack.com/duki-ssj/song/no-me-llores-remix'
      },
      {
        title: 'Dame un beso',
        artist: 'Yuri',
        provider: 'youtube',
        url: 'https://www.youtube.com/watch?v=u_hFhRgRdRQ'
      }
    ];

    function MusicPlayer({ isOpen, isVisible, isOnHome, isHiddenOnScroll }) {
      const [playerSize, setPlayerSize] = useState('large');
      const [currentTrack, setCurrentTrack] = useState(PLAYER_TRACKS[0]);
      const [audioHelp, setAudioHelp] = useState(null);
      const [bluetoothDeviceName, setBluetoothDeviceName] = useState('');
      const [bluetoothStatus, setBluetoothStatus] = useState('');
      const [isBluetoothSearching, setIsBluetoothSearching] = useState(false);
      const [playerError, setPlayerError] = useState('');
      const [volume, setVolume] = useState(0.8);
      const [isMuted, setIsMuted] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const audioRef = useRef(null);
      const isCompact = playerSize === 'compact';
      const isLocalTrack = Boolean(currentTrack.audio);
      const isYouTubeTrack = currentTrack.provider === 'youtube';
      const audioMackUrl = isLocalTrack
        ? ''
        : isYouTubeTrack
          ? currentTrack.url.replace(
            /^https:\/\/www\.youtube\.com\/watch\?v=([^&]+).*$/,
            'https://www.youtube.com/embed/$1'
          )
          : currentTrack.url.replace(
            /^https:\/\/audiomack\.com\/(?!embed\/)/,
            'https://audiomack.com/embed/'
          );
      const playerUrl = audioMackUrl ? new URL(audioMackUrl) : null;
      if (playerUrl) {
        playerUrl.searchParams.set(isYouTubeTrack ? 'playsinline' : 'background', '1');
      }

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = volume;
          audioRef.current.muted = isMuted;
        }
      }, [volume, isMuted, currentTrack]);

      const formatAudioTime = (seconds) => {
        if (!Number.isFinite(seconds)) return '0:00';
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${minutes}:${remainingSeconds}`;
      };
      const waveformHeights = [13, 22, 17, 29, 20, 35, 25, 43, 31, 49, 38, 55, 34, 44, 58, 39, 51, 63, 46, 57, 68, 44, 53, 72, 49, 64, 55, 70, 46, 60, 74, 48, 66, 54, 71, 43, 61, 50, 68, 39, 58, 46, 62, 35, 52, 41, 56, 31, 46, 26, 39, 22];

      const toggleAudioPlayback = async () => {
        if (!audioRef.current) return;
        if (audioRef.current.paused) {
          try {
            await audioRef.current.play();
            setPlayerError('');
          } catch (error) {
            setPlayerError(`No se pudo reproducir la canción: ${error.message || error.name}`);
          }
        } else {
          audioRef.current.pause();
        }
      };

      const findBluetoothDevice = async () => {
        setAudioHelp('bluetooth');
        setBluetoothDeviceName('');
        setBluetoothStatus('');

        if (!window.isSecureContext) {
          setBluetoothStatus('La búsqueda BLE requiere abrir Al Toque desde localhost o una página HTTPS, no desde file://.');
          return;
        }
        if (!navigator.bluetooth?.requestDevice) {
          setBluetoothStatus('Este navegador no admite la búsqueda BLE desde páginas web. Prueba con Chrome o Edge actualizado.');
          return;
        }

        setIsBluetoothSearching(true);
        try {
          const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
          setBluetoothDeviceName(device.name || 'Dispositivo BLE sin nombre');
          setBluetoothStatus('Dispositivo BLE seleccionado. La búsqueda no lo empareja ni cambia la salida de audio; conéctalo y selecciónalo en los ajustes de sonido.');
        } catch (error) {
          if (error.name === 'NotFoundError') {
            setBluetoothStatus('No se seleccionó ningún dispositivo BLE.');
          } else {
            setBluetoothStatus(`No se pudo buscar dispositivos BLE: ${error.message || error.name}`);
          }
        } finally {
          setIsBluetoothSearching(false);
        }
      };

      return (
        <section
          hidden={!isOnHome}
          className={isCompact
            ? `relative z-10 mx-1 w-[calc(100%-0.5rem)] self-end shrink-0 overflow-hidden rounded-[24px] border border-white/10 bg-gradient-to-b from-[#49321f] via-[#35261b] to-[#201b17] shadow-[0_8px_24px_rgba(0,0,0,0.35)] transition-[max-height,margin,opacity,transform] duration-1000 ease-in-out ${isOpen && !isHiddenOnScroll ? 'mb-1 max-h-[260px] translate-y-0 opacity-100' : 'mb-0 max-h-0 -translate-y-full border-transparent opacity-0 pointer-events-none'}`
            : `relative z-10 mx-3 shrink-0 overflow-hidden rounded-[26px] border border-[#eceef2] bg-white shadow-[0_10px_24px_rgba(15,23,42,0.06)] transition-[max-height,margin,opacity,transform] duration-1000 ease-in-out ${isOpen && isVisible ? 'mb-3 max-h-[700px] translate-y-0 opacity-100' : 'mb-0 max-h-0 -translate-y-full border-transparent opacity-0 pointer-events-none'}`}
          aria-hidden={!isOnHome || !isOpen || (isCompact && isHiddenOnScroll)}
          inert={!isOnHome || !isOpen || (isCompact && isHiddenOnScroll) ? '' : undefined}
          aria-label="Reproductor de música"
          aria-live="polite"
        >
          <div className={isCompact ? 'relative m-0 rounded-none border-0 bg-transparent p-0 shadow-none' : 'm-2 rounded-[24px] border border-black/[0.03] bg-white p-4 shadow-[0_8px_26px_rgba(0,0,0,0.045)] sm:m-3 sm:p-5'}>
            {!isCompact && <div className="mb-4 flex items-center justify-between gap-3">
              <div className="min-w-0">
                <h2 className="truncate text-[15px] font-bold leading-tight text-[#1e2538]">
                  Reproductor de{' '}
                  {isYouTubeTrack ? (
                    <a
                      href={currentTrack.url}
                      target="_blank"
                      rel="noopener noreferrer"
                      title="Abrir la canción oficial en YouTube"
                      className="text-blue-600 underline decoration-blue-300 underline-offset-2 hover:text-blue-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
                    >
                      YouTube
                    </a>
                  ) : (
                    <a
                      href="./audiomack-player-terms.html"
                      target="_blank"
                      rel="noopener noreferrer"
                      title="Consulta los términos de uso del reproductor"
                      className="text-blue-600 underline decoration-blue-300 underline-offset-2 hover:text-blue-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
                    >
                      Audiomack
                    </a>
                  )}
                </h2>
                <p className="mt-0.5 truncate text-[10px] text-[#7a8293]">Tu lista de música</p>
              </div>
              <button
                type="button"
                onClick={() => setPlayerSize((currentSize) => currentSize === 'large' ? 'compact' : 'large')}
                className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#edf1f7] text-[#1e2538] transition hover:bg-[#e2e7f0]"
                aria-label={playerSize === 'large' ? 'Minimizar reproductor' : 'Ampliar reproductor'}
                title={playerSize === 'large' ? 'Minimizar reproductor' : 'Ampliar reproductor'}
              >
                <svg className="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d={isCompact ? 'M5 14 12 7l7 7' : 'M5 9l7 7 7-7'}
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2.5"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  />
                </svg>
              </button>
            </div>}

          {!isCompact && (
            <div className="mb-3 max-h-28 space-y-1 overflow-y-auto" aria-label="Lista de canciones">
              {PLAYER_TRACKS.map((track) => (
                <button
                  key={track.audio || track.url}
                  type="button"
                  onClick={() => {
                    setPlayerError('');
                    setCurrentTrack(track);
                  }}
                  aria-current={(currentTrack.audio || currentTrack.url) === (track.audio || track.url) ? 'true' : undefined}
                  className={`flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition ${(currentTrack.audio || currentTrack.url) === (track.audio || track.url) ? 'bg-[#fff0ec] text-[#1e2538]' : 'bg-[#edf1f7] text-[#4b5563] hover:bg-[#e2e7f0]'}`}
                >
                  <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#ff542e] text-white" aria-hidden="true">
                    <svg className="h-4 w-4 translate-x-[1px]" viewBox="0 0 24 24">
                      <path d="M8 5.5v13L19 12 8 5.5Z" fill="currentColor" />
                    </svg>
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block truncate text-xs font-bold">{track.title}</span>
                    <span className="block truncate text-[10px] text-[#7a8293]">{track.artist}</span>
                  </span>
                </button>
              ))}
            </div>
          )}
          <div className={isCompact ? (isLocalTrack ? 'overflow-hidden rounded-[22px]' : 'h-[250px] overflow-hidden rounded-[22px]') : `mb-3 overflow-hidden rounded-[18px] border border-[#e6e9ee] bg-[#f9fafb] ${isLocalTrack ? 'border-0 bg-transparent' : 'min-h-[250px]'}`}>
            {isLocalTrack ? (
              <>
                <audio
                  key={currentTrack.audio}
                  ref={audioRef}
                  src={currentTrack.audio}
                  preload="metadata"
                  onLoadStart={() => {
                    setCurrentTime(0);
                    setDuration(0);
                    setIsPlaying(false);
                    setIsMuted(false);
                  }}
                  onPlay={() => setIsPlaying(true)}
                  onPause={() => setIsPlaying(false)}
                  onLoadedMetadata={(event) => {
                    setDuration(event.currentTarget.duration || 0);
                    setCurrentTime(0);
                  }}
                  onTimeUpdate={(event) => setCurrentTime(event.currentTarget.currentTime)}
                  onEnded={() => {
                    setIsPlaying(false);
                    setPlayerError('');
                    setCurrentTrack((track) => PLAYER_TRACKS[(PLAYER_TRACKS.indexOf(track) + 1) % PLAYER_TRACKS.length]);
                  }}
                  onError={() => setPlayerError('No se pudo cargar la canción seleccionada.')}
                  className="sr-only"
                  aria-label={`${currentTrack.title} - ${currentTrack.artist}`}
                />
                <div className={`relative flex min-h-[300px] flex-col justify-between overflow-hidden rounded-[24px] bg-[#080a09] p-5 text-white shadow-[0_12px_30px_rgba(0,0,0,0.18)] ${isCompact ? 'min-h-[238px] p-4' : ''}`}>
                  <div className="flex min-w-0 items-start gap-4">
                    <img
                      src={currentTrack.cover}
                      alt={`Portada de ${currentTrack.title} de ${currentTrack.artist}`}
                      className={`aspect-square w-[42%] max-w-[154px] shrink-0 rounded-sm object-cover shadow-sm ${isCompact ? 'max-w-[116px]' : ''}`}
                    />
                    <div className="flex min-h-full min-w-0 flex-1 flex-col items-end text-right">
                      <div className="mb-auto flex items-center gap-1.5 text-white" aria-label="Al Toque Music">
                        <svg viewBox="0 0 24 18" className="h-4 w-5 text-[#ff9c19]" aria-hidden="true">
                          <path d="M1 11h3l2-6 3 11 3-9 2 5 2-8 3 10 2-3h2" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                        </svg>
                        <span className="text-[17px] font-extrabold tracking-tight">al toque</span>
                      </div>
                      <div className="mt-6 w-full min-w-0 text-left">
                        <p className="truncate text-[15px] font-bold leading-tight sm:text-[17px]">{currentTrack.artist}</p>
                        <p className="mt-1 truncate text-[14px] font-semibold leading-tight text-white/90 sm:text-[16px]">{currentTrack.title}</p>
                      </div>
                    </div>
                  </div>
                  <div className="mt-5 flex items-end gap-3">
                    <button
                      type="button"
                      onClick={toggleAudioPlayback}
                      className="mb-1 flex h-[48px] w-[48px] shrink-0 items-center justify-center rounded-full border-[3px] border-white/80 text-white transition hover:scale-105 hover:border-white"
                      aria-label={isPlaying ? 'Pausar' : 'Reproducir'}
                      title={isPlaying ? 'Pausar' : 'Reproducir'}
                    >
                      <i data-lucide={isPlaying ? 'pause' : 'play'} className={`h-5 w-5 ${isPlaying ? '' : 'translate-x-0.5'}`}></i>
                    </button>
                    <div className="group relative min-w-0 flex-1 pb-1">
                      <div className="pointer-events-none flex h-[70px] items-end justify-between gap-[2px] overflow-hidden">
                        {waveformHeights.map((height, index) => {
                          const progress = duration ? currentTime / duration : 0;
                          const played = index / waveformHeights.length <= progress;
                          return (
                            <span
                              key={index}
                              className={`w-full max-w-[5px] shrink rounded-t-[1px] transition-colors ${played ? 'bg-[#a7b8ad]' : 'bg-[#323635]'}`}
                              style={{ height: `${height}px` }}
                            ></span>
                          );
                        })}
                      </div>
                      <input
                        type="range"
                        min="0"
                        max={duration || 0}
                        step="0.1"
                        value={Math.min(currentTime, duration || 0)}
                        onChange={(event) => {
                          const nextTime = Number(event.target.value);
                          if (audioRef.current) audioRef.current.currentTime = nextTime;
                          setCurrentTime(nextTime);
                        }}
                        disabled={!duration}
                        className="absolute inset-0 h-full w-full cursor-pointer opacity-0 disabled:cursor-default"
                        aria-label="Progreso de la canción"
                      />
                      <div className="pointer-events-none absolute inset-x-0 bottom-0 flex justify-between text-[12px] font-bold tabular-nums text-white">
                        <span>{formatAudioTime(currentTime)}</span>
                        <span>{formatAudioTime(duration)}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </>
            ) : (
              <iframe
                key={currentTrack.url}
                src={playerUrl.href}
                title={`Reproductor de ${isYouTubeTrack ? 'YouTube' : 'Audiomack'}: ${currentTrack.title} - ${currentTrack.artist}`}
                scrolling="no"
                className="block h-[250px] w-full border-0"
                allow="autoplay"
                referrerPolicy={isYouTubeTrack ? 'strict-origin-when-cross-origin' : undefined}
                loading="lazy"
              ></iframe>
            )}
          </div>
          {playerError && <p className="mb-3 rounded-xl bg-red-50 px-3 py-2 text-xs text-red-700" role="alert">{playerError}</p>}
          {!isCompact && (
            <div className="mb-3">
              <div className="music-device-controls">
                <button
                  type="button"
                  onClick={findBluetoothDevice}
                  disabled={isBluetoothSearching}
                  aria-expanded={audioHelp === 'bluetooth'}
                  className="music-device-button disabled:cursor-wait disabled:opacity-60"
                  aria-label="Buscar dispositivos Bluetooth BLE"
                  title="Buscar dispositivos Bluetooth BLE"
                >
                  <i data-lucide="bluetooth" className="h-[17px] w-[17px]"></i>
                </button>
                <input
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value={volume}

    function getDayPart(hour) {
      if (hour >= 5 && hour < 12) return 'morning';
      if (hour >= 12 && hour < 17) return 'afternoon';
      if (hour >= 17 && hour < 21) return 'evening';
      return 'night';
    }

    function getCampusServiceStatus(date = new Date()) {
      const timeParts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'America/Lima',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(date);
      const parts = Object.fromEntries(timeParts.map(({ type, value }) => [type, value]));
      const minuteOfDay = Number(parts.hour) * 60 + Number(parts.minute);

      if ((minuteOfDay >= 600 && minuteOfDay < 800) || (minuteOfDay >= 810 && minuteOfDay < 1080) || (minuteOfDay >= 1200 && minuteOfDay < 1320)) {
        const closesAt = minuteOfDay < 800 ? '1:20 p. m.' : minuteOfDay < 1080 ? '6:00 p. m.' : '10:00 p. m.';
        return {
          state: 'online',
          label: 'En línea',
          title: '¡Ya estamos en línea!',
          description: 'Delivery de comida para estudiantes del campus de Miraflores.',
          detail: `Recibimos pedidos hasta las ${closesAt}`
        };
      }

      if (minuteOfDay >= 800 && minuteOfDay < 810) {
        return {
          state: 'offline',
          label: 'Refrigerio',
          title: 'Pausa para recargar',
          description: 'Estamos en refrigerio. Enseguida volvemos a atender.',
          detail: 'Retomamos los pedidos a la 1:30 p. m.'
        };
      }

      const nextOpening = minuteOfDay < 600
        ? '10:00 a. m.'
        : minuteOfDay < 810
          ? '1:30 p. m.'
          : minuteOfDay < 1200
            ? '8:00 p. m.'
            : '10:00 a. m. de mañana';

      return {
        state: 'offline',
        label: 'Fuera de línea',
        title: 'Ahora estamos fuera de línea',
        description: 'Delivery de comida para estudiantes del campus de Miraflores.',
        detail: `Volvemos a recibir pedidos a las ${nextOpening}`
      };
    }

        const normalized = (hostname || '').replace(/^\[|\]$/g, '').toLowerCase();

        try {
          const configuredServerUrl = window.ALTOQUE_CONFIG?.serverUrl;
          if (configuredServerUrl) {
            const currentUrl = new URL(window.location.href);
            const backendUrl = new URL(configuredServerUrl, window.location.href);
            const sameLocalHost = normalizeLoopbackHost(currentUrl.hostname) === normalizeLoopbackHost(backendUrl.hostname);
            if (!sameLocalHost || currentUrl.port !== backendUrl.port) {
              return 'El servidor rechazó el origen. Abre la aplicación desde la misma URL del servidor; no uses diferentes alias locales como localhost y 127.0.0.1 mezclados.';

                try {

                } catch (scrollError) {
                  console.warn('No se pudo abrir el Reel compartido:', scrollError);
                }
              }, 100);
            }
            setError('');
          } catch (loadError) {
            if (active) setError(loadError.message || 'No se pudo conectar con Reels.');
          } finally {
            if (active) setLoading(false);
          }
        };
        feedRefreshRef.current = loadFeed;
        loadFeed(true);
        const timer = setInterval(() => loadFeed(false), 15000);
        return () => {
          active = false;
          clearInterval(timer);
          feedRefreshRef.current = null;
        };
      }, [profileId]);

      useEffect(() => {
        const feed = feedRef.current;
        if (!feed || !('IntersectionObserver' in window)) return undefined;
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            const video = entry.target;
            if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
              video.muted = videosMutedRef.current;
              video.play().catch(() => {
                setNotice('No se pudo reproducir automáticamente. Toca el video para intentarlo de nuevo.');
              });
            } else {
              video.pause();
            }
          });
        }, { root: feed, threshold: [0.2, 0.65, 0.9] });
        videoElementsRef.current.forEach((video) => observer.observe(video));
        return () => observer.disconnect();
      }, [posts]);

      const toggleVideoSound = (postId) => {
        const nextMuted = !videosMutedRef.current;
        videosMutedRef.current = nextMuted;
        setVideosMuted(nextMuted);
        videoElementsRef.current.forEach((video) => {
          video.muted = nextMuted;
        });
        if (nextMuted) return;
        const activeVideo = videoElementsRef.current.get(postId);
        if (!activeVideo) return;
        activeVideo.muted = false;
        activeVideo.volume = 1;
        activeVideo.play().catch(() => {
          videosMutedRef.current = true;
          setVideosMuted(true);
          videoElementsRef.current.forEach((video) => {
            video.muted = true;
          });
          setNotice('No se pudo activar el audio. Toca el botón de sonido para volver a intentarlo.');

      };

      const readSmallPhoto = async (file) => {
        if (!file) return '';
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
          throw new Error('Elige una foto JPG, PNG o WebP.');
        }
        if (file.size > 8 * 1024 * 1024) throw new Error('La foto debe pesar menos de 8 MB.');
        const bitmap = await createImageBitmap(file);
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, 320 / Math.max(bitmap.width, bitmap.height));
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        const context = canvas.getContext('2d');
        if (!context) throw new Error('No se pudo preparar la foto del perfil.');
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close();
        const photo = canvas.toDataURL('image/jpeg', 0.78);
        if (photo.length > 900_000) throw new Error('La foto es demasiado pesada. Prueba con una imagen más pequeña.');
        return photo;
      };

      const saveProfile = async (event) => {
        event.preventDefault();
        const reelsBackendError = getReelsBackendError();
        if (reelsBackendError) {
          setNotice(reelsBackendError);
          return;
        }
        const name = profileName.trim();
        if (name.length < 2 || name.length > 30) {
          setNotice('Escribe un nombre de 2 a 30 caracteres.');
          return;
        }
        setProfileSaving(true);
        setNotice('');
        try {
          const response = await fetch('/api/reels/profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profileId, name, ...(profilePhoto ? { photo: profilePhoto } : {}) })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || `No se pudo guardar el perfil (${response.status}).`);
          const nextProfile = {
            id: profileId,
            name: payload.profile?.name || name,
            photo: payload.profile?.photo || profilePhoto
          };
          setProfile(nextProfile);
          try {
            localStorage.setItem('altoque_reels_profile', JSON.stringify(nextProfile));
          } catch (storageError) {
            console.error('No se pudo guardar el perfil de Reels en este dispositivo:', storageError);
          }
          setShowProfileEditor(false);
          feedRefreshRef.current?.();
        } catch (saveError) {
          setNotice(saveError.message || 'No se pudo guardar el perfil.');
        } finally {
          setProfileSaving(false);
        }
      };

      const publishVideo = async (event) => {
        event.preventDefault();
        const reelsBackendError = getReelsBackendError();
        if (reelsBackendError) {
          setNotice(reelsBackendError);
          return;
        }
        const file = videoInputRef.current?.files?.[0];
        const contentType = file?.type || (file?.name.toLowerCase().endsWith('.mp4') ? 'video/mp4' : 'video/webm');
        if (!profile?.name) {
          setNotice('Crea primero tu perfil de Reels para publicar.');
          setShowComposer(false);
          setShowProfileEditor(true);
          return;
        }
        if (!file) {
          setNotice('Selecciona un video antes de publicar.');
          return;
        }
        if (videoShowsPeople && !acceptedImageRights) {
          setNotice('Acepta el Acuerdo de Cesión de Derechos de Imagen para publicar un video con personas.');
          return;
        }
        if (!['video/mp4', 'video/webm'].includes(contentType)) {
          setNotice('El video debe estar en formato MP4 o WebM.');
          return;
        }
        if (file.size <= 0 || file.size > maxVideoBytes) {
          setNotice('El video debe pesar entre 1 byte y 100 MB.');
          return;
        }
        setPublishing(true);
        setNotice('');
        try {
          const uploadResponse = await fetch('/api/reels/videos', {
            method: 'POST',
            headers: { 'Content-Type': contentType },
            body: file
          });
          const uploadPayload = await uploadResponse.json().catch(() => ({}));
          if (!uploadResponse.ok) throw new Error(uploadPayload.error || `No se pudo subir el video (${uploadResponse.status}).`);
          const publishResponse = await fetch('/api/reels/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              profileId,
              videoId: uploadPayload.video?.id,
              caption: caption.trim(),
              hasPeople: videoShowsPeople,
              imageRightsAccepted: videoShowsPeople && acceptedImageRights
            })
          });
          const publishPayload = await publishResponse.json().catch(() => ({}));
          if (!publishResponse.ok) throw new Error(publishPayload.error || `No se pudo publicar el Reel (${publishResponse.status}).`);
          setCaption('');
          if (videoInputRef.current) videoInputRef.current.value = '';
          closeComposer();
          setNotice('¡Tu Reel ya está compartido!');
          await feedRefreshRef.current?.();
        } catch (publishError) {
          setNotice(publishError.message || 'No se pudo publicar el video.');
        } finally {
          setPublishing(false);
        }
      };
