            min-height: 20px !important;

            opacity: 1 !important;
          }

          .bpComposerToolbar > div:last-child {
            grid-column: 2 !important;

            width: 40px !important;
            height: 40px !important;
            align-items: center !important;
            justify-content: center !important;

          .bpComposerSendButton {
            display: block !important;
            width: 40px !important;
            height: 40px !important;
            box-sizing: border-box !important;
            padding: 10px !important;
            border-radius: 999px !important;
            background: #fff2ce !important;

            cursor: pointer !important;
          }
          .bpComposerSendButton[data-show="false"] {
            opacity: 1 !important;
          }
        `;
        root.appendChild(style);
      };
      const localizeBotpress = (root) => {
        const input = root.querySelector('.bpComposerInput');
        if (input) {
          if (input.getAttribute('placeholder') !== 'Escribe tu mensaje...') {
            input.setAttribute('placeholder', 'Escribe tu mensaje...');
          }
          if (input.getAttribute('aria-label') !== 'Escribe tu mensaje') {
            input.setAttribute('aria-label', 'Escribe tu mensaje');
          }
        }
        root.querySelector('.bpComposerSendButton')?.setAttribute('aria-label', 'Enviar mensaje');
      };
      const hideBotpressSources = (root) => {
        root.querySelectorAll('.bpCitationSources, .bpCitationSourcesPopover, .bpCitationPill').forEach((element) => {
          if (element.dataset.altoqueBotpressSourceHidden === 'true') return;
          element.dataset.altoqueBotpressSourceHidden = 'true';
          element.setAttribute('aria-hidden', 'true');
          element.style.setProperty('display', 'none', 'important');
        });
      };
      const brandBotpressAvatars = (root) => {
        root.querySelectorAll('.bpMessageAvatarContainer').forEach((avatar) => {
          if (avatar.dataset.altoqueBotpressAvatar === 'true') return;
          const logo = document.createElement('img');
          logo.className = 'altoqueBotpressAvatarImage';
          logo.src = new URL('al-toque-pe-emblema.png', window.location.href).href;
          logo.alt = 'Al Toque';
          logo.draggable = false;
          avatar.replaceChildren(logo);
          avatar.classList.add('altoqueBotpressAvatar');
          avatar.dataset.altoqueBotpressAvatar = 'true';
          avatar.setAttribute('aria-label', 'Al Toque');
          avatar.removeAttribute('title');
        });
      };
      const hideBotpressLauncher = (root) => {
        const launchers = root.querySelectorAll(
          '.bpFabWrapper, .bpFab, .bpFabContainer, .bpMessagePreview, .bpMessagePreviewContainer'
        );
        launchers.forEach((element) => {
          element.style.setProperty('display', 'none', 'important');
          element.style.setProperty('visibility', 'hidden', 'important');
          element.style.setProperty('pointer-events', 'none', 'important');
        });
        window.botpress?.hideMessagePreview?.();
        if (root.host.getAttribute('data-altoque-chat-active') !== 'true') {
          const webchat = root.querySelector('.bpWebchat');
          if (webchat) {
            webchat.style.visibility = 'hidden';
            webchat.style.pointerEvents = 'none';
          }
        }
        applyBotpressTheme(root);
        localizeBotpress(root);
        brandBotpressAvatars(root);
        hideBotpressSources(root);
        return launchers.length > 0;
      };
      const attachToBotpress = () => {
        const root = document.getElementById('fab-root')?.shadowRoot;
        if (!root) return false;
        applyBotpressTheme(root);
        localizeBotpress(root);
        if (!root.__altoqueBotpressObserver) {
          const observer = new MutationObserver(() => {
            localizeBotpress(root);
            brandBotpressAvatars(root);
            hideBotpressLauncher(root);
          });
          observer.observe(root, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['placeholder', 'style']
          });
          root.__altoqueBotpressObserver = observer;
        }
        hideBotpressLauncher(root);
        return true;
      };
      const observer = new MutationObserver(() => {
        if (attachToBotpress()) observer.disconnect();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      attachToBotpress();
    })();
  </script>

  <!-- ALTOQUE_CONFIG -->
  <script>
    (() => {
      const configuredServerUrl = window.ALTOQUE_CONFIG?.serverUrl;
      if (!configuredServerUrl) {
        if (window.location.protocol === 'file:') {
          window.__ALTOQUE_BACKEND_UNAVAILABLE__ = true;
        }
        return;
      }

      try {
        const targetServerUrl = new URL(configuredServerUrl, window.location.href);
        const currentUrl = new URL(window.location.href);
        const isWrongOrigin = targetServerUrl.origin !== currentUrl.origin;

        if (window.location.protocol === 'file:' || isWrongOrigin) {
          const safePath = window.location.protocol === 'file:'
            ? '/'
            : `${window.location.pathname}${window.location.search}${window.location.hash}` || '/';
          window.location.replace(new URL(safePath, targetServerUrl).href);
          return;
        }
      } catch (error) {
        console.warn('ALTOQUE_CONFIG.serverUrl no es una URL válida:', configuredServerUrl);
      }
    })();
  </script>

        peer.oniceconnectionstatechange = () => {
          if (peer.iceConnectionState === 'failed') {
            setCall((current) => ({
              ...current,
              status: 'error',
              error: 'No se pudo establecer la conexión de voz. Verifica internet y TURN_URL, TURN_USER y TURN_PASS.'
            }));
          }
        };
        return peer;
      };

      const processSignal = async (signal) => {
        const peer = peerRef.current;
        if (!peer) return;
        if (signal.type === 'offer') {
          await peer.setRemoteDescription(signal.data);
          for (const candidate of pendingCandidatesRef.current) await peer.addIceCandidate(candidate);
          pendingCandidatesRef.current = [];
          const answer = await peer.createAnswer();
          await peer.setLocalDescription(answer);
          await postCallAction('answer', peer.localDescription.toJSON());
        } else if (signal.type === 'answer') {
          await peer.setRemoteDescription(signal.data);
          for (const candidate of pendingCandidatesRef.current) await peer.addIceCandidate(candidate);
          pendingCandidatesRef.current = [];
        } else if (signal.type === 'candidate') {
          const candidate = new RTCIceCandidate(signal.data);
          if (peer.remoteDescription) await peer.addIceCandidate(candidate);
          else pendingCandidatesRef.current.push(candidate);
        } else if (signal.type === 'reject') {
          releaseMedia();
          setCall({ status: 'ended', caller: '', error: 'La otra persona rechazó la llamada.' });
        } else if (signal.type === 'hangup' || signal.type === 'missed' || signal.type === 'timeout') {
          releaseMedia();
          setCall({ status: 'ended', caller: '', error: signal.type === 'missed'
            ? 'La llamada no fue contestada.'
            : signal.type === 'timeout'
              ? 'La llamada finalizó al cumplir 10 minutos.'
              : 'La otra persona finalizó la llamada.' });
        }
      };

      useEffect(() => {
        if (!orderId) {
          releaseMedia();
          setCall({ status: 'idle', caller: '', error: '' });
          signalCursorRef.current = 0;
          return undefined;
        }
        let mounted = true;
        const pollCall = async () => {
          if (isPollingRef.current) return;
          isPollingRef.current = true;
          try {
            const url = `/api/orders/${encodeURIComponent(orderId)}/call?role=${role}&after=${signalCursorRef.current}`;
            const response = await fetch(url, { cache: 'no-store' });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || `Error ${response.status}`);
            if (!mounted) return;
            const currentCall = payload.call;
            if (currentCall?.status === 'ringing') {
              if (currentCall.caller === role) {
                setCall((current) => current.status === 'connecting' || current.status === 'connected'
                  ? current
                  : { status: 'ringing', caller: role, error: '' });
              } else {
                setCall((current) => current.status === 'connecting' || current.status === 'connected'
                  ? current
                  : { status: 'incoming', caller: currentCall.caller, error: '' });
              }
            } else if (currentCall?.status === 'connecting' && callRef.current.status !== 'connected') {
              setCall((current) => current.status === 'connected' ? current : { ...current, status: 'connecting', error: '' });
            } else if (currentCall?.status === 'ended' && callRef.current.status !== 'idle' && callRef.current.status !== 'ended') {
              releaseMedia();
              setCall({ status: 'ended', caller: '', error: currentCall.endReason === 'timeout'
                ? 'La llamada finalizó al cumplir 10 minutos.'
                : 'La llamada finalizó.' });
            }
            for (const signal of payload.signals || []) {
              if (signal.from !== role && !peerRef.current && ['offer', 'answer', 'candidate'].includes(signal.type)) break;
              signalCursorRef.current = Math.max(signalCursorRef.current, signal.id);
              if (signal.from !== role && peerRef.current) await processSignal(signal);
            }
          } catch (error) {
            if (mounted && callRef.current.status !== 'idle' && callRef.current.status !== 'ended') {
              setCall((current) => ({ ...current, error: error.message }));
            }
          } finally {
            isPollingRef.current = false;
          }
        };
        pollCall();
        const timer = window.setInterval(pollCall, 700);
        return () => {
          mounted = false;
          window.clearInterval(timer);
          releaseMedia();
        };
      }, [orderId, role]);

      const startCall = async () => {
        if (!orderId) return;
        let didStart = false;
        try {
          signalCursorRef.current = 0;
          const peer = await createPeerConnection();
          const callInfo = await postCallAction('start');
          didStart = true;
          setCall({ status: 'ringing', caller: role, error: '' });
          const offer = await peer.createOffer();
          await peer.setLocalDescription(offer);
          await postCallAction('offer', peer.localDescription.toJSON());
          return callInfo;
        } catch (error) {
          if (didStart) {
            try { await postCallAction('hangup'); } catch (signalError) {
              console.error('No se pudo cancelar el inicio de llamada:', signalError);
            }
          }
          releaseMedia();
          setCall({ status: 'error', caller: '', error: error.name === 'NotAllowedError'
            ? 'Permite el acceso al micrófono para iniciar la llamada.'
            : error.name === 'NotFoundError'
              ? 'No se encontró un micrófono disponible en este dispositivo.'
            : error.message });
        }
      };

      const acceptCall = async () => {
        try {
          signalCursorRef.current = 0;
          await createPeerConnection();
          await postCallAction('accept');
          setCall((current) => ({ ...current, status: 'connecting', error: '' }));
        } catch (error) {
          releaseMedia();
          setCall({ status: 'error', caller: '', error: error.name === 'NotAllowedError'
            ? 'Permite el acceso al micrófono para contestar la llamada.'
            : error.name === 'NotFoundError'
              ? 'No se encontró un micrófono disponible en este dispositivo.'
            : error.message });
          try { await postCallAction('reject'); } catch (signalError) { console.error('No se pudo cerrar la llamada rechazada:', signalError); }
        }
      };

      const endCall = async (action = 'hangup') => {
        try {
          await postCallAction(action);
        } catch (error) {
          console.error('No se pudo notificar el fin de llamada:', error);
        } finally {
          releaseMedia();
          setCall({ status: 'ended', caller: '', error: '' });
        }
      };

      const dismissCall = () => {
        setCall({ status: 'idle', caller: '', error: '' });
      };

      return {
        call,
        remoteStream,
        startCall,
        acceptCall,
        rejectCall: () => endCall('reject'),
        endCall,
        dismissCall,
        setSpeakerOutputEnabled,
        setMicrophoneMuted
      };
    }

    function VoiceCallDialog({ controller, contactName }) {

                    <i data-lucide={isSpeakerEnabled ? 'volume-2' : 'volume-1'} className="h-5 w-5"></i>

    }

    const APP_STICKER_COUNT = 25;
    const getStickerAssetName = (stickerId) => `sticker_${stickerId}.${stickerId <= 8 ? 'webp' : 'png'}`;
    const getRandomNewStickerId = () => Math.floor(Math.random() * (APP_STICKER_COUNT - 8)) + 9;
    const HIDDEN_GORRITOS_STICKER_IDS = new Set([10, 11]);
    const HOME_CARD_VICUNA_STICKER_IDS = [1, 2, 3, 4, 5, 6, 7, 8, 9, 12, 14];
    const ORDER_CHAT_STICKERS = Array.from({ length: APP_STICKER_COUNT }, (_, index) => getStickerAssetName(index + 1));
    const ORDER_CHAT_MAX_FILE_BYTES = 2_000_000;
    const ORDER_CHAT_MAX_AUDIO_DURATION_MS = 60_000;
    const ORDER_CHAT_DOCUMENT_TYPES = new Set([
      'application/pdf',
      'text/plain',
      'application/msword',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    ]);

    function mergeOrderChatMessages(current, incoming, receipts = []) {
      const messagesById = new Map(current.map((message) => [message.id, message]));
      incoming.forEach((message) => messagesById.set(message.id, message));
      receipts.forEach((receipt) => {
        const message = messagesById.get(receipt.id);
        if (message) messagesById.set(receipt.id, { ...message, readAt: receipt.readAt });
      });
      return [...messagesById.values()].sort((first, second) => first.createdAt - second.createdAt).slice(-100);
    }

    function formatOrderChatTime(timestamp) {
      if (!Number.isFinite(timestamp)) return '';
      return new Intl.DateTimeFormat('es-PE', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      }).format(timestamp).replace(/\s/g, ' ');
    }

    function formatAudioDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);
      return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
    }

    function encodeChatAudioWav(chunks, sourceSampleRate) {
      const targetSampleRate = 12_000;
      const sourceLength = chunks.reduce((total, chunk) => total + chunk.length, 0);
      const sourceSamples = new Float32Array(sourceLength);
      let sourceOffset = 0;
      chunks.forEach((chunk) => {
        sourceSamples.set(chunk, sourceOffset);
        sourceOffset += chunk.length;
      });
      const ratio = sourceSampleRate / targetSampleRate;
      const outputLength = Math.floor(sourceLength / ratio);
      const bytesPerSample = 2;
      const buffer = new ArrayBuffer(44 + outputLength * bytesPerSample);
      const view = new DataView(buffer);
      const writeText = (offset, value) => {
        for (let index = 0; index < value.length; index += 1) view.setUint8(offset + index, value.charCodeAt(index));
      };
      writeText(0, 'RIFF');
      view.setUint32(4, 36 + outputLength * bytesPerSample, true);
      writeText(8, 'WAVE');
      writeText(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, targetSampleRate, true);
      view.setUint32(28, targetSampleRate * bytesPerSample, true);
      view.setUint16(32, bytesPerSample, true);
      view.setUint16(34, 16, true);
      writeText(36, 'data');
      view.setUint32(40, outputLength * bytesPerSample, true);
      for (let index = 0; index < outputLength; index += 1) {
        const start = Math.floor(index * ratio);
        const end = Math.min(sourceLength, Math.floor((index + 1) * ratio));
        let sum = 0;
        for (let sampleIndex = start; sampleIndex < end; sampleIndex += 1) sum += sourceSamples[sampleIndex];
        const sample = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
        view.setInt16(44 + index * bytesPerSample, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function OrderChatAudioPlayer({ src, isOwn, onError }) {
      const audioRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [duration, setDuration] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const barHeights = Array.from({ length: 42 }, (_, index) => 7 + ((index * 17 + 11) % 20));
      const progress = duration > 0 ? currentTime / duration : 0;

      const togglePlayback = async () => {
        const audio = audioRef.current;
        if (!audio) return;
        if (audio.paused) {
          try {
            await audio.play();
            setIsPlaying(true);
          } catch (error) {
            onError();
          }
        } else {
          audio.pause();
          setIsPlaying(false);
        }
      };

      const seekAudio = (event) => {
        const audio = audioRef.current;
        const nextTime = Number(event.target.value);
        if (audio && Number.isFinite(nextTime)) {
          audio.currentTime = nextTime;
          setCurrentTime(nextTime);
        }
      };

      return (
        <div className={`chat-audio-player ${isOwn ? 'is-own' : ''}`}>
          <audio
            ref={audioRef}
            src={src}
            preload="metadata"
            className="hidden"
            onLoadedMetadata={(event) => setDuration(Number.isFinite(event.currentTarget.duration) ? event.currentTarget.duration : 0)}
            onDurationChange={(event) => setDuration(Number.isFinite(event.currentTarget.duration) ? event.currentTarget.duration : 0)}
            onTimeUpdate={(event) => setCurrentTime(event.currentTarget.currentTime)}
            onEnded={() => setIsPlaying(false)}
            onError={onError}
          />
          <button
            type="button"
            className="chat-audio-play"
            onClick={togglePlayback}
            aria-label={isPlaying ? 'Pausar audio' : 'Reproducir audio'}
          >
            <i data-lucide={isPlaying ? 'pause' : 'play'} className="h-4 w-4"></i>
          </button>
          <div className="min-w-0 flex-1">
            <div className="chat-audio-waveform" aria-label="Progreso del audio">
              {barHeights.map((height, index) => (
                <span
                  key={index}
                  className={`chat-audio-waveform-bar ${duration > 0 && index / barHeights.length <= progress ? 'is-played' : ''}`}
                  style={{ height: `${height}px` }}
                />
              ))}
              <input
                type="range"
                className="chat-audio-seek"
                min="0"
                max={duration || 0}
                step="0.1"
                value={Math.min(currentTime, duration || 0)}
                onChange={seekAudio}
                aria-label="Buscar posición en el audio"
              />
            </div>
            <div className="chat-audio-footer">
              <span>{formatAudioDuration(currentTime)}</span>
              <span>{formatAudioDuration(duration)}</span>
            </div>
          </div>
        </div>
      );
    }

    function playOrderChatSound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      const context = new AudioContextClass();
      if (context.state === 'suspended') context.resume().catch(() => {});
      const startAt = context.currentTime;
      [660, 880].forEach((frequency, index) => {
        const oscillator = context.createOscillator();
        const volume = context.createGain();
        const start = startAt + index * 0.12;
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        volume.gain.setValueAtTime(0.0001, start);
        volume.gain.exponentialRampToValueAtTime(0.025, start + 0.025);
        volume.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);
        oscillator.connect(volume);
        volume.connect(context.destination);
        oscillator.start(start);
        oscillator.stop(start + 0.17);
        if (index === 1) oscillator.onended = () => context.close();
      });
    }

    function readChatFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => typeof reader.result === 'string'
          ? resolve(reader.result)
          : reject(new Error('No se pudo leer el archivo.'));
        reader.onerror = () => reject(new Error('No se pudo leer el archivo.'));
        reader.readAsDataURL(file);
      });
    }

    function OrderChatPanel({ messages, role, sendError, onSend, emptyMessage }) {
      const [draft, setDraft] = useState('');
      const [stickerPickerOpen, setStickerPickerOpen] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [composerError, setComposerError] = useState('');
      const [failedAudioIds, setFailedAudioIds] = useState([]);
      const messageListRef = useRef(null);
      const fileInputRef = useRef(null);
      const streamRef = useRef(null);
      const audioContextRef = useRef(null);
      const audioProcessorRef = useRef(null);
      const audioChunksRef = useRef([]);
      const audioSampleRateRef = useRef(0);
      const audioSourceRef = useRef(null);
      const recordingTimerRef = useRef(null);
      const isMountedRef = useRef(true);

      useEffect(() => {
        isMountedRef.current = true;
        return () => {
          isMountedRef.current = false;
          if (recordingTimerRef.current) window.clearTimeout(recordingTimerRef.current);
          if (audioProcessorRef.current) audioProcessorRef.current.onaudioprocess = null;
          audioProcessorRef.current?.disconnect();
          audioSourceRef.current?.disconnect();
          streamRef.current?.getTracks().forEach((track) => track.stop());
          if (audioContextRef.current && audioContextRef.current.state !== 'closed') {
            audioContextRef.current.close().catch((error) => console.error('No se pudo cerrar el contexto de audio:', error));
          }
        };
      }, []);

      useEffect(() => {
        if (messageListRef.current) messageListRef.current.scrollTop = messageListRef.current.scrollHeight;
      }, [messages]);

      const sendMessage = async (message) => {
        setComposerError('');
        try {
          await onSend({
            id: window.crypto?.randomUUID ? window.crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`,
            sender: role,
            type: message.type,
            text: message.text || '',
            ...(message.attachment ? { attachment: message.attachment } : {}),
            createdAt: Date.now()
          });
          if (isMountedRef.current) {
            playOrderChatSound();
            setDraft('');
            setStickerPickerOpen(false);
          }
        } catch (error) {
          if (isMountedRef.current) setComposerError(error.message || 'No se pudo enviar el mensaje.');
        }
      };

      const sendText = (event) => {
        event.preventDefault();
        const text = draft.trim().slice(0, 500);
        if (text) sendMessage({ type: 'text', text });
      };

      const sendSticker = (sticker) => {
        sendMessage({
          type: 'sticker',
          text: '',
          attachment: { name: sticker }
        });
      };

      const handleFileSelection = async (event) => {
        const file = event.target.files?.[0];
        event.target.value = '';
        if (!file) return;
        if (!ORDER_CHAT_DOCUMENT_TYPES.has(file.type)) {
          setComposerError('Adjunta un PDF, TXT, DOC o DOCX.');
          return;
        }
        if (file.size > ORDER_CHAT_MAX_FILE_BYTES) {
          setComposerError('El documento no puede superar 300 KB.');
          return;
        }
        try {
          const data = await readChatFileAsDataUrl(file);
          await sendMessage({
            type: 'document',
            text: '',
            attachment: { name: file.name.slice(0, 120), mimeType: file.type, data }
          });
        } catch (error) {
          setComposerError(error.message || 'No se pudo adjuntar el documento.');
        }
      };

      const stopRecording = () => {
        if (recordingTimerRef.current) window.clearTimeout(recordingTimerRef.current);
        recordingTimerRef.current = null;
        const chunks = audioChunksRef.current;
        audioChunksRef.current = [];
        if (audioProcessorRef.current) {
          audioProcessorRef.current.onaudioprocess = null;
          audioProcessorRef.current.disconnect();
          audioProcessorRef.current = null;
        }
        audioSourceRef.current?.disconnect();
        audioSourceRef.current = null;
        streamRef.current?.getTracks().forEach((track) => track.stop());
        streamRef.current = null;
        const audioContext = audioContextRef.current;
        audioContextRef.current = null;
        if (isMountedRef.current) setIsRecording(false);
        if (audioContext && audioContext.state !== 'closed') {
          audioContext.close().catch((error) => console.error('No se pudo cerrar el contexto de audio:', error));
        }
        if (!isMountedRef.current) return;
        if (!chunks.length) {
          setComposerError('No se capturó audio. Revisa el micrófono e inténtalo de nuevo.');
          return;
        }

        try {
          const audio = encodeChatAudioWav(chunks, audioSampleRateRef.current);
          audioChunksRef.current = [];
          if (audio.size > ORDER_CHAT_MAX_FILE_BYTES) {
            setComposerError('El audio superó el tamaño permitido. Graba un mensaje más corto.');
            return;
          }
          readChatFileAsDataUrl(audio).then((data) => sendMessage({
            type: 'audio',
            text: '',
            attachment: {
              name: `Audio ${new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })}.wav`,
              mimeType: audio.type,
              data
            }
          })).catch((error) => {
            if (isMountedRef.current) setComposerError(error.message || 'No se pudo preparar el audio.');
          });
        } catch (error) {
          setComposerError(`No se pudo preparar el audio: ${error.message}`);
        }
      };

      const startRecording = async () => {
        setComposerError('');
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia || !AudioContextClass) {
          setComposerError('La grabación de audio requiere HTTPS o localhost y un navegador compatible.');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          if (!isMountedRef.current) {
            stream.getTracks().forEach((track) => track.stop());
            return;
          }
          streamRef.current = stream;
          const audioContext = new AudioContextClass();
          audioContextRef.current = audioContext;
          await audioContext.resume();
          const source = audioContext.createMediaStreamSource(stream);
          const processor = audioContext.createScriptProcessor(4096, 1, 1);
          const silentOutput = audioContext.createGain();
          silentOutput.gain.value = 0;
          audioSampleRateRef.current = audioContext.sampleRate;
          audioChunksRef.current = [];
          source.connect(processor);
          processor.connect(silentOutput);
          silentOutput.connect(audioContext.destination);
          processor.onaudioprocess = (event) => {
            if (!isMountedRef.current) return;
            audioChunksRef.current.push(new Float32Array(event.inputBuffer.getChannelData(0)));
          };
          audioSourceRef.current = source;
          audioProcessorRef.current = processor;
          setIsRecording(true);
          recordingTimerRef.current = window.setTimeout(stopRecording, ORDER_CHAT_MAX_AUDIO_DURATION_MS);
        } catch (error) {
          streamRef.current?.getTracks().forEach((track) => track.stop());
          streamRef.current = null;
          audioProcessorRef.current?.disconnect();
          audioProcessorRef.current = null;
          audioSourceRef.current?.disconnect();
          audioSourceRef.current = null;
          const audioContext = audioContextRef.current;
          audioContextRef.current = null;
          if (audioContext && audioContext.state !== 'closed') {
            audioContext.close().catch((closeError) => console.error('No se pudo cerrar el contexto de audio:', closeError));
          }
          setComposerError(error.name === 'NotAllowedError'
            ? 'Permite el acceso al micrófono para grabar un audio.'
            : `No se pudo iniciar la grabación: ${error.message}`);
        }
      };

      return (
        <div className="space-y-2">
          <div ref={messageListRef} className="max-h-64 min-h-28 space-y-2 overflow-y-auto rounded-xl bg-[#f7f4ef] p-3" aria-live="polite">
            {messages.map((message) => {
              const isOwn = message.sender === role;
              const type = message.type || 'text';
              const isAudio = type === 'audio';
              const bubbleClass = isAudio
                ? 'w-full min-w-0 overflow-hidden border border-[#eee9de] bg-white text-gray-800'
                : isOwn ? 'bg-[#a90000] text-white' : 'bg-white text-gray-800';
              return (
                <div key={message.id} className={`flex ${isOwn ? 'justify-end' : 'justify-start'}`}>
                  <div className={`min-w-0 max-w-[85%] overflow-hidden rounded-2xl px-3 py-2 text-[11px] shadow-sm ${bubbleClass}`}>
                    {type === 'sticker' && (
                      <img
                        src={message.attachment?.url || `/${message.attachment?.name || ''}`}
                        alt="Sticker de Al Toque"
                        className="h-24 w-24 object-contain"
                      />
                    )}
                    {type === 'audio' && message.attachment?.data && !failedAudioIds.includes(message.id) && (
                      <OrderChatAudioPlayer
                        src={message.attachment.data}
                        isOwn={isOwn}
                        onError={() => setFailedAudioIds((ids) => ids.includes(message.id) ? ids : [...ids, message.id])}
                      />
                    )}
                    {type === 'audio' && failedAudioIds.includes(message.id) && (
                      <p className="text-[10px]" role="alert">Este audio no se pudo reproducir en este navegador.</p>
                    )}
                    {type === 'document' && message.attachment?.data && (
                      <a
                        href={message.attachment.data}
                        download={message.attachment.name}
                        className={`flex items-center gap-2 underline ${isOwn ? 'text-white' : 'text-[#a90000]'}`}
                      >
                        <i data-lucide="file-text" className="h-5 w-5 shrink-0"></i>
                        <span className="break-all">{message.attachment.name}</span>
                      </a>
                    )}
                    {type === 'text' && <p className="whitespace-pre-wrap break-words">{message.text}</p>}
                    {type === 'audio' && !message.attachment?.data && <p>{message.attachment?.name || 'Audio'}</p>}
                    <div className={`chat-message-meta ${isOwn ? 'is-own' : ''}`}>
                      <time dateTime={new Date(message.createdAt).toISOString()}>
                        {formatOrderChatTime(message.createdAt)}
                      </time>
                      {isOwn && (
                        <span
                          className={`chat-message-checks ${message.readAt ? 'is-read' : ''}`}
                          aria-label={message.readAt ? 'Visto por la otra persona' : 'Enviado'}
                          title={message.readAt ? 'Visto' : 'Enviado'}
                        >
                          ✓✓
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
            {messages.length === 0 && <p className="py-8 text-center text-[10px] text-gray-500">{emptyMessage}</p>}
          </div>

          {(sendError || composerError) && (
            <p className="text-[10px] text-red-600" role="alert">{composerError || sendError}</p>
          )}
          {stickerPickerOpen && (
            <div className="grid grid-cols-4 gap-2 rounded-xl border border-gray-100 bg-white p-2 shadow-sm" aria-label="Stickers disponibles">
              {ORDER_CHAT_STICKERS.map((sticker) => (
                <button key={sticker} type="button" onClick={() => sendSticker(sticker)} aria-label={`Enviar sticker ${sticker.replace(/\D/g, '')}`} className="flex h-14 items-center justify-center rounded-lg hover:bg-gray-50">
                  <img src={`/${sticker}`} alt="" className="h-12 w-12 object-contain" />
                </button>
              ))}
            </div>
          )}

          <form onSubmit={sendText} className="flex min-h-[54px] items-center gap-2 rounded-full border border-[#eee9e2] bg-white px-3 shadow-sm">
            <input
              ref={fileInputRef}
              type="file"
              accept=".pdf,.txt,.doc,.docx,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              className="hidden"
              onChange={handleFileSelection}
            />
            <button type="button" onClick={() => fileInputRef.current?.click()} aria-label="Adjuntar documento" title="Adjuntar documento" className="flex h-9 w-8 shrink-0 items-center justify-center text-gray-800">
              <i data-lucide="paperclip" className="h-5 w-5"></i>
            </button>
            <button type="button" onClick={() => setStickerPickerOpen((open) => !open)} aria-label={stickerPickerOpen ? 'Cerrar stickers' : 'Elegir sticker'} aria-expanded={stickerPickerOpen} title="Stickers" className="flex h-9 w-8 shrink-0 items-center justify-center text-gray-800">
              <i data-lucide="smile" className="h-5 w-5"></i>
            </button>
            <input
              value={draft}
              onChange={(event) => setDraft(event.target.value.slice(0, 500))}
              maxLength={500}
              placeholder="Escribe un mensaje"
              aria-label={role === 'customer' ? 'Mensaje para el repartidor' : 'Mensaje para el cliente'}
              className="min-w-0 flex-1 bg-transparent py-3 text-xs text-gray-800 outline-none placeholder:text-gray-500"
            />
            {draft.trim() ? (
              <button type="submit" aria-label="Enviar mensaje" title="Enviar" className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#a90000] text-white">
                <i data-lucide="send" className="h-4 w-4"></i>
              </button>
            ) : (
              <button type="button" onClick={isRecording ? stopRecording : startRecording} aria-label={isRecording ? 'Detener y enviar audio' : 'Grabar audio'} title={isRecording ? 'Detener y enviar audio' : 'Grabar audio'} className={`flex h-9 w-8 shrink-0 items-center justify-center ${isRecording ? 'text-red-600' : 'text-gray-800'}`}>
                <i data-lucide={isRecording ? 'square' : 'mic'} className="h-5 w-5"></i>
              </button>
            )}
          </form>
          {isRecording && <p className="text-center text-[9px] font-semibold text-red-600" role="status">Grabando audio · máximo 1 minuto</p>}
        </div>
      );
    }

        previousTheme = localStorage.getItem('altoque_last_random_splash') || '';

      const availableThemes = SPLASH_THEME_VARIANTS.filter((theme) => theme !== previousTheme);

      useEffect(() => {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          console.warn('El navegador no admite el sonido de la promoción.');
          return undefined;
        }

        let audioContext;
        try {
          audioContext = new AudioContextClass();
        } catch (error) {
          console.error('No se pudo iniciar el sonido de la promoción.', error);
          return undefined;
        }

        let hasPlayed = false;
        const playWaterDrop = () => {
          if (hasPlayed || audioContext.state !== 'running') return;
          hasPlayed = true;

          const startTime = audioContext.currentTime;
          const oscillator = audioContext.createOscillator();
          const volume = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(1050, startTime);
          oscillator.frequency.exponentialRampToValueAtTime(190, startTime + 0.24);
          volume.gain.setValueAtTime(0.0001, startTime);
          volume.gain.exponentialRampToValueAtTime(0.22, startTime + 0.012);
          volume.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.34);
          oscillator.connect(volume);
          volume.connect(audioContext.destination);
          oscillator.start(startTime);
          oscillator.stop(startTime + 0.35);
        };

        const removeGestureListeners = () => {
          window.removeEventListener('pointerdown', resumeOnGesture);
          window.removeEventListener('keydown', resumeOnGesture);
        };
        const resumeOnGesture = () => {
          removeGestureListeners();
          audioContext.resume()
            .then(playWaterDrop)
            .catch((error) => console.warn('El navegador bloqueó el sonido de la promoción.', error));
        };

        if (audioContext.state === 'running') {
          playWaterDrop();
        } else {
          window.addEventListener('pointerdown', resumeOnGesture, { once: true });
          window.addEventListener('keydown', resumeOnGesture, { once: true });
        }

        return () => {
          removeGestureListeners();
          if (audioContext.state !== 'closed') audioContext.close();

    const coinMarkCanvases = new Set();
    let coinRendererFrame = null;
    let coinRendererAnimationFrame = 0;
    let coinRendererErrorReported = false;

    function drawSharedCoinFrame() {
      if (coinMarkCanvases.size === 0) {
        cancelAnimationFrame(coinRendererAnimationFrame);
        coinRendererAnimationFrame = 0;
        coinRendererFrame?.remove();
        coinRendererFrame = null;
        coinRendererErrorReported = false;
        return;
      }

      try {
        const rendererDocument = coinRendererFrame?.contentDocument;
        const source = rendererDocument?.querySelector('canvas');
        const rendererReady = rendererDocument?.querySelector('#loading')?.hidden;
        if (rendererReady && source?.width && source?.height) {
          coinMarkCanvases.forEach((canvas) => {
            const width = Math.max(1, Math.round(canvas.clientWidth * (window.devicePixelRatio || 1)));
            const height = Math.max(1, Math.round(canvas.clientHeight * (window.devicePixelRatio || 1)));
            if (canvas.width !== width || canvas.height !== height) {
              canvas.width = width;
              canvas.height = height;
            }
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, width, height);
            context.drawImage(source, 0, 0, width, height);
            canvas.style.visibility = 'visible';
          });
          coinRendererErrorReported = false;
        }
      } catch (error) {
        if (!coinRendererErrorReported) {
          console.error('No se pudo actualizar la moneda 3D compartida.', error);
          coinRendererErrorReported = true;
        }
      }

      coinRendererAnimationFrame = requestAnimationFrame(drawSharedCoinFrame);
    }

    function registerCoinMarkCanvas(canvas) {
      if (!coinRendererFrame) {
        coinRendererFrame = document.createElement('iframe');
        coinRendererFrame.src = './Moneda%20Al%20Toque.html?coinEmbed=1';
        coinRendererFrame.title = 'Renderizador compartido de moneda 3D';
        coinRendererFrame.tabIndex = -1;
        coinRendererFrame.setAttribute('aria-hidden', 'true');
        Object.assign(coinRendererFrame.style, {
          position: 'fixed',
          left: '-10000px',
          top: '0',
          width: '128px',
          height: '128px',
          border: '0',
          pointerEvents: 'none'
        });
        document.body.appendChild(coinRendererFrame);
      }

      coinMarkCanvases.add(canvas);
      if (!coinRendererAnimationFrame) {
        coinRendererAnimationFrame = requestAnimationFrame(drawSharedCoinFrame);
      }

      return () => {
        coinMarkCanvases.delete(canvas);
        if (coinMarkCanvases.size === 0) drawSharedCoinFrame();
      };
    }

    function AlToqueCoinMark({ sizeClass }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return undefined;
        return registerCoinMarkCanvas(canvasRef.current);

        <span className={`relative block ${sizeClass}`} aria-hidden="true">
          <canvas
            ref={canvasRef}
            className="pointer-events-none absolute inset-0 h-full w-full"
            style={{ visibility: 'hidden' }}
          />
        </span>
      );
    }

              className="gorritos-tier-card gorritos-scene flex w-full items-center gap-3 rounded-[22px] p-3 text-left text-[#fffaf1] shadow-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#f5d36e]"
            >
              <span className="relative flex h-[68px] w-[68px] shrink-0 items-center justify-center rounded-full bg-[#651326]/70 shadow-[0_0_18px_rgba(245,211,110,0.35)]">
                <AlToqueCoinMark sizeClass="h-14 w-14" />
                <span className="absolute -bottom-1 rounded-full border border-[#7d1025] bg-[#f5d36e] px-2 py-0.5 text-[8px] font-extrabold text-[#4b1420]">VIP</span>

              <span className="min-w-0 flex-1">
                <span className="flex flex-wrap items-center gap-1.5">
                  <span className="font-title text-lg font-extrabold text-[#f5d36e]">VIP Gorritos</span>
                  <span className="rounded-full bg-[#f5d36e] px-2 py-0.5 text-[8px] font-extrabold text-[#4b1420]">{isGorritosVip ? 'Desbloqueado' : '20 Gorritos o 20 compras'}</span>
