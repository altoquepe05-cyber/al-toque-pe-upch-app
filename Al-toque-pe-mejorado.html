          window.clearInterval(interval);
          window.removeEventListener('storage', refreshMessages);
        };
      }, [orderConfirmed, liveOrderId, isRiderChatOpen, orderStatus]);

      const sendRiderChatMessage = async (message) => {
        if ((!message.text.trim() && !['sticker', 'audio', 'document'].includes(message.type)) || !liveOrderId) return;
        try {
          const storageKey = `altoque_order_chat_${liveOrderId}`;
          let messages;
          if (liveOrderId.startsWith('UPCH-')) {
            const response = await fetch(`/api/orders/${encodeURIComponent(liveOrderId)}/chat`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ role: 'customer', message })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || `Error ${response.status}`);
            messages = payload.messages;
          } else {
            const existingMessages = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (!Array.isArray(existingMessages)) throw new Error('El historial del chat tiene un formato inválido.');
            messages = [...existingMessages, message].slice(-100);
            localStorage.setItem(storageKey, JSON.stringify(messages));
          }
          if (!Array.isArray(messages)) throw new Error('El servidor devolvió un historial de chat inválido.');
          setRiderChatMessages((current) => liveOrderId.startsWith('UPCH-')
            ? mergeOrderChatMessages(current, messages)
            : messages);
          if (liveOrderId.startsWith('UPCH-') && messages.length > 0) {
            riderChatCursorRef.current = Math.max(riderChatCursorRef.current, ...messages.map((item) => item.createdAt));
          }
          setRiderChatError('');
        } catch (error) {
          console.error('No se pudo enviar el mensaje al motorizado:', error);
          setRiderChatError(`No se pudo enviar el mensaje: ${error.message}`);
          throw error;
        }
      };

      useEffect(() => {
        if (deliveryPhase !== 'tracking') {
          return;
        }

        const startTime = deliveryStartedAtRef.current || Date.now() - deliveryElapsed;
        let timer = null;
        const updateTracking = () => {
          const elapsed = Math.min(Date.now() - startTime, deliveryDuration);
          setDeliveryElapsed(elapsed);

          if (elapsed >= deliveryDuration) {
            clearInterval(timer);
            return false;
          }

          return true;
        };

        if (updateTracking()) {
          timer = setInterval(updateTracking, 1000);
        }

        return () => clearInterval(timer);
      }, [deliveryPhase]);

      const isArrivalVisible = orderStatus === 'delivered' || deliveryPhase === 'arrived';
      const shouldShowArrivalVideo = isArrivalVisible && ['Moto', 'Bicicleta', 'Caminando'].includes(assignedRider?.vehicle);
      const arrivalVideoSrc = assignedRider?.vehicle === 'Bicicleta'
        ? '/pedido-recibido-bicicleta.mp4'
        : assignedRider?.vehicle === 'Caminando'
          ? '/pedido-recibido-caminando.mp4'
          : '/pedido-recibido.mp4';
      useEffect(() => {
        const video = arrivalVideoRef.current;
        if (!shouldShowArrivalVideo || !video) return undefined;
        let lastPlayAttemptAt = 0;
        const ensurePlayback = () => {
          if (document.hidden || !video.isConnected || (!video.paused && !video.ended)) return;
          if (Date.now() - lastPlayAttemptAt < 1000) return;
          lastPlayAttemptAt = Date.now();
          if (video.ended) video.currentTime = 0;
          video.play().catch((error) => {
            console.error('No se pudo mantener en reproducción la animación de entrega:', error);
          });
        };
        const handleVisibilityChange = () => {
          if (!document.hidden) ensurePlayback();
        };
        const playbackTimer = window.setInterval(ensurePlayback, 1000);
        document.addEventListener('visibilitychange', handleVisibilityChange);
        ensurePlayback();
        return () => {
          window.clearInterval(playbackTimer);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
        };
      }, [shouldShowArrivalVideo]);

      useEffect(() => {
        if (
          orderStatus !== 'delivered'
          || !liveOrderId
          || !Number.isFinite(orderPickedUpAt)
          || !Number.isFinite(orderDeliveredAt)
          || orderDeliveredAt - orderPickedUpAt < deliveryDuration
          || lateDeliveryRewardProcessedRef.current.has(liveOrderId)
        ) return;

        lateDeliveryRewardProcessedRef.current.add(liveOrderId);
        const rewardMovementId = `late-delivery-${liveOrderId}`;
        if ((Array.isArray(profile.gorritosActivity) ? profile.gorritosActivity : []).some((movement) => movement.id === rewardMovementId)) {
          return;
        }

        setProfile((current) => {
          const activity = Array.isArray(current.gorritosActivity) ? current.gorritosActivity : [];
          if (activity.some((movement) => movement.id === rewardMovementId)) return current;
          const nextBalance = Math.max(0, Number(current.gorritos) || 0) + 1;
          return {
            ...current,
            gorritos: nextBalance,
            gorritosVip: current.gorritosVip === true
              || nextBalance >= 20
              || Number(current.gorritosPurchaseCount) >= 20,
            gorritosActivity: [...activity, {
              id: rewardMovementId,
              orderId: liveOrderId,
              label: 'Recompensa por demora',
              detail: `Pedido ${liveOrderId} entregado después de 5 minutos desde el recojo`,
              points: 1,
              createdAt: orderDeliveredAt
            }]
          };
        });
        setLateDeliveryRewardOrderId(liveOrderId);
      }, [deliveryDuration, liveOrderId, orderDeliveredAt, orderPickedUpAt, orderStatus, profile.gorritosActivity, setProfile]);

      const gorritosItems = cart.filter((item) => item.gorritosRedemption);
      const isGorritosOrder = cart.length > 0 && gorritosItems.length === cart.length;
      const hasInvalidGorritosMix = gorritosItems.length > 0 && !isGorritosOrder;
      const gorritosCost = isGorritosOrder
        ? gorritosItems.reduce((sum, item) => sum + (GORRITOS_REDEMPTION_COSTS[item.id] || 0) * item.quantity, 0)
        : 0;
      const subtotal = cart.reduce((acc, item) => acc + item.price * item.quantity, 0);
      const commission = cart.length > 0 && !hasBembosDemoItems && !isGorritosOrder ? 1.0 : 0;
      const total = subtotal + commission;
      const orderPaymentMethod = isGorritosOrder ? 'gorritos' : paymentMethod;

      const publishOrderToRiderQueue = async (isDemo = false) => {
        const orderDetails = {
          customerProfileId,
          customer: profile.nickname || 'Cliente UPCH',
          items: cart.map((item) => ({
            id: item.id,
            name: item.name,
            quantity: item.quantity,
            price: item.price,
            ...(item.description ? { description: item.description } : {}),
            ...(item.brand === 'Starbucks' ? { image: item.image } : {})
          })),
          pickupPoint,
          paymentMethod: orderPaymentMethod,
          ...(isGorritosOrder ? { gorritosSpent: gorritosCost } : {}),
          ...(isDemo ? { isDemo: true, storeName: 'Bembos' } : {})
        };
        const fingerprint = JSON.stringify(orderDetails);
        if (orderSubmissionKeyRef.current.fingerprint !== fingerprint) {
          orderSubmissionKeyRef.current = {
            fingerprint,
            key: window.crypto?.randomUUID
              ? window.crypto.randomUUID()
              : `altoque-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`
          };
        }

        if (window.location.protocol === 'file:') {
          throw new Error('Abre la aplicación desde http://localhost:4173/ para registrar el pedido y compartirlo con repartidores.');
        }
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            idempotencyKey: orderSubmissionKeyRef.current.key,
            ...orderDetails
          })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 404 || response.status === 405) {
            throw new Error('El servidor activo no tiene la cola compartida. Reinicia server.mjs y vuelve a abrir la aplicación desde http://localhost:4173/.');
          }
          if (response.status === 403) {
            throw new Error('El servidor rechazó el origen. Abre las dos aplicaciones desde la misma URL del servidor; no uses file://, localhost y 127.0.0.1 mezclados.');
          }
          throw new Error(payload.error || `El servidor rechazó el pedido (${response.status}).`);
        }
        if (!payload.order?.id) {
          throw new Error('El servidor no devolvió el identificador del pedido.');
        }
        setLiveOrderId(payload.order.id);
        setOrderStatus(payload.order.status || 'available');
        setOrderCreatedAt(payload.order.createdAt);
        setCancellationClock(Date.now());
        setCancelOrderError('');
        return payload.order;
      };

      const cancelOrder = async () => {
        if (!liveOrderId || !canCancelOrder || isCancellingOrder) return;
        setIsCancellingOrder(true);
        setCancelOrderError('');
        try {
          const response = await fetch(`/api/orders/${encodeURIComponent(liveOrderId)}/action`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'cancel' })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            if (response.status === 409) {
              const orderResponse = await fetch(`/api/orders/${encodeURIComponent(liveOrderId)}`, { cache: 'no-store' });
              const orderPayload = await orderResponse.json().catch(() => ({}));
              if (!orderResponse.ok) throw new Error(orderPayload.error || `Error ${orderResponse.status}`);
              setOrderStatus(orderPayload.order.status);
              if (Number.isFinite(orderPayload.order.createdAt)) setOrderCreatedAt(orderPayload.order.createdAt);
              setCancellationClock(Date.now());
            }
            throw new Error(payload.error || `No se pudo cancelar el pedido (${response.status}).`);
          }
          if (payload.order?.status !== 'cancelled') throw new Error('El servidor no confirmó la cancelación del pedido.');
          setOrderStatus('cancelled');
          setAssignedRider(null);
          setDeliveryPhase('idle');
          clearDeliveryProgress();
        } catch (error) {
          setCancelOrderError(error.message || 'No se pudo cancelar el pedido. Inténtalo de nuevo.');
        } finally {
          setIsCancellingOrder(false);
        }
      };

      const completeOrderConfirmation = async () => {
        setOrderSubmitError('');
        setOrderSubmitNotice('');
        setIsSubmittingOrder(true);
        try {
          if (isBembosDemoOnly) {
            await publishOrderToRiderQueue(true);
            setOrderConfirmed(true);
            setDeliveryPhase('idle');
            return;
          }
          const confirmedOrder = await publishOrderToRiderQueue();
          onOrderRegistered(confirmedOrder);
          setOrderConfirmed(true);
          setDeliveryPhase('idle');
        } catch (error) {
          setOrderSubmitError(`No se pudo enviar el pedido a repartidores: ${error.message}`);
        } finally {
          setIsSubmittingOrder(false);
        }
      };

      const handleConfirmOrder = () => {
        if (isSubmittingOrder || isRedirecting) return;
        if (hasMixedProviders) {
          setOrderSubmitError('No se pueden combinar promociones Bembos y productos Al Toque en un mismo pedido. Elimina una de las dos opciones.');
          return;
        }
        if (hasInvalidGorritosMix) {
          setOrderSubmitError('Los canjes con Gorritos deben ir en un pedido separado.');
          return;
        }
        if (isGorritosOrder) {
          const hasOnlyEligibleProducts = cart.every((item) =>
            GORRITOS_REDEMPTION_COSTS[item.id] > 0
            && item.price === 0
            && item.gorritosCost === GORRITOS_REDEMPTION_COSTS[item.id]
          );
          if (!profile.affiliated || !hasOnlyEligibleProducts || gorritosCost < 1) {
            setOrderSubmitError('No se pudo validar el canje. Vuelve a elegir el producto desde Gorritos.');
            return;
          }
          if ((Number(profile.gorritos) || 0) < gorritosCost) {
            setOrderSubmitError('No tienes suficientes Gorritos para confirmar este pedido.');
            return;
          }
          completeOrderConfirmation();
          return;
        }
        if (isBembosDemoOnly) {
          completeOrderConfirmation();
          return;
        }
        let url = '';

        if (orderPaymentMethod === 'yape') {
          url = 'https://www.yape.com.pe/';
        } else if (orderPaymentMethod === 'plin') {
          url = 'https://www.interbank.pe/promociones/detalles/plin';
        } else if (orderPaymentMethod === 'tarjeta') {
          url = 'https://www.niubiz.com.pe/';
        }

        if (url) {
          setOrderSubmitError('');
          setIsRedirecting(true);
          setRedirectUrl(url);
          setTimeout(async () => {
            window.open(url, '_blank', 'noopener,noreferrer');
            setIsRedirecting(false);
            await completeOrderConfirmation();
          }, 2000);
          return;
        }

        completeOrderConfirmation();
      };

      const renderDeliveryTracking = () => (
        <>
        <div className="space-y-4 py-2">
          <div className="flex items-center justify-between">
            <div className="text-left flex-1">
              <h2 className="font-title text-xl font-bold leading-tight">{deliveryStages[currentDeliveryStage].title}</h2>
              {deliveryStages[currentDeliveryStage].description && (
                <p className="mt-1 text-xs text-gray-500">{deliveryStages[currentDeliveryStage].description}</p>
              )}
            </div>
            <div className="ml-2 shrink-0 rounded-2xl bg-[#fff3d1] px-3 py-2 text-center">
              <span className="block text-[9px] font-bold uppercase tracking-wider text-[#94631d]">{isBembosDemoOrder ? 'Recorrido' : 'Tiempo'}</span>
              <span className="text-sm font-extrabold text-[#2B1718]">{remainingMinutes > 0 ? `${remainingMinutes} min` : isBembosDemoOrder ? 'Fin' : '¡Listo!'}</span>
            </div>
          </div>

          <div className="delivery-progress-card">
            <div className="flex items-center justify-between gap-2">
              <p className="text-xs font-bold text-dark">{deliveryStages[currentDeliveryStage].label}</p>
              <p className="text-[10px] font-semibold text-gray-500">{isBembosDemoOrder ? 'Etapa' : 'Minuto'} {currentDeliveryStage + 1} de 5</p>
            </div>
            <div
              className="delivery-stage-track mt-2"
              role="progressbar"
              aria-label="Avance del pedido"
              aria-valuemin="0"
              aria-valuemax="5"
              aria-valuenow={Math.min(currentDeliveryStage + stageProgress / 100, 5)}
            >
              {deliveryStages.map((stage, index) => (
                <div
                  key={stage.label}
                  className={`delivery-stage-segment ${index < currentDeliveryStage ? 'is-complete' : ''} ${index === currentDeliveryStage ? 'is-current' : ''}`}
                  style={index === currentDeliveryStage ? { '--stage-progress': `${Math.max(stageProgress, 8)}%` } : undefined}
                >
                  <span></span>
                </div>
              ))}
            </div>
            <div className="delivery-stage-list">
              {deliveryStages.map((stage, index) => (
                <div
                  key={stage.label}
                  className={`delivery-stage-item ${index < currentDeliveryStage ? 'is-complete' : ''} ${index === currentDeliveryStage ? 'is-active' : ''}`}
                  aria-current={index === currentDeliveryStage ? 'step' : undefined}
                >
                  <span className="delivery-stage-icon" aria-hidden="true">
                    {index < currentDeliveryStage ? '✓' : ['✓', '🍳', '🛍️', '🛵', '📍'][index]}
                  </span>
                  <span className="delivery-stage-label">{stage.label}</span>
                  <span className="delivery-stage-minute">Min {index + 1}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="delivery-card">
            <strong>{`RECOJO: ${pickupPoint}`}</strong>
            <span>
              {`Universidad Peruana Cayetano Heredia · Pedido #${liveOrderId || 'UPCH-8492'}`}
            </span>
          </div>

          <LiveRouteMapErrorBoundary
            className="delivery-map"
            label={`Ruta en vivo del repartidor para el pedido ${liveOrderId || ''}`}
          >
            <LiveRouteMap
              location={assignedRider?.vehicle === 'Caminando' ? null : riderLocation}
              walkingStartedAt={deliveryPhase === 'tracking' && assignedRider?.vehicle === 'Caminando'
                ? deliveryStartedAtRef.current
                : null}
              className="delivery-map"
              label={`Ruta en vivo del repartidor para el pedido ${liveOrderId || ''}`}
            />
          </LiveRouteMapErrorBoundary>

          <div className="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
            <div className="flex justify-between items-center text-[11px] font-bold uppercase tracking-[0.08em] text-gray-500">
              <span>Recojo</span>
              <span>Destino</span>
            </div>
            <div className="mt-3 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 rounded-full bg-[#ff7a1a] text-white flex items-center justify-center font-bold text-[10px]">◉</div>
                <div>
                  <p className="text-[11px] text-gray-500">{isBembosDemoOrder ? 'Bembos' : 'Lobo de Otani'}</p>
                  <p className="text-[10px] font-bold text-dark">{isBembosDemoOrder ? 'Punto de recojo' : 'Al toque PE'}</p>
                </div>
              </div>
              <div className="w-10 h-px bg-gray-300"></div>
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 rounded-full bg-[#b5202d] text-white flex items-center justify-center font-bold text-[10px]">◉</div>
                <div>
                  <p className="text-[11px] text-gray-500">Entrega</p>
                  <p className="text-[10px] font-bold text-dark">UPCH</p>
                </div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2 py-2">
            <button
              type="button"
              onClick={() => voiceCall.startCall()}
              disabled={!assignedRider || ['incoming', 'ringing', 'connecting', 'connected'].includes(voiceCall.call.status)}
              title={!assignedRider ? 'La llamada estará disponible cuando el motorizado acepte el pedido.' : 'Iniciar llamada de voz dentro de la app'}
              aria-label="Llamar al motorizado dentro de la app"
              className={`flex flex-col items-center gap-1.5 py-1 text-center text-[10px] font-bold ${assignedRider ? 'text-[#a90000]' : 'text-gray-500'}`}
            >
              <span className={`flex h-14 w-14 items-center justify-center rounded-full border-2 bg-white shadow-sm ${assignedRider ? 'border-[#a90000]' : 'border-gray-300'}`}>
                <i data-lucide="phone" className="h-6 w-6"></i>
              </span>
              Llamar al motorizado
            </button>
            <div className="relative flex flex-col items-center">
              {hasNewRiderMessage && !isRiderChatOpen && (
                <div
                  className="new-rider-message absolute bottom-full right-0 z-20 mb-3 flex w-56 items-center gap-2 rounded-2xl px-3 py-2.5 text-left text-xs font-bold text-white"
                  role="status"
                  aria-live="polite"
                >
                  <img
                    key={riderChatMessages.filter((message) => message.sender === 'rider').length % APP_STICKER_COUNT}
                    src={`/${getStickerAssetName((riderChatMessages.filter((message) => message.sender === 'rider').length % APP_STICKER_COUNT) + 1)}`}
                    alt=""
                    className="new-rider-message-sticker h-10 w-10 shrink-0 object-contain"
                  />
                  <span className="flex-1">¡Tienes un nuevo mensaje!</span>
                  <span className="absolute -bottom-1.5 right-7 h-3 w-3 rotate-45 rounded-sm bg-[#a90000]" aria-hidden="true"></span>
                </div>
              )}
              <button
                type="button"
                onClick={() => {
                  setHasNewRiderMessage(false);
                  setIsRiderChatOpen((open) => !open);
                }}
                className="flex flex-col items-center gap-1.5 py-1 text-center text-[10px] font-bold text-[#a90000]"
                aria-expanded={isRiderChatOpen}
                aria-label={isRiderChatOpen ? 'Cerrar chat con repartidor' : 'Abrir chat con repartidor'}
              >
                <span className="flex h-14 w-14 items-center justify-center rounded-full border-2 border-[#a90000] bg-white shadow-sm">
                  <i data-lucide="message-circle" className="h-6 w-6"></i>
                </span>
                Chat con repartidor
              </button>
            </div>
          </div>

        </div>
        {isRiderChatOpen && ReactDOM.createPortal(
          <div
            className="absolute inset-0 z-[100] flex items-center justify-center bg-black/45 p-5"
            onMouseDown={(event) => {
              if (event.target === event.currentTarget) {
                setIsRiderChatOpen(false);
              }
            }}
          >
            <section className="relative w-full max-w-sm space-y-3 rounded-2xl bg-white p-4 shadow-2xl" role="dialog" aria-modal="true" aria-label="Chat con el repartidor">
              <button type="button" onClick={() => setIsRiderChatOpen(false)} aria-label="Cerrar chat" className="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100">
                <i data-lucide="x" className="h-5 w-5"></i>
              </button>
              <h3 className="pr-10 text-xs font-bold">Chat con {assignedRider?.name || 'el repartidor'}</h3>
              <OrderChatPanel
                messages={riderChatMessages}
                role="customer"
                sendError={riderChatError}
                onSend={sendRiderChatMessage}
                emptyMessage="Envía un mensaje al repartidor."
              />
            </section>
          </div>,
          document.getElementById('root')
        )}
        <VoiceCallDialog controller={voiceCall} contactName={assignedRider?.name || 'el motorizado'} />
        </>
      );

      const renderCancellationPolicyDialog = () => isCancellationPolicyOpen && ReactDOM.createPortal(
        <div
          className="absolute inset-0 z-[160] flex items-center justify-center bg-black/55"
          style={{
            paddingTop: 'max(12px, env(safe-area-inset-top))',
            paddingRight: 'max(12px, env(safe-area-inset-right))',
            paddingBottom: 'max(12px, env(safe-area-inset-bottom))',
            paddingLeft: 'max(12px, env(safe-area-inset-left))'
          }}
          onMouseDown={(event) => {
            if (event.target === event.currentTarget) setIsCancellationPolicyOpen(false);
          }}
        >
          <section
            className="flex h-full max-h-full min-h-0 w-full max-w-[430px] flex-1 flex-col overflow-hidden rounded-2xl bg-white shadow-2xl"
            role="dialog"
            aria-modal="true"
            aria-labelledby="cancellation-policy-title"
          >
            <header className="flex min-h-14 shrink-0 items-center justify-between gap-3 border-b border-gray-100 px-4">
              <h2 id="cancellation-policy-title" className="text-xs font-bold text-dark">
                Política de cancelación y reembolso
              </h2>
              <button
                type="button"
                onClick={() => setIsCancellationPolicyOpen(false)}
                aria-label="Cerrar política de cancelación y reembolso"
                className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-gray-600 hover:bg-gray-100"
              >
                <i data-lucide="x" className="h-5 w-5"></i>
              </button>
            </header>
            <div className="flex shrink-0 items-center justify-center gap-3 border-b border-gray-100 bg-white px-3 py-2" aria-label="Controles de zoom del documento">
              <button
                type="button"
                onClick={() => setCancellationPolicyZoom((zoom) => Math.max(1, Math.round((zoom - 0.25) * 100) / 100))}
                disabled={cancellationPolicyZoom <= 1}
                aria-label="Alejar el documento"
                className="flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 text-lg font-bold text-dark disabled:cursor-not-allowed disabled:opacity-40"
              >
                −
              </button>
              <span className="min-w-12 text-center text-xs font-semibold text-gray-600" aria-live="polite">
                {Math.round(cancellationPolicyZoom * 100)}%
              </span>
              <button
                type="button"
                onClick={() => setCancellationPolicyZoom((zoom) => Math.min(3, Math.round((zoom + 0.25) * 100) / 100))}
                disabled={cancellationPolicyZoom >= 3}
                aria-label="Acercar el documento"
                className="flex h-9 w-9 items-center justify-center rounded-full border border-gray-200 text-lg font-bold text-dark disabled:cursor-not-allowed disabled:opacity-40"
              >
                +
              </button>
              <button
                type="button"
                onClick={() => setCancellationPolicyZoom(1)}
                disabled={cancellationPolicyZoom === 1}
                className="rounded-full px-3 py-2 text-[10px] font-semibold text-[#a90000] underline disabled:cursor-not-allowed disabled:opacity-40"
              >
                Ajustar
              </button>
            </div>
            <div
              ref={cancellationPolicyScrollRef}
              className="min-h-0 flex-1 overflow-auto overscroll-contain bg-gray-100 p-3"
              aria-busy={cancellationPolicyPdfStatus === 'loading'}
            >
              {cancellationPolicyPdfStatus === 'loading' && (
                <p className="py-6 text-center text-xs text-gray-500" role="status">Cargando la política…</p>
              )}
              {cancellationPolicyPdfStatus === 'error' && (
                <div className="space-y-3 py-6 text-center" role="alert">
                  <p className="text-xs text-red-700">No se pudo mostrar el documento.</p>
                  <a
                    href="/politica-cancelacion-reembolso.pdf"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="inline-block text-xs font-semibold text-[#a90000] underline"
                  >
                    Abrir el PDF en otra ventana
                  </a>
                </div>
              )}
              <div
                ref={cancellationPolicyPagesRef}
                className="mx-auto"
                style={{ width: `${cancellationPolicyZoom * 100}%` }}
                aria-label="Páginas de la política de cancelación y reembolso"
              />
            </div>
          </section>
        </div>,
        document.getElementById('root')
      );

      const renderRiderProfileCard = () => (
        <section className="w-full rounded-2xl border border-green-100 bg-white p-4 text-left shadow-sm" aria-label="Perfil del motorizado">
          <div className="flex items-center gap-3">
            <div className="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-full bg-[#fff2df] text-lg">
              {assignedRider?.photo
                ? <img src={assignedRider.photo} alt={`Foto de ${assignedRider.name}`} className="h-full w-full object-cover" />
                : assignedRider?.vehicle === 'Bicicleta' ? '🚲' : assignedRider?.vehicle === 'Caminando' ? '🚶' : '🛵'}
            </div>
            <div className="min-w-0 flex-1">
              <p className="text-[9px] font-bold uppercase tracking-wider text-gray-500">Tu motorizado</p>
              <h3 className="truncate text-sm font-bold text-dark">
                {assignedRider?.name || 'Repartidor UPCH'}
              </h3>
              {!assignedRider && <p className="mt-0.5 text-[9px] text-gray-500">Repartidor general ha aceptado el pedido.</p>}
              {assignedRider && (
                <>
                  {assignedRider.vehicle && <p className="mt-0.5 text-[10px] text-gray-500">{assignedRider.vehicle}</p>}
                  <p className="mt-0.5 text-[10px] text-gray-500">
                    {assignedRider.reviewCount > 0
                      ? `★ ${assignedRider.ratingAverage.toFixed(1)} · ${assignedRider.reviewCount} ${assignedRider.reviewCount === 1 ? 'opinión' : 'opiniones'}`
                      : assignedRider.localOnly ? 'Opiniones pendientes de sincronizar' : 'Aún no tiene calificaciones'}
                  </p>
                </>
              )}
            </div>
          </div>
          <div className="mt-3 flex items-center gap-2 rounded-xl border border-green-200 bg-green-50 px-3 py-2 text-left text-green-800" aria-label="Distintivo informativo de capacitación de Al Toque">
            <svg viewBox="0 0 24 24" className="h-5 w-5 shrink-0" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
              <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z" />
              <path d="m9 12 2 2 4-4" />
            </svg>
            <span><span className="block text-[10px] font-bold">Capacitación Al Toque</span><span className="block text-[9px] text-green-700">Distintivo informativo; no valida una certificación oficial.</span></span>
          </div>
        </section>
      );

      const submitRating = async () => {
        if (!liveOrderId || rating < 1 || !ratingComment.trim() || isSubmittingRating) return;
        setIsSubmittingRating(true);
        setRatingError('');
        try {
          if (!isBembosDemoOrder) {
            const response = await fetch(`/api/orders/${encodeURIComponent(liveOrderId)}/review`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ rating, comment: ratingComment.trim() })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              if (response.status === 404 || response.status === 405) {
                setRatingError('');
              } else {
                throw new Error(payload.error || `No se pudo guardar la calificación (${response.status}).`);
              }
            }
          }
          const review = { rating, comment: ratingComment.trim(), customer: profile.nickname || 'Cliente UPCH', orderId: liveOrderId, createdAt: Date.now() };
          const reviewKey = isBembosDemoOrder ? 'altoque_bembos_demo_reviews' : 'altoque_rider_reviews';
          const savedReviews = JSON.parse(localStorage.getItem(reviewKey) || '[]');
          localStorage.setItem(reviewKey, JSON.stringify([review, ...savedReviews.filter((item) => item.orderId !== liveOrderId)]));
          setRatingSubmitted(true);
        } catch (error) {
          setRatingError(error.message || 'No se pudo guardar la calificación.');
        } finally {
          setIsSubmittingRating(false);
        }
      };

      const renderArrival = () => (
        <div className="relative flex flex-col items-center justify-center h-full text-center space-y-5 py-8 overflow-hidden">
          <div className="success-confetti absolute inset-0">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>

          {shouldShowArrivalVideo && (
            <video
              ref={arrivalVideoRef}
              src={arrivalVideoSrc}
              autoPlay
              muted
              playsInline
              preload="auto"
              aria-label="Animación de la mascota celebrando la entrega"
              className="arrival-mascot z-10"
              onEnded={(event) => {
                const video = event.currentTarget;
                video.currentTime = 0;
                video.play().catch((error) => {
                  console.error('No se pudo reiniciar la animación de entrega:', error);
                });
              }}
            />
          )}

          <div className="space-y-2 z-10">
            <h2 className="font-title text-3xl font-bold text-dark">
              {isBembosDemoOrder ? 'Recorrido finalizado' : '¡Pedido recibido!'}
            </h2>
            {!isBembosDemoOrder && <p className="font-title text-xl font-bold text-brand">¡Gracias por tu pedido!</p>}
            {!isBembosDemoOrder && (
              <p className="text-xs text-gray-500 max-w-[250px]">
                El repartidor confirmó la entrega. Puedes recoger tu pedido en {pickupPoint}.
              </p>
            )}
          </div>

          {!isBembosDemoOrder && renderRiderProfileCard()}

          <div className="z-10 space-y-2">
            <p className="text-xs font-bold text-dark">{isBembosDemoOrder ? 'Deja un comentario' : 'Califica tu pedido'}</p>
            <div className="flex justify-center gap-1" role="radiogroup" aria-label="Calificación del pedido">
              {[1, 2, 3, 4, 5].map((star) => (
                <button
                  key={star}
                  type="button"
                  onClick={() => {
                    setRating(star);
                    setRatingSubmitted(false);
                  }}
                  className={`rating-star ${star <= rating ? 'selected' : ''}`}
                  aria-label={`${star} estrella${star === 1 ? '' : 's'}`}
                  aria-checked={star === rating}
                  role="radio"
                >
                  ★
                </button>
              ))}
            </div>
            {rating > 0 && !ratingSubmitted && (
              <>
                <label htmlFor="rider-review-comment" className="block text-left text-[10px] font-semibold text-gray-600">
                  {isBembosDemoOrder ? 'Escribe un comentario' : 'Cuéntanos cómo fue la atención'}
                </label>
                <textarea
                  id="rider-review-comment"
                  value={ratingComment}
                  onChange={(event) => setRatingComment(event.target.value.slice(0, 500))}
                  maxLength={500}
                  rows={3}
                  placeholder={isBembosDemoOrder ? 'Escribe tu comentario aquí…' : 'Escribe un comentario para el perfil del motorizado…'}
                  className="w-full resize-none rounded-xl border border-gray-200 p-3 text-left text-[11px] focus:border-brand focus:outline-none"
                  required
                />
                <p className="text-right text-[9px] text-gray-500">{ratingComment.length}/500</p>
                {ratingError && <p className="text-[10px] text-red-600" role="alert">{ratingError}</p>}
                <button
                  type="button"
                  onClick={submitRating}
                  disabled={!ratingComment.trim() || isSubmittingRating}
                  className="bg-brand text-white font-bold px-4 py-2 rounded-xl text-[11px] disabled:cursor-not-allowed disabled:opacity-50"
                >
                  {isSubmittingRating ? 'Enviando…' : 'Enviar calificación'}
                </button>
              </>
            )}
            {ratingSubmitted && (
              <p className="text-[11px] font-bold text-green-600" role="status">
                {isBembosDemoOrder ? '¡Gracias! El comentario quedó guardado en este dispositivo.' : '¡Gracias! Tu comentario ya aparece en el perfil del motorizado.'}
              </p>
            )}
          </div>

          <button
            onClick={() => {
              clearCart();
              clearDeliveryProgress();
              setDeliveryPhase('idle');
              setOrderConfirmed(false);
              setLiveOrderId('');
              onNavigate('home');
            }}
            className="bg-dark text-white font-bold px-6 py-3 rounded-2xl text-xs z-10"
          >
            Volver al inicio
          </button>
          {lateDeliveryRewardOrderId && (
            <div className="fixed inset-0 z-[140] flex items-center justify-center bg-black/60 p-5">
              <section
                role="dialog"
                aria-modal="true"
                aria-labelledby="late-delivery-reward-title"
                className="w-full max-w-sm rounded-[28px] bg-white px-6 py-7 text-center shadow-2xl"
              >
                <div className="mx-auto mb-2 flex h-32 w-32 items-center justify-center">
                  <AlToqueCoinMark sizeClass="h-28 w-28" />
                </div>
                <h2 id="late-delivery-reward-title" className="font-title text-2xl font-bold text-dark">
                  Recibiste un gorrito
                </h2>
                <p className="mx-auto mt-3 max-w-xs text-sm leading-relaxed text-gray-600">
                  ¡Gracias por esperarnos, te recompensamos por tu espera!
                </p>
                <p className="mt-3 text-xs font-bold text-brand" role="status">Sumamos 1 Gorrito a tu saldo.</p>
                <button
                  type="button"
                  autoFocus
                  onClick={() => setLateDeliveryRewardOrderId('')}
                  className="mt-6 w-full rounded-2xl bg-brand px-5 py-3 text-sm font-bold text-white transition hover:brightness-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
                >
                  ¡Gracias!
                </button>
              </section>
            </div>
          )}
        </div>
      );

      if (isRedirecting) {
        return (
          <div className="flex flex-col items-center justify-center h-full text-center space-y-4 py-12">
            <div className="w-16 h-16 border-4 border-brand border-t-transparent rounded-full animate-spin"></div>
            <h2 className="font-title text-xl font-bold">Redirigiendo a la pasarela de pago...</h2>
            <p className="text-xs text-gray-500">
              Procesando tu pedido mediante <span className="font-bold uppercase text-brand">{paymentMethod}</span>.
            </p>
            <span className="text-[10px] text-gray-500 break-all px-4">{redirectUrl}</span>
          </div>
        );
      }

      if (orderConfirmed) {
        if (orderStatus === 'rejected') {
          return (
            <div className="flex min-h-full flex-col items-center justify-center space-y-4 py-10 text-center">
              <div className="flex h-20 w-20 items-center justify-center rounded-full bg-red-50 text-[#a90000]" aria-hidden="true">
                <i data-lucide="circle-x" className="h-10 w-10"></i>
              </div>
              <h2 className="font-title text-2xl font-bold">Tu pedido fue rechazado</h2>
              <p className="max-w-[280px] text-xs text-gray-500">El repartidor rechazó este pedido. Puedes volver al inicio y realizar otro.</p>
              <button
                type="button"
                onClick={() => {
                  clearDeliveryProgress();
                  setDeliveryPhase('idle');
                  setOrderConfirmed(false);
                  setLiveOrderId('');
                  onNavigate('home');
                }}
                className="rounded-2xl bg-dark px-6 py-3 text-xs font-bold text-white"
              >
                Volver al inicio
              </button>
              {renderCancellationPolicyDialog()}
            </div>
          );
        }
        if (orderStatus === 'not_found') {
          return (
            <div className="flex min-h-full flex-col items-center justify-center space-y-4 py-10 text-center">
              <h2 className="font-title text-2xl font-bold">No encontramos este pedido</h2>
              <p className="max-w-[280px] text-xs text-gray-500">El pedido ya no está disponible en el servidor y no se puede continuar siguiendo su estado.</p>
              <button
                type="button"
                onClick={() => {
                  clearDeliveryProgress();
                  setOrderConfirmed(false);
                  setLiveOrderId('');
                  onNavigate('home');
                }}
                className="rounded-2xl bg-dark px-6 py-3 text-xs font-bold text-white"
              >
                Volver al inicio
              </button>
              {renderCancellationPolicyDialog()}
            </div>
          );
        }
        if (orderStatus === 'cancelled') {
          return (
            <div className="flex min-h-full flex-col items-center justify-center space-y-4 py-10 text-center">
              <div className="flex h-20 w-20 items-center justify-center rounded-full bg-red-50 text-[#a90000]" aria-hidden="true">
                <i data-lucide="circle-x" className="h-10 w-10"></i>
              </div>
              <h2 className="font-title text-2xl font-bold">Pedido cancelado</h2>
              <p className="max-w-[280px] text-xs text-gray-500">El pedido se canceló y ya no aparece en la lista de repartidores.</p>
              <button
                type="button"
                onClick={() => {
                  clearDeliveryProgress();
                  setDeliveryPhase('idle');
                  setOrderConfirmed(false);
                  setLiveOrderId('');
                  onNavigate('home');
                }}
                className="rounded-2xl bg-dark px-6 py-3 text-xs font-bold text-white"
              >
                Volver al inicio
              </button>
              <button
                type="button"
                onClick={() => setIsCancellationPolicyOpen(true)}
                className="text-[10px] font-semibold text-[#a90000] underline underline-offset-2"
              >
                Política de cancelación y reembolso
              </button>
              {renderCancellationPolicyDialog()}
            </div>
          );
        }
        if (orderStatus === 'available') {
          return (
            <div className="flex min-h-full flex-col items-center justify-center text-center space-y-4 py-10">
              <div className="relative flex h-20 w-20 items-center justify-center rounded-full bg-[#fff3d1] text-[#a90000]" aria-hidden="true">
                <i data-lucide="bike" className="h-9 w-9"></i>
                <span className="absolute inset-0 rounded-full border-2 border-[#a90000]/25 animate-ping"></span>
              </div>
              <div className="space-y-2">
                <h2 className="font-title text-2xl font-bold">Buscando repartidores</h2>
                <p className="mx-auto max-w-[280px] text-xs text-gray-500" role="status" aria-live="polite">
                  Tu pedido está en la lista de repartidores. Te avisaremos aquí cuando uno lo acepte.
                </p>
              </div>
              <p className="text-[10px] font-semibold text-gray-500">{`Pedido #${liveOrderId}`}</p>
              <div className="w-full rounded-2xl border border-[#f1dfb5] bg-[#fffaf0] p-4 text-left text-xs">
                <div className="flex justify-between">
                  <span className="text-gray-500">Punto de recojo</span>
                  <span className="font-bold">{pickupPoint}</span>
                </div>
                <div className="mt-2 flex justify-between">
                  <span className="text-gray-500">Estado</span>
                  <span className="font-bold text-[#a90000]">Esperando aceptación</span>
                </div>
              </div>
              <button
                onClick={() => onNavigate('home')}
                className="bg-dark text-white font-bold px-6 py-3 rounded-2xl text-xs"
              >
                Volver al inicio
              </button>
              {canCancelOrder ? (
                <div className="w-full space-y-2">
                  <button
                    type="button"
                    onClick={cancelOrder}
                    disabled={isCancellingOrder}
                    className="w-full rounded-2xl bg-[#a90000] px-6 py-3 text-xs font-bold text-white disabled:cursor-wait disabled:opacity-70"
                  >
                    {isCancellingOrder ? 'Cancelando pedido…' : 'Cancelar el pedido 🥺'}
                  </button>
                  <button
                    type="button"
                    onClick={() => setIsCancellationPolicyOpen(true)}
                    className="block w-full text-center text-[10px] font-semibold text-[#a90000] underline underline-offset-2"
                  >
                    Política de cancelación y reembolso
                  </button>
                  {cancelOrderError && <p className="text-[10px] text-red-600" role="alert">{cancelOrderError}</p>}
                </div>
              ) : !Number.isFinite(orderCreatedAt) ? (
                <p className="text-center text-[10px] text-gray-500" role="status">Verificando el estado de tu pedido…</p>
              ) : (
                <div className="w-full rounded-2xl border border-[#f1dfb5] bg-[#fffaf0] p-4 text-xs text-gray-600" role="status">
                  Tú pedido ya está listo, no puedes cancelarlo
                </div>
              )}
              {renderCancellationPolicyDialog()}
            </div>
          );
        }
        return (
          <div className="flex min-h-full flex-col items-center justify-center text-center space-y-4 py-8">
            {orderStatus === 'delivered'
              ? renderArrival()
              : deliveryPhase === 'tracking'
                ? <>{renderDeliveryTracking()}{renderRiderProfileCard()}</>
                : deliveryPhase === 'arrived'
                  ? renderArrival()
                  : deliveryPhase === 'idle' && (
              <>
                <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-2">
                  <i data-lucide="check-circle" className="w-10 h-10"></i>
                </div>
                <h2 className="font-title text-2xl font-bold">¡Repartidor asignado!</h2>
                <p className="text-xs text-gray-500 max-w-[250px]">
                  {`${assignedRider?.name || 'El repartidor'} aceptó tu orden #${liveOrderId || 'UPCH-8492'}. El seguimiento comenzará cuando confirme el recojo.`}
                </p>

                <div className="bg-cream/50 border border-cream p-4 rounded-2xl w-full text-left space-y-2">
                  <div className="flex justify-between text-xs">
                    <span className="text-gray-500">Método de pago:</span>
                    <span className="font-bold uppercase">{paymentMethod}</span>
                  </div>
                  <div className="flex justify-between text-xs">
                    <span className="text-gray-500">Punto de recojo:</span>
                    <span className="font-bold">{pickupPoint}</span>
                  </div>
                  <div className="flex justify-between text-xs">
                    <span className="text-gray-500">Repartidor:</span>
                    <span className="font-bold text-green-600">{assignedRider?.name || 'Asignado'}</span>
                  </div>
                </div>

                <div className="flex flex-col w-full space-y-3">
                  <button
                    onClick={() => onNavigate('home')}
                    className="bg-dark text-white font-bold px-6 py-3 rounded-2xl text-xs"
                  >
                    Volver al inicio
                  </button>
                  {canCancelOrder && (
                    <div className="space-y-2">
                      <p className="text-[10px] text-gray-500">Puedes cancelar si aún no se confirmó el recojo.</p>
                      <button
                        type="button"
                        onClick={cancelOrder}
                        disabled={isCancellingOrder}
                        className="w-full rounded-2xl border border-red-200 px-6 py-3 text-xs font-bold text-[#a90000] disabled:cursor-wait disabled:opacity-70"
                      >
                        {isCancellingOrder ? 'Cancelando pedido…' : 'Cancelar pedido'}
                      </button>
                      <button
                        type="button"
                        onClick={() => setIsCancellationPolicyOpen(true)}
                        className="block w-full text-center text-[10px] font-semibold text-[#a90000] underline underline-offset-2"
                      >
                        Política de cancelación y reembolso
                      </button>
                      {cancelOrderError && <p className="text-[10px] text-red-600" role="alert">{cancelOrderError}</p>}
                    </div>
                  )}
                </div>
              </>
                  )}
          {renderCancellationPolicyDialog()}
          </div>
        );
      }

      return (
        <div className="space-y-4 pt-2">
          <div className="flex justify-between items-start">
            <div>
              <p className="text-[11px] font-bold text-brand tracking-wider uppercase">PEDIDO RÁPIDO</p>
              <h2 className="font-title text-2xl font-bold">Tu pedido.</h2>
            </div>
            {!hasBembosDemoItems && (
              <span className="bg-yellow-accent text-dark font-bold text-xs px-3 py-1 rounded-full flex items-center space-x-1">
                <i data-lucide="clock" className="w-3.5 h-3.5"></i><span>5 min</span>
              </span>
            )}
          </div>

          {cart.length === 0 ? (
            <div className="flex flex-col items-center justify-center py-12 text-center space-y-4">
              <div className="w-20 h-20 bg-cream rounded-3xl flex items-center justify-center text-dark">
                <i data-lucide="shopping-bag" className="w-10 h-10"></i>
              </div>
              <div className="space-y-1">
                <h3 className="font-title font-bold text-lg">Tu pedido está vacío</h3>
                <p className="text-xs text-gray-500 max-w-[220px]">Elige un menú, combo o bebida y lo dejamos listo al toque.</p>
              </div>
              <button onClick={() => onNavigate('menu')} className="bg-dark text-white font-bold px-6 py-3 rounded-2xl text-xs flex items-center space-x-2 hover:bg-black transition active:scale-95">
                <span>Explorar el menú</span>
                <i data-lucide="arrow-right" className="w-4 h-4"></i>
              </button>
              <video
                src="/pedido-instrucciones.mp4"
                autoPlay
                loop
                muted
                playsInline
                preload="auto"
                aria-label="Animación con indicaciones para realizar un pedido"
                className="mx-auto block w-full max-w-[420px] max-h-[220px] object-contain"
              />
            </div>
          ) : (
            <div className="space-y-4">
              {hasMixedProviders && (
                <p className="text-[10px] text-gray-500" role="note">
                  Las promociones Bembos y los productos Al Toque se piden por separado.
                </p>
              )}
              {hasMixedProviders && (
                <p className="rounded-xl border border-red-200 bg-red-50 p-3 text-[11px] text-red-700" role="alert">
                  Quita las promociones de uno de los restaurantes antes de continuar.
                </p>
              )}
              {hasInvalidGorritosMix && (
                <p className="rounded-xl border border-red-200 bg-red-50 p-3 text-[11px] text-red-700" role="alert">
                  Los canjes con Gorritos se procesan en un pedido separado. Elimina los otros productos para continuar.
                </p>
              )}
              <div className="space-y-2">
                {cart.map((item) => (
                  <div key={item.cartId} className="bg-white border border-gray-100 rounded-2xl p-3 flex items-center justify-between shadow-sm">
                    <div className="flex items-center space-x-3">
                      {item.isBembosDemo
                        ? <div className="flex h-12 w-12 items-center justify-center rounded-xl bg-amber-100 text-2xl" aria-hidden="true">🍔</div>
                        : <div className="order-item-photo h-12 w-12 shrink-0 rounded-xl" title="Pasa el puntero o mantén el dedo para ampliar la foto">
                          <img src={item.image} alt={item.name} />
                        </div>}
                      <div>
                        <h4 className="font-bold text-xs">{item.name}</h4>
                        {item.isBembosDemo ? (
                          <p className="text-[10px] font-semibold text-amber-800">Bembos</p>
                        ) : item.removedComponents?.length > 0 ? (
                          <p className="text-[10px] text-red-500">Sin: {item.removedComponents.join(', ')}</p>
                        ) : !item.description ? (
                          <p className="text-[10px] text-gray-500">Completo</p>
                        ) : null}
                        {item.description && <p className="mt-0.5 max-w-44 text-[10px] leading-snug text-gray-500">{item.description}</p>}
                        <span className="font-bold text-xs text-brand">
                          {item.gorritosRedemption

    function RiderApp({ onExit, profile }) {
      const distanceToUpchKm = (latitude, longitude) => {
        const toRadians = (degrees) => (degrees * Math.PI) / 180;

        const targetLongitude = -77.0262324;
        const latitudeDifference = toRadians(targetLatitude - latitude);
        const longitudeDifference = toRadians(targetLongitude - longitude);
        const haversine = Math.sin(latitudeDifference / 2) ** 2
          + Math.cos(toRadians(latitude)) * Math.cos(toRadians(targetLatitude))
          * Math.sin(longitudeDifference / 2) ** 2;
        return 6371 * 2 * Math.atan2(Math.sqrt(haversine), Math.sqrt(1 - haversine));

        let isMounted = true;

        let watchId;

            const location = {

              accuracy: position.coords.accuracy

            if (isSending || Date.now() - lastSentAt < 3000) return;

              const payload = await response.json().catch(() => ({}));

              if (isMounted) {

            } catch (error) {
              console.error('No se pudo compartir la ubicación en vivo:', error);

      const lookupGpsAddress = async (latitude, longitude) => {
        let place;
        try {
          const response = await fetch(`/api/location/reverse?lat=${encodeURIComponent(latitude)}&lon=${encodeURIComponent(longitude)}`);
          const result = await response.json();
          if (!response.ok) {
            if (response.status !== 404) throw new Error(result.error || 'No se pudo identificar la dirección.');
            throw new Error('El servidor aún no tiene habilitada la búsqueda de dirección.');
          }
          place = result;
        } catch (proxyError) {
          console.warn('La búsqueda de dirección del servidor no está disponible; se consultará OpenStreetMap directamente.', proxyError);
          try {
            const lookupUrl = new URL('https://nominatim.openstreetmap.org/reverse');
            lookupUrl.search = new URLSearchParams({
              format: 'jsonv2',
              lat: String(latitude),
              lon: String(longitude),
              zoom: '17',
              addressdetails: '1'
            }).toString();
            const response = await fetch(lookupUrl, {
              headers: { 'Accept-Language': 'es' },
              signal: AbortSignal.timeout(6000)
            });
            if (!response.ok) throw new Error(`OpenStreetMap respondió con el estado ${response.status}.`);
            const result = await response.json();
            if (!result?.address) throw new Error('No se encontró una dirección para esta ubicación.');
            place = {
              road: result.address.road || result.address.pedestrian || result.address.residential || result.address.footway || '',
              district: result.address.city_district || result.address.suburb || result.address.town || result.address.city || result.address.municipality || '',
              department: result.address.state || result.address.region || ''
            };
          } catch (fallbackError) {
            console.error('Fallaron la búsqueda de dirección del servidor y la consulta directa a OpenStreetMap:', proxyError, fallbackError);
            setGps((current) => ({
              ...current,
              addressError: fallbackError.message || 'No se pudo identificar la dirección. Inténtalo de nuevo.'
            }));
            return;
          }
        }

        setGps((current) => ({
          ...current,
          department: typeof place.department === 'string' ? place.department : '',
          district: typeof place.district === 'string' ? place.district : '',
          road: typeof place.road === 'string' ? place.road : '',
          addressError: ''
        }));
      };

      const requestGps = () => {

        gpsAddressLookupStartedRef.current = false;
        setGps((current) => ({

          status: 'loading',
          department: '',

          road: '',
          distanceKm: null,
          addressError: '',

        try {
          gpsWatchRef.current = navigator.geolocation.watchPosition(

              const { latitude, longitude, accuracy } = position.coords;
              setGps((current) => ({
                ...current,
                distanceKm: distanceToUpchKm(latitude, longitude),
                status: 'active',

            (error) => {

              }
              const message = error.code === 1

              setGps((current) => ({ ...current, status: 'error', message }));

      const askRiderBotpress = (question) => new Promise((resolve, reject) => {
        const frame = supportBotFrameRef.current;
        if (!frame) {
          reject(new Error('No se pudo iniciar el asistente de soporte.'));
          return;
        }

        let pollTimer;
        let initializeTimer;
        let responseTimer;
        let settleTimer;
        let settled = false;
        const finish = (error, answer) => {
          if (settled) return;
          settled = true;
          window.clearInterval(pollTimer);
          window.clearTimeout(initializeTimer);
          window.clearTimeout(responseTimer);
          window.clearTimeout(settleTimer);
          if (supportBotPendingRef.current?.finish === finish) supportBotPendingRef.current = null;
          if (supportBotRequestRef.current === cancel) supportBotRequestRef.current = null;
          if (error) reject(error);
          else resolve(answer);
        };
        const cancel = (error) => finish(error, '');
        supportBotRequestRef.current = cancel;

        initializeTimer = window.setTimeout(() => {
          finish(new Error('No se pudo conectar con el asistente de Botpress.'));
        }, 20000);

        pollTimer = window.setInterval(() => {
          try {
            const botpress = frame.contentWindow?.botpress;
            if (!botpress?.initialized) return;
            botpress?.open?.();
            if (!botpress.conversationId || typeof botpress.sendMessage !== 'function') return;
            window.clearInterval(pollTimer);
            window.clearTimeout(initializeTimer);
            if (!frame.__altoqueSupportMessageListener) {
              botpress.on('message', (message) => {
                const pending = supportBotPendingRef.current;
                if (!pending || message.authorId === botpress.user?.id) return;
                const text = typeof message.block?.text === 'string' ? message.block.text.trim() : '';
                if (!text) return;
                pending.messages.push(text);
                window.clearTimeout(settleTimer);
                settleTimer = window.setTimeout(
                  () => pending.finish(null, pending.messages.join('\n\n')),
                  2500
                );
              });
              frame.__altoqueSupportMessageListener = true;

            responseTimer = window.setTimeout(() => {
              finish(new Error('Botpress no respondió a tiempo.'));

            supportBotPendingRef.current = { messages: [], finish };
            Promise.resolve(botpress.sendMessage(question)).catch((error) => finish(error));
          } catch (error) {
            finish(error);
          }
        }, 250);
      });

      const handleRiderPhoto = async (event, field) => {
        const file = event.target.files?.[0];
        event.target.value = '';
        if (!file) return;
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
          setProfileFormError('Elige una imagen JPG, PNG o WebP.');
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          setProfileFormError('La imagen debe pesar menos de 8 MB.');
          return;
        }

        const objectUrl = URL.createObjectURL(file);
        try {
          const image = new Image();
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () => reject(new Error('No se pudo leer la imagen seleccionada.'));
            image.src = objectUrl;
          });
          const scale = Math.min(1, 900 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('No se pudo preparar la imagen para guardarla.');
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const photo = canvas.toDataURL('image/jpeg', 0.68);
          if (photo.length > 700_000) throw new Error('La imagen quedó muy pesada; prueba con una foto más pequeña.');
          setRiderDetails((current) => ({ ...current, [field]: photo }));
          setProfileFormError('');
        } catch (error) {
          setProfileFormError(error.message || 'No se pudo guardar la imagen.');
        } finally {
          URL.revokeObjectURL(objectUrl);
